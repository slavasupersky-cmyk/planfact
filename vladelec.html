var KEY='topf-owner-v41', mem=null;

var NK=[{k:'sdelka',l:'сделки'},{k:'pd',l:'задаток'},{k:'pokaz',l:'показы'},{k:'ocenka',l:'оценки'},{k:'vstr',l:'встречи'},{k:'rekl',l:'реклама'},{k:'leads',l:'заявки'}];
function money(n){ return Number(n||0).toLocaleString('ru-RU')+' ₽'; }
function mln(n){ return (n/1000000).toFixed(1).replace('.',',')+' млн'; }
function kk(n){ return Math.round(n/1000)+'к'; }
function pf(f,n){

function pct(f,n){ var v=n?Math.round(f/n*100):0; return '<span class="pct'+(v>=100?' over':'')+'">'+v+'%</span>'; }
function esc(s){ return String(s==null?'':s).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); }
function iso(d){ return d.toISOString().slice(0,10); }
function plus(n){ return iso(new Date(Date.now()+n*864e5)); }
var MN=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'], WD=['вс','пн','вт','ср','чт','пт','сб'];
function ru(d){ var p=String(d).split('-'); return parseInt(p[2],10)+' '+MN[parseInt(p[1],10)-1]; }
function rud(d){ var dt=new Date(d+'T00:00:00'); return WD[dt.getDay()]+', '+ru(d); }
function ini(n){ var p=n.split(' '); return (p[0]||'')[0]+((p[1]||'')[0]||''); }
function warn(t){ flash(t,true); }
function flash(txt,bad){ var e=document.createElement('div'); e.style.cssText='position:fixed;left:0;right:0;top:0;z-index:60;padding:16px 14px;text-align:center;font-weight:600;font-size:15px;'+(bad?'background:#E03A2F;color:#fff':'background:#AEEA00;color:#0F0F0F'); e.textContent=txt; document.body.appendChild(e); setTimeout(function(){ if(e.parentNode) e.parentNode.removeChild(e); },bad?2600:1800); }

/* ================= генератор истории ================= */
function _rnd(seed){ return function(){ seed=(seed*1664525+1013904223)%4294967296; return seed/4294967296; }; }
function _iso(y,m,d){ return y+'-'+('0'+m).slice(-2)+'-'+('0'+d).slice(-2); }
function _dow(dstr){ return new Date(dstr+'T00:00:00').getDay(); }
function _monday(dstr){ var d=new Date(dstr+'T00:00:00'), sh=(d.getDay()+6)%7; d.setDate(d.getDate()-sh); return d.toISOString().slice(0,10); }
var MNAMES=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

/* дни: с 1 августа по вчера · выходные не сдаются, пятница закрывает три дня */
function histDays(seedNum,scale){
  var r=_rnd(seedNum), out=[], today=new Date(), end=new Date(Date.now()-864e5);
  var cur=new Date(today.getFullYear(),7,1);
  while(cur<=end){
    var ds=cur.toISOString().slice(0,10), dw=cur.getDay();
    if(dw!==0&&dw!==6){
      var wk=(dw===5?2.2:1); // пятница закрывает выходные
      var c={
        pokaz: Math.round((0.6+r()*1.2)*scale*wk),
        ocenka:Math.round((0.5+r()*1.0)*scale*wk),
        vstr:  Math.round((0.4+r()*1.0)*scale*wk),
        rekl:  Math.round((0.2+r()*0.5)*scale*wk),
        pd:    scale<=1.2 ? (r()<0.22*scale?1:0) : Math.round((0.12+r()*0.22)*scale*wk),
        sdelka:scale<=1.2 ? (r()<0.16*scale?1:0) : Math.round((0.08+r()*0.16)*scale*wk),
        leads: Math.round((1.5+r()*2.5)*scale*wk)
      };
      var plan=c.pokaz+c.ocenka+c.vstr+c.rekl+c.pd+c.sdelka+Math.round(r()*2);
      var fact=c.pokaz+c.ocenka+c.vstr+c.rekl+c.pd+c.sdelka;
      out.push({date:ds,cls:c,plan:Math.max(plan,fact),fact:fact,
        ref:r()<0.28?1:0, mv:r()<0.35?1:0,
        status:(r()<0.12?'extra':'accepted'), sum:c.pd*Math.round(85+r()*45)*1000});
    }
    cur.setDate(cur.getDate()+1);
  }
  return out;
}
function _agg(days){
  var a={sdelka:0,pd:0,pokaz:0,ocenka:0,vstr:0,rekl:0,leads:0,plan:0,fact:0,ref:0,mv:0,sum:0};
  for(var i=0;i<days.length;i++){ var d=days[i];
    for(var k in d.cls) a[k]+=d.cls[k];
    a.plan+=d.plan; a.fact+=d.fact; a.ref+=d.ref; a.mv+=d.mv; a.sum+=d.sum||0; }
  return a;
}
function histWeeks(days,normW,mult){
  var by={}, out=[];
  for(var i=0;i<days.length;i++){ var m=_monday(days[i].date); (by[m]=by[m]||[]).push(days[i]); }
  for(var mk in by){ var a=_agg(by[mk]), w={};
    for(var k in normW) w[k]=(a[k]||0)+'/'+(normW[k]*(mult||1));
    var last=by[mk][by[mk].length-1].date;
    out.push({kind:'week',date:mk,label:'Неделя '+ru(mk)+' – '+ru(last),w:w,sum:a.sum,plan:a.plan,fact:a.fact,ref:a.ref,mv:a.mv,leads:a.leads});
  }
  out.sort(function(x,y){ return x.date<y.date?1:-1; }); return out;
}
function histMonths(days,normM,mult){
  var by={}, out=[];
  for(var i=0;i<days.length;i++){ var m=days[i].date.slice(0,7); (by[m]=by[m]||[]).push(days[i]); }
  for(var mk in by){ var a=_agg(by[mk]), w={};
    for(var k in normM) w[k]=(a[k]||0)+'/'+(normM[k]*(mult||1));
    out.push({kind:'month',date:mk+'-01',label:MNAMES[parseInt(mk.slice(5,7),10)-1].replace(/^./,function(c){return c.toUpperCase();}),
      w:w,sum:a.sum,plan:a.plan,fact:a.fact,ref:a.ref,mv:a.mv,leads:a.leads});
  }
  out.sort(function(x,y){ return x.date<y.date?1:-1; }); return out;
}

function seed(){

    month:{sdelka:k[0]*3,pd:k[1]*3,pokaz:k[2]*4,ocenka:k[3]*4,vstr:k[4]*4,rekl:k[5]*4,leads:k[6]*4},pdSum:k[1]*100000,low:!!prev}; };
  function dep(id,name,rop,agents,sent,got,prevPd){

      date:plus([-1,0,2,5,9,20][q]), done:q%3===0});
    return {id:id,name:name,rop:rop,agents:agents,sent:sent,got:got,prevPd:prevPd,fc:fc};
  }
  return {
    user:null,date:t,dateY:y,
    norm:{sdelka:4,pd:4,pokaz:20,ocenka:20,vstr:20,rekl:8,leads:40}, normW:{sdelka:1,pd:1,pokaz:5,ocenka:5,vstr:5,rekl:2,leads:10},
    monthPlan:14000000, signedMonth:2100000, signedPrevSame:2600000, daysPassed:4, daysTotal:22,
    deps:[
      dep(1,'Отдел №1','Ковалёва Марина',[A('Кастромина Ольга',[1,2,8,5,4,3,19]),A('Розанова Мария',[1,2,9,6,5,2,22]),A('Титова Вера',[0,1,7,4,3,2,16]),A('Зуева Светлана',[0,1,7,5,4,2,17]),A('Ершова Дарья',[1,2,8,5,5,3,21]),A('Лапина Ольга',[0,0,3,2,1,1,8],true),A('Мельник Алина',[0,0,2,1,0,0,5],true),A('Сомова Ксения',[0,0,1,0,0,0,2]),A('Гончарова Елена',[0,0,4,2,2,2,11]),A('Кондратьева Ирина',[0,0,6,3,3,1,14]),A('Панова Ирина',[0,1,5,3,2,1,12])],11,true,8),
      dep(2,'Отдел №2','Титов Сергей',[A('Агеева Лидия',[1,1,7,4,4,2,18]),A('Белова Юлия',[0,1,6,4,3,2,15]),A('Волкова Дарья',[1,2,8,5,4,3,20]),A('Громова Инна',[0,0,4,2,2,1,10],true),A('Дьякова Анна',[0,1,5,3,3,2,13]),A('Ежова Мария',[0,0,3,2,1,1,9]),A('Жукова Ольга',[1,1,6,4,3,2,16]),A('Зорина Вера',[0,0,2,1,1,0,6],true),A('Ильина Софья',[0,1,5,3,2,1,12]),A('Кузина Алла',[0,0,4,2,2,1,11])],8,true,6),
      dep(3,'Отдел №3','Ершова Наталья',[A('Лебедева Ника',[0,1,4,2,2,1,10]),A('Мишина Раиса',[0,0,3,1,1,1,7]),A('Носова Нина',[0,0,2,1,1,0,5],true),A('Орлова Вера',[0,1,4,2,2,1,9]),A('Панина Зоя',[0,0,3,2,1,1,8]),A('Рыжова Таисия',[0,0,2,1,0,0,4]),A('Седова Кира',[0,0,3,1,1,1,6])],6,false,4)
    ],
    reports:(function(){
      var wn={sdelka:1,pd:1,pokaz:5,ocenka:5,vstr:5,rekl:2,leads:10};
      var mn={sdelka:4,pd:4,pokaz:20,ocenka:20,vstr:20,rekl:8,leads:40};
      var days=histDays(20260701,26), out=[];
      for(var i=days.length-1;i>=0;i--){ var d=days[i];
        out.push({kind:'day',date:d.date,label:rud(d.date),signed:d.sum||Math.round(d.cls.pd*105000),
          pd:d.cls.pd,deals:d.cls.sdelka,leads:d.cls.leads,
          disc:(26-(i%4))+' из 28',plan:d.plan,fact:d.fact,ref:d.ref,mv:d.mv}); }
      var wks=histWeeks(days,wn,28).map(function(r){ r.signed=r.sum||r.w.pd.split('/')[0]*105000; r.pd=Number(r.w.pd.split('/')[0]); r.deals=Number(r.w.sdelka.split('/')[0]); r.disc='92%'; return r; });
      var mns=histMonths(days,mn,28).map(function(r){ r.signed=r.sum||r.w.pd.split('/')[0]*105000; r.pd=Number(r.w.pd.split('/')[0]); r.deals=Number(r.w.sdelka.split('/')[0]); r.disc='89%'; return r; });
      return out.concat(wks).concat(mns);
    })()
  };
}
var state=load()||seed();
(function(){ var d=seed(); for(var k in d){ if(typeof state[k]==='undefined') state[k]=d[k]; } if(state.date!==iso(new Date())){ var u=state.user; state=seed(); state.user=u; } save(); })();

/* ================= расчёты ================= */
function normM(k){ return state.norm[k]||0; } function normW(k){ return state.normW[k]||0; }
function agents(){ var o=[]; for(var i=0;i<state.deps.length;i++) o=o.concat(state.deps[i].agents); return o; }
function depSum(d,p,k){ var n=0; for(var i=0;i<d.agents.length;i++) n+=d.agents[i][p][k]||0; return n; }
function coSum(p,k){ var n=0; for(var i=0;i<state.deps.length;i++) n+=depSum(state.deps[i],p,k); return n; }
function coNorm(p,k){ return (p==='week'?normW(k):normM(k))*agents().length; }
function depNorm(d,p,k){ return (p==='week'?normW(k):normM(k))*d.agents.length; }
function sentAll(){ var s=0,n=0; for(var i=0;i<state.deps.length;i++){ s+=state.deps[i].sent; n+=state.deps[i].agents.length; } return [s,n]; }
function pace(){ var expected=state.monthPlan*state.daysPassed/state.daysTotal; return Math.round((state.signedMonth/expected-1)*100); }

/* ================= рендер ================= */
var nav='money', openD=null, pickName=null, per='week', fcMode='week';
var OWNER='Прохорова Елена';
function markOver(){
  var list=document.querySelectorAll('.pf');
  for(var i=0;i<list.length;i++){
    var f=list[i].querySelector('.f'), p=list[i].querySelector('.p');
    if(!f||!p) continue;
    var a=parseFloat(f.textContent.replace(/\s/g,'')), b=parseFloat(p.textContent.replace(/\s/g,''));
    if(!isNaN(a)&&!isNaN(b)) f.className = (a>=b&&b>0) ? 'f over' : 'f';
    var pc=list[i].parentNode&&list[i].parentNode.querySelector('.pct');
    if(pc){ var v=parseFloat(pc.textContent); pc.className = (v>=100)?'pct over':'pct'; }
  }
}
function render(){ try{ draw(); markOver(); }catch(e){ document.getElementById('root').innerHTML='<div class="app"><div class="card"><span class="t">Что-то пошло не так</span><button class="btn" onclick="hardReset()">Очистить и открыть заново</button><div class="hint">'+esc(e.message)+'</div></div></div>'; } }
function hardReset(){ try{ localStorage.removeItem(KEY);}catch(e){} mem=null; state=seed(); save(); location.reload(); }
function draw(){
  var r=document.getElementById('root');
  if(!state.user){ r.innerHTML=loginHTML(); return; }
  var body = openD? depHTML() : nav==='money'? (moneyHTML()+fcHTML()) : nav==='funnel'? funnelHTML() : nav==='deps'? depsHTML() : nav==='people'? peopleHTML() : setHTML();
  r.innerHTML='<div class="app">'+hdrHTML()+body+
    '<div class="foot">ТОЧНО. · кабинет собственника v5.1.0 · прототип<br>Данные выдуманные.<br><button onclick="resetAll()">сбросить и начать заново</button></div></div>'+
    '<div class="bottom"><div class="in"><div class="nav" style="grid-template-columns:repeat(5,1fr)">'+nb('money','money','Деньги')+nb('funnel','funnel','Воронка')+nb('deps','chart','Отделы')+nb('people','users','Люди')+nb('set','tune','Настройки')+'</div></div></div>';
}
function nb(k,i,n){ return '<button class="'+(nav===k&&!openD?'on':'')+'" onclick="go(\''+k+'\')"><b>'+ic(i,24)+'</b>'+n+'</button>'; }
function go(k){ nav=k; openD=null; render(); try{ window.scrollTo(0,0); }catch(e){} }
function hdrHTML(){
  var n=state.deps.length;
  return '<div class="hdr"><div class="row">'+'<div class="col brand">ТОЧНО<i>.</i></div>'+'<div class="col mid"><div class="top">план / факт</div>'+'<div class="bot">Собственник · v5.1.0</div></div>'+'<div class="col end"><div class="top">'+esc(state.user)+'</div>'+'<div class="bot">'+rud(state.date)+'</div></div>'+'</div>'+
    '<div class="cmp">В прошлом месяце к этому дню было <b>'+mln(state.signedPrevSame)+'</b></div>'+
    '<div class="bar"><i style="width:'+Math.min(Math.round(state.signedMonth/state.monthPlan*100),100)+'%"></i></div></div>';
  h+='<div class="grid"><div><b class="good">'+money(r.signed).replace(' ₽','')+'</b><span>подписано вчера</span></div><div><b>'+r.pd+'</b><span>задатков</span></div><div><b class="'+(s[0]===s[1]?'good':'bad')+'">'+s[0]+'/'+s[1]+'</b><span>сдали</span></div></div>';
  h+='<div class="sec warn">Отклонения</div>';
  var dev=[];
  for(var i=0;i<state.deps.length;i++){ var d=state.deps[i];
    if(!d.got) dev.push({d:d,why:'нет отчёта от РОПа'});
    var pd=depSum(d,'week','pd'), pn=depNorm(d,'week','pd'); if(pd<pn*0.5) dev.push({d:d,why:'задатки '+pd+' из '+pn+' — меньше половины нормы'});
    if(d.sent<d.agents.length*0.8) dev.push({d:d,why:'сдали '+d.sent+' из '+d.agents.length});
  }
  if(!dev.length) h+='<div class="hint">Отклонений нет — можно не заходить.</div>';
  for(var j=0;j<dev.length;j++) h+='<button class="task noic bad" onclick="openDep('+dev[j].d.id+')"><div class="c"><b>'+dev[j].d.id+'</b><span>отдел</span></div><div class="c"><b>'+esc(dev[j].d.name)+'</b><span class="wrap">'+esc(dev[j].why)+'</span></div><div class="r"><span class="st no">смотреть</span></div></button>';
  h+='<div class="sec">Отделы за вчера</div>';
  for(var k=0;k<state.deps.length;k++){ var dp=state.deps[k], pct=Math.round(dp.sent/dp.agents.length*100);
    h+='<button class="task noic'+(dp.got?'':' bad')+'" onclick="openDep('+dp.id+')"><div class="c"><b>'+dp.id+'</b><span>'+dp.agents.length+' чел</span></div><div class="c"><b>'+esc(dp.name)+'</b><span>'+esc(dp.rop)+' · сдали '+dp.sent+' из '+dp.agents.length+' · '+pct+'%</span></div><div class="r"><span class="st '+(dp.got?'ok':'no')+'">'+(dp.got?'отчёт есть':'отчёта нет')+'</span></div></button>'; }
  h+='<div class="sec">Архив · только просмотр</div>';
  var grp=function(t,kind){ var l=[]; for(var i=0;i<state.reports.length;i++) if(state.reports[i].kind===kind) l.push(i); if(!l.length) return '';
    var x='<details><summary><span>'+t+'</span><span class="cnt">'+l.length+'</span><span class="arw"></span></summary><div class="dbody">';
    for(var j=0;j<l.length;j++){ var rr=state.reports[l[j]]; x+='<button class="task noic" onclick="openRep('+l[j]+')"><div class="c"><b>'+ru(rr.date)+'</b><span>'+kind+'</span></div><div class="c"><b>'+esc(rr.label)+'</b><span>'+money(rr.signed)+' · задатков '+rr.pd+'</span></div><div class="r"><span class="st mv">открыть</span></div></button>'; }
    return x+'</div></details>'; };
  return h+grp('Ежедневные','day')+grp('Еженедельные','week')+grp('Ежемесячные','month');
}
function openRep(i){ var r=state.reports[i];
  if(r.kind!=='day'){ var x='<h3>'+esc(r.label)+'</h3><span class="sh">'+(r.kind==='week'?'итог недели':'итог месяца')+'</span><div class="card">';
    for(var j=0;j<NK.length;j++){ var v=r.w[NK[j].k]; if(!v) continue; var p2=v.split('/');
      x+='<div class="kv"><span>'+NK[j].l+'</span><span class="pf"><span class="f">'+p2[0]+'</span><span class="sl">/</span><span class="p">'+p2[1]+'</span></span><span class="pct">'+Math.round(p2[0]/p2[1]*100)+'%</span></div>'; }
    x+='<div class="kv two"><span>Подписано</span><b class="g">'+money(r.signed)+'</b></div></div>'+

function fcHTML(){

  for(var i=0;i<state.deps.length;i++){ var dp=state.deps[i];
    for(var j=0;j<(dp.fc||[]).length;j++){ var f=dp.fc[j];

              : fcMode==='today'? f.date===state.date
              : fcMode==='week'? f.date<=plus(6)
              : fcMode==='month'? f.date<=plus(30) : f.date>plus(30);

    } }
  var S=function(l){ var s2=0; for(var i2=0;i2<l.length;i2++) s2+=Number(l[i2].f.sum||0); return s2; };
  var ps=S(plan),fs=S(fact),ls=S(late), all=ps+fs+ls;

     '<div class="bar"><i style="width:'+(all?Math.min(Math.round(fs/all*100),100):0)+'%"></i></div>'+
