<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ТоПФ — Кабинет владельца</title>
<style>
:root{
  color-scheme:light dark;
  --ink:#101010; --ink-2:#5A5A5A; --mute:#757575;
  --line:#E6E6E6; --paper:#FFFFFF; --card:#FFFFFF;
  --surface:#FAFAFA; --surface-2:#F0F0F0;
  --dot:#0D7A46; --on-dot:#FFFFFF; --star:#8A6100; --red:#B3261E;
  --dot:#0D7A46; --on-dot:#FFFFFF; --star:#8A6100; --red:#B3261E;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#F4F4F4;--ink-2:#9A9A9A;--mute:#8E8E8E;--line:#242424;--paper:#0A0A0A;--card:#131313;--surface:#131313;--surface-2:#1C1C1C;--dot:#AEEA00;--on-dot:#0A0A0A;--star:#D9A03A;--red:#FF6B6B}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.55}
.app{max-width:560px;margin:0 auto;padding:14px 14px 130px}
button{font-family:inherit}

.login{max-width:420px;margin:0 auto;padding:56px 18px}
.login .mark{font-size:26px;font-weight:600;letter-spacing:-.03em;margin-bottom:6px}
.login .mark i{font-style:normal;color:var(--dot)}
.login .sub{font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,Consolas,monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:34px}
.login h2{font-size:21px;letter-spacing:-.02em;margin:0 0 16px}
.pick{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:2px;padding:14px;margin-bottom:7px;font-size:15px;color:var(--ink-2)}
.pick.on{border-color:var(--dot);border-width:2px;color:var(--ink);font-weight:700}
.login .note{font-size:12.5px;color:var(--mute);margin-top:12px;text-align:center}

.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:12px;border-bottom:2px solid var(--ink);margin-bottom:14px}
.mark{font-size:20px;font-weight:600;letter-spacing:-.03em;line-height:1}
.mark i{font-style:normal;color:var(--dot)}
.mark small{display:block;font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:400;margin-top:5px}
.who{text-align:right}
.who b{display:block;font-size:14px}
.who span{font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,Consolas,monospace;font-size:10px;letter-spacing:.08em;color:var(--mute)}

.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:13px;margin-bottom:12px}
.card.hero{border-left:3px solid var(--dot)}
.card .t{font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:9px}
.big{font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1}
.big small{display:block;font-size:12.5px;font-weight:400;color:var(--ink-2);letter-spacing:0;margin-top:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.grid3 div{background:var(--surface);border-radius:2px;padding:8px 5px;text-align:center}
.grid3 b{display:block;font-size:17px;font-weight:600;letter-spacing:-.03em}
b.good{color:var(--dot)} b.bad{color:var(--red)}
.grid3 span{font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.bar{height:7px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin:9px 0 4px}
.bar i{display:block;height:100%;background:var(--dot)}
.bar i.red{background:var(--red)} .bar i.st{background:var(--star)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;color:var(--ink-2);padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv b{color:var(--ink);text-align:right;white-space:nowrap}
.kv b.g{color:var(--dot)} .kv b.r{color:var(--red)} .kv b.s{color:var(--star)}

.sec{font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:16px 2px 8px}
.sec.warn{color:var(--red)}
.item{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:2px;padding:12px 13px;margin-bottom:8px;display:flex;gap:11px;align-items:center;color:inherit}
.item.alert{border-color:var(--red)}
.item .ic{width:44px;height:44px;flex:none;border-radius:2px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:var(--dot)}
.item .tx{flex:1;min-width:0}
.item .tp{font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.item .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:13.5px;color:var(--ink-2)}
.item .rt{font-size:14px;font-weight:600;flex:none;text-align:right}
.rt.ok{color:var(--dot)} .rt.mv{color:var(--star)} .rt.no{color:var(--red)}
.add{width:100%;background:transparent;border:1.5px dashed var(--line);color:var(--mute);border-radius:2px;padding:13px;font-size:14px;font-weight:600;margin-bottom:8px}
.hint{font-size:13.5px;color:var(--mute);margin:2px 4px 12px}
.back{background:none;border:0;color:var(--mute);font-size:14px;padding:4px 0 10px;font-weight:600}
.funnel{margin-top:4px}
.frow{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.frow .fb{height:26px;border-radius:2px;background:var(--dot);opacity:.85;min-width:6px}
.frow .fl{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.frow .fn{font-weight:600;font-size:13.5px;margin-left:auto}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);border-top:1px solid var(--line)}
.bottom .in{max-width:560px;margin:0 auto;padding:10px 14px calc(8px + env(safe-area-inset-bottom))}
.nav{display:flex;gap:2px}
.nav button{flex:1;background:none;border:0;color:var(--mute);font-size:11.5px;padding:6px 2px;border-radius:2px}
.nav button b{display:flex;justify-content:center;margin-bottom:3px;font-weight:400}
.nav button.on{color:var(--dot);font-weight:600}

.ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}
.ovl.on{display:flex}
.sheet{background:var(--paper);width:100%;max-width:560px;margin:0 auto;border-radius:2px 2px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
.sheet h3{margin:0 0 3px;font-size:18px;letter-spacing:-.02em}
.sheet .sh{font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:14px}
.lbl{font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:14px 2px 6px}
input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:2px;padding:13px;font-size:16px;font-family:inherit;color:var(--ink)}
.sbtn{display:flex;gap:8px;margin-top:18px}
.sbtn button{flex:1;border-radius:2px;padding:15px;font-size:15px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink-2)}
.sbtn button.pri{background:var(--dot);color:var(--on-dot);border-color:var(--dot)}
.warnbox{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--star);border-radius:2px;padding:13px;font-size:13px;color:var(--ink-2);margin-top:12px}
.foot{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute);text-align:center}
.foot button{background:none;border:0;color:var(--mute);font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,Consolas,monospace;font-size:11px;text-decoration:underline;padding:6px}
</style>
</head>
<body>
<div id="root"></div>
<div class="ovl" id="ovl" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>

<script>
/* ============ иконки · сетка 24, линия 2, цвет от темы ============ */
var IC={
list:'<rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M8 8h8M8 12h8M8 16h5"/>',
users:'<circle cx="9" cy="8" r="3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.5a3 3 0 0 1 0 5.5"/><path d="M17.5 14a6 6 0 0 1 3 6"/>',
chart:'<path d="M4 20h16"/><path d="M7.5 20v-5M12 20v-9M16.5 20v-6"/>',
home:'<path d="M4 11 12 4l8 7"/><path d="M6.5 10v10h11V10"/>',
search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/>',
money:'<rect x="3" y="6" width="18" height="12" rx="1.5"/><circle cx="12" cy="12" r="2.5"/>',
doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 17h4"/>',
meet:'<circle cx="8" cy="8.5" r="2.5"/><circle cx="16" cy="8.5" r="2.5"/><path d="M3.5 19a4.5 4.5 0 0 1 9 0"/><path d="M11.5 19a4.5 4.5 0 0 1 9 0"/>',
screen:'<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M9 20h6M12 16v4"/>',
phone:'<path d="M5 4h3.5l1.8 4.5-2.3 1.4a12 12 0 0 0 5.1 5.1l1.4-2.3L19 14.5V18a1.5 1.5 0 0 1-1.7 1.5A15.5 15.5 0 0 1 3.5 5.7 1.5 1.5 0 0 1 5 4z"/>',
target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 12h.01"/>',
check:'<circle cx="12" cy="12" r="8.5"/><path d="M8 12.5l2.6 2.6L16 9.5"/>',
undo:'<path d="M4.5 9H13a6 6 0 1 1 0 12H8.5"/><path d="M8 4.5 4 9l4 4.5"/>',
cross:'<circle cx="12" cy="12" r="8.5"/><path d="M9.2 9.2l5.6 5.6M14.8 9.2l-5.6 5.6"/>',
dash:'<circle cx="12" cy="12" r="8.5" stroke-dasharray="3 3.6"/>',
star:'<path d="M12 3.8l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.9l5.8-.8z"/>',
past:'<path d="M3.8 12a8.2 8.2 0 1 0 2.6-6"/><path d="M3.5 3.5v4.2h4.2"/><path d="M12 8v4.4l3 1.8"/>',
future:'<rect x="3" y="5" width="18" height="16" rx="1.5"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M9.5 15.5h5.5m-2-2.2 2.2 2.2-2.2 2.2"/>',
norm:'<path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15.5" cy="12" r="2"/><circle cx="7.5" cy="17" r="2"/>',
bolt:'<path d="M13.5 3 5.5 13.5H11l-.5 7.5 8-10.5H13z"/>',
send:'<path d="M20.5 3.5 3.5 10.8l7 2.9 2.9 7z"/><path d="M20.5 3.5 10.5 13.7"/>',
pin:'<path d="M9 3h6l-1 5.2 3 2.8v2H7v-2l3-2.8z"/><path d="M12 13v8"/>',
key:'<circle cx="8" cy="8" r="4.2"/><path d="M11 11l9 9"/><path d="M16.5 16.5 18.5 14.5M14.5 14.5 16.5 12.5"/>',
alert:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.5M12 16.5v.01"/>',
edit:'<path d="M4 20h4.2L20 8.2 15.8 4 4 15.8z"/><path d="M14 6.2 17.8 10"/>',
ok:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'
};
function ic(n,s){ s=s||26; return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block">'+(IC[n]||'')+'</svg>'; }

var KEY='topf-owner-v1', mem=null;
function save(){ var s=JSON.stringify(state); try{ localStorage.setItem(KEY,s);}catch(e){ mem=s; } }
function load(){ var s=null; try{ s=localStorage.getItem(KEY);}catch(e){ s=mem; } if(!s)s=mem;
  if(!s) return null; try{ return JSON.parse(s);}catch(e){ return null; } }

function money(n){ return Number(n).toLocaleString('ru-RU')+' ₽'; }
function k(n){ return Math.round(n/1000)+'к'; }
function mln(n){ return (n/1000000).toFixed(1)+' млн'; }
function esc(s){ return (s||'').replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); }
function ru(d){ var p=d.split('-'),M=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return parseInt(p[2],10)+' '+M[parseInt(p[1],10)-1]; }

function seed(){
  var d=new Date(), y=new Date(Date.now()-864e5);
  return {
    user:null, date:d.toISOString().slice(0,10), dateY:y.toISOString().slice(0,10),
    norm:{rev:500000,pd:4,ver:'2026',from:'01.01.2026'},
    teams:[
      {id:1,name:'Отдел №1',rop:'Ковалёва Марина',n:11,pct:96,perAgent:470000,pdPer:3.8,rekl:42,pokPerPd:9.4,sent:11,
       low:['Панова Ирина'],trainees:1},
      {id:2,name:'Отдел №2',rop:'Титов Сергей',n:10,pct:74,perAgent:412000,pdPer:3.1,rekl:38,pokPerPd:10.5,sent:8,
       low:['Мельник Алина','Сомова Ксения'],trainees:2},
      {id:3,name:'Отдел №3',rop:'Ершова Наталья',n:7,pct:31,perAgent:288000,pdPer:2.2,rekl:19,pokPerPd:16.1,sent:6,
       low:['Лапина Ольга'],trainees:2}
    ],
    day:{signed:512000,od:5,cash:1100000,planToday:{pd:8,pokaz:14}},
    alerts:[
      {t:'15:00',w:'Задаток 450 000 ₽ · Отдел №1',bad:false},
      {t:'вчера',w:'Отдел №3: нет задатков 4-й день',bad:true},
      {t:'вчера',w:'Ушло мимо: 105 000 ₽ · Отдел №2',bad:true}
    ],
    month:{signed:8400000,plan:14000000,days:13,ofDays:22,fc:13100000,hit:64,
           od:7900000,cash:6100000,cancel:2,cancelSum:500000,lag:41},
    funnel:{leads:412,ocenka:96,pokaz:318,pd:31,od:28,rekl:99},
    people:{total:28,trainees:5,left:2,lowMonths:4,firstDealWeek:7},
    quality:{plans:84,closed:79,edits:37,editSums:6,worst:'Отдел №3',worstPct:61,
      log:[{who:'Титов Сергей',what:'сумма ПД 95 000 → 105 000',when:'вчера 19:40'},
           {who:'Ершова Наталья',what:'добавлен показ за 18.07',when:'позавчера 09:12'},
           {who:'Ковалёва Марина',what:'изменена причина срыва',when:'20.07 11:03'}]}
  };
}
var state=load()||seed();
(function migrate(){
  var d=seed();
  for(var k in d){ if(typeof state[k]==='undefined') state[k]=d[k]; }
  if(state.date!==new Date().toISOString().slice(0,10)){ var u=state.user; state=seed(); state.user=u; }
  save();
})();

var nav='today', openTeam=null, pickName=null;
var OWNER='Прохорова Елена';

function render(){
  try{ draw(); }catch(e){
    document.getElementById('root').innerHTML=
      '<div class="app"><div class="card"><div class="t">Что-то пошло не так</div>'+
      '<p style="font-size:14px;margin:0 0 12px">Скорее всего сохранились данные прошлой версии.</p>'+
      '<button class="add" onclick="hardReset()">Очистить и открыть заново</button></div></div>';
  }
}
function hardReset(){ try{ localStorage.removeItem(KEY); }catch(e){} mem=null; state=seed(); save(); location.reload(); }
function draw(){
  var r=document.getElementById('root');
  if(!state.user){ r.innerHTML=loginHTML(); return; }
  var body='';
  if(openTeam) body=teamHTML();
  else if(nav==='today') body=todayHTML();
  else if(nav==='teams') body=teamsHTML();
  else if(nav==='money') body=moneyHTML();
  else if(nav==='data')  body=dataHTML();
  r.innerHTML='<div class="app">'+
    '<div class="hdr"><div class="mark">ТОЧНО<i>.</i><small>план / факт · v0.1</small></div>'+
    '<div class="who"><b>'+esc(state.user)+'</b><span>3 отдела · '+ru(state.date)+'</span></div></div>'+
    body+
    '<div class="foot">ТоПФ · кабинет владельца v0.1 · прототип.<br>Данные выдуманные и хранятся только на этом устройстве.<br>'+
    '<button onclick="resetAll()">сбросить и начать заново</button></div></div>'+
    '<div class="bottom"><div class="in"><div class="nav">'+
      nb('today','chart','Сегодня')+nb('teams','users','Отделы')+nb('money','money','Деньги')+nb('data','search','Данные')+
    '</div></div></div>';
}
function nb(kk,i,n){ return '<button class="'+(nav===kk&&!openTeam?'on':'')+'" onclick="go(\''+kk+'\')"><b>'+ic(i,26)+'</b>'+n+'</button>'; }
function go(kk){ nav=kk; openTeam=null; render(); }

function loginHTML(){
  var h='<div class="login"><div class="mark">ТОЧНО<i>.</i></div><div class="sub">план / факт · v0.1</div><h2>Вход в кабинет</h2>'+
    '<button class="pick'+(pickName===OWNER?' on':'')+'" onclick="pickName=\''+OWNER+'\';render()">'+OWNER+'</button>'+
    '<div class="lbl">Пароль</div><input type="password" id="pw" placeholder="••••••">'+
    '<div class="sbtn"><button class="pri" onclick="doLogin()">Войти</button></div>'+
    '<div class="note">Пароль в прототипе любой.</div></div>';
  return h;
}
function doLogin(){
  var pw=document.getElementById('pw');
  if(!pickName){ alert('Выберите себя'); return; }
  if(!pw.value){ alert('Введите пароль'); return; }
  state.user=pickName; save(); render();
}

/* ===== V1 · сегодня ===== */
function todayHTML(){
  var sent=0,tot=0;
  for(var i=0;i<state.teams.length;i++){ sent+=state.teams[i].sent; tot+=state.teams[i].n; }
  var h='<div class="card hero"><div class="t">Пришло до 11:00 от трёх РОПов</div>'+
    '<div class="big">'+money(state.day.signed)+'<small>подписанная комиссия за '+ru(state.dateY)+'</small></div></div>';
  h+='<div class="sec">Отделы вчера</div>';
  for(var j=0;j<state.teams.length;j++){ var t=state.teams[j];
    var cls=t.pct>=90?'ok':(t.pct>=60?'mv':'no');
    h+='<button class="item'+(t.pct<50?' alert':'')+'" onclick="showTeam('+t.id+')"><div class="ic">'+t.id+'</div>'+
       '<div class="tx"><div class="tp">'+esc(t.rop)+' · '+t.n+' человек</div>'+
       '<div class="nm">'+t.name+'</div></div><span class="rt '+cls+'">'+t.pct+'%</span></button>';
  }
  h+='<div class="card"><div class="t">Ещё за вчера</div>'+
    '<div class="kv"><span>Основных договоров</span><b>'+state.day.od+'</b></div>'+
    '<div class="kv"><span>Зайдёт в кассу за неделю</span><b>'+mln(state.day.cash)+'</b></div>'+
    '<div class="kv"><span>План на сегодня</span><b>'+state.day.planToday.pd+' задатков, '+state.day.planToday.pokaz+' показов</b></div>'+
    '<div class="kv"><span>Сдали до 10:00</span><b class="'+(sent===tot?'g':'r')+'">'+sent+' из '+tot+'</b></div></div>';
  h+='<div class="hint">Если сдали половина — все проценты выше читать нельзя. Поэтому дисциплина стоит рядом с деньгами.</div>';
  h+='<div class="sec">Исключения</div>';
  for(var m=0;m<state.alerts.length;m++){ var a=state.alerts[m];
    h+='<div class="item'+(a.bad?' alert':'')+'"><div class="ic">'+ic(a.bad?'alert':'star')+'</div><div class="tx">'+
       '<div class="tp">'+a.t+'</div><div class="nm" style="font-size:13.5px;font-weight:500;white-space:normal">'+esc(a.w)+'</div></div></div>';
  }
  return h;
}

/* ===== V3 · отделы ===== */
function teamsHTML(){
  var h='<div class="card"><div class="t">Производительность · месяц</div>'+
    '<div class="kv"><span>Норма на агента</span><b>'+money(state.norm.rev)+'</b></div></div>';
  for(var i=0;i<state.teams.length;i++){ var t=state.teams[i];
    var p=Math.round(t.perAgent/state.norm.rev*100);
    h+='<div class="card"><div class="t">'+t.name+' · '+t.n+' человек</div>'+
      '<div class="kv"><span>На агента</span><b class="'+(p>=90?'g':(p<60?'r':'s'))+'">'+money(t.perAgent)+' · '+p+'%</b></div>'+
      '<div class="bar"><i class="'+(p>=90?'':(p<60?'red':'st'))+'" style="width:'+Math.min(p,100)+'%"></i></div>'+
      '<div class="kv"><span>Задатков на агента</span><b>'+t.pdPer+' из '+state.norm.pd+'</b></div>'+
      '<div class="kv"><span>Новых в рекламу</span><b>'+t.rekl+'</b></div>'+
      '<div class="kv"><span>Показов на задаток</span><b class="'+(t.pokPerPd>14?'r':'')+'">'+t.pokPerPd+'</b></div>'+
      '</div>';
  }
  h+='<div class="hint">Отделы разного размера, поэтому всё считается на одного агента. Абсолютные суммы врали бы в пользу большого.</div>';
  h+='<div class="card"><div class="t">Что это значит</div>'+
    '<div class="kv" style="border:0"><span style="white-space:normal;line-height:1.5">Отдел №3 даёт вдвое меньше рекламы и тратит в полтора раза больше показов на задаток. Это два разных диагноза, и лечатся они по-разному.</span></div></div>';
  h+='<div class="sec">Люди</div><div class="card">'+
    '<div class="kv"><span>Всего агентов</span><b>'+state.people.total+'</b></div>'+
    '<div class="kv"><span>Стажёров</span><b>'+state.people.trainees+'</b></div>'+
    '<div class="kv"><span>Ушли за месяц</span><b>'+state.people.left+'</b></div>'+
    '<div class="kv"><span>Ниже нормы 3 месяца</span><b class="r">'+state.people.lowMonths+'</b></div>'+
    '<div class="kv"><span>Первая сделка стажёра</span><b>'+state.people.firstDealWeek+'-я неделя</b></div></div>';
  h+='<div class="hint">Тап по отделу на экране «Сегодня» — состав и кто именно проседает.</div>';
  return h;
}
function showTeam(id){ for(var i=0;i<state.teams.length;i++) if(state.teams[i].id===id) openTeam=state.teams[i]; render(); }
function teamHTML(){
  var t=openTeam, p=Math.round(t.perAgent/state.norm.rev*100);
  var h='<button class="back" onclick="openTeam=null;render()">← Назад</button>'+
    '<div class="card"><div class="t">'+t.name+' · '+esc(t.rop)+'</div><div class="grid3">'+
    '<div><b class="'+(p>=90?'good':(p<60?'bad':''))+'">'+p+'%</b><span>к норме</span></div>'+
    '<div><b>'+t.n+'</b><span>человек</span></div>'+
    '<div><b class="'+(t.sent===t.n?'good':'bad')+'">'+t.sent+'/'+t.n+'</b><span>сдали</span></div></div></div>';
  h+='<div class="card"><div class="t">Показатели</div>'+
    '<div class="kv"><span>Комиссия на агента</span><b>'+money(t.perAgent)+'</b></div>'+
    '<div class="kv"><span>Задатков на агента</span><b>'+t.pdPer+' из '+state.norm.pd+'</b></div>'+
    '<div class="kv"><span>Новых в рекламу</span><b>'+t.rekl+'</b></div>'+
    '<div class="kv"><span>Показов на задаток</span><b>'+t.pokPerPd+'</b></div>'+
    '<div class="kv"><span>Стажёров</span><b>'+t.trainees+'</b></div></div>';
  h+='<div class="sec warn">Ниже нормы три месяца подряд</div>';
  for(var i=0;i<t.low.length;i++)
    h+='<div class="item"><div class="ic">'+ic('alert')+'</div><div class="tx"><div class="nm">'+esc(t.low[i])+'</div>'+
       '<div class="sub">повод для разговора, не приговор</div></div></div>';
  h+='<div class="hint">Один и тот же процент бывает у выгоревшего сильного агента и у слабого. Цифра показывает, где смотреть, а не что решать.</div>';
  return h;
}

/* ===== V4 · деньги ===== */
function moneyHTML(){
  var m=state.month, pct=Math.round(m.signed/m.plan*100);
  var real=Math.round(m.fc*m.hit/100);
  var h='<div class="card hero"><div class="t">Три момента денег · месяц</div>'+
    '<div class="kv"><span>Подписано по ПД</span><b>'+mln(m.signed)+'</b></div>'+
    '<div class="bar"><i style="width:100%"></i></div>'+
    '<div class="kv"><span>Переведено в ОД</span><b>'+mln(m.od)+'</b></div>'+
    '<div class="bar"><i class="st" style="width:'+Math.round(m.od/m.signed*100)+'%"></i></div>'+
    '<div class="kv"><span>Пришло в кассу</span><b>'+mln(m.cash)+'</b></div>'+
    '<div class="bar"><i class="st" style="width:'+Math.round(m.cash/m.signed*100)+'%"></i></div>'+
    '<div class="kv"><span>Расторжений</span><b class="r">'+m.cancel+' · '+k(m.cancelSum)+'</b></div>'+
    '<div class="kv"><span>Разрыв ПД → касса</span><b>'+m.lag+' дней</b></div></div>';
  h+='<div class="hint">Пока расторжений мало, задаток можно считать деньгами. Этот экран — способ вовремя заметить, если перестанет.</div>';
  h+='<div class="card"><div class="t">Месяц и прогноз</div>'+
    '<div class="kv"><span>Подписано</span><b>'+mln(m.signed)+' из '+mln(m.plan)+'</b></div>'+
    '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
    '<div class="kv"><span>Прошло дней</span><b>'+m.days+' из '+m.ofDays+'</b></div>'+
    '<div class="kv"><span>Прогноз отделов</span><b>'+mln(m.fc)+'</b></div>'+
    '<div class="kv"><span>Сбываемость прогнозов</span><b class="s">'+m.hit+'%</b></div>'+
    '<div class="kv"><span>С поправкой ожидаем</span><b class="'+(real>=m.plan?'g':'r')+'">'+mln(real)+'</b></div></div>';
  h+='<div class="hint">Главная цифра здесь не прогноз, а его сбываемость. '+mln(m.fc)+' при '+m.hit+'% — это '+mln(real)+'.</div>';
  var f=state.funnel, mx=f.leads;
  h+='<div class="card"><div class="t">Воронка компании · месяц</div><div class="funnel">'+
    frow('Заявки',f.leads,mx)+frow('Показы',f.pokaz,mx)+frow('Оценки',f.ocenka,mx)+
    frow('Задатки',f.pd,mx)+frow('Договоры',f.od,mx)+'</div>'+
    '<div class="kv" style="margin-top:8px"><span>Заявка → показ</span><b>'+Math.round(f.pokaz/f.leads*100)+'%</b></div>'+
    '<div class="kv"><span>Показ → задаток</span><b>'+(f.pd/f.pokaz*100).toFixed(1)+'%</b></div>'+
    '<div class="kv"><span>Новых объектов в рекламу</span><b>'+f.rekl+'</b></div></div>';
  h+='<div class="hint">Рекламный бюджет обсуждается здесь: если заявка → показ падает, дело в качестве заявок, а не в их количестве.</div>';
  return h;
}
function frow(l,v,mx){
  return '<div class="frow"><div class="fb" style="width:'+Math.max(Math.round(v/mx*55),4)+'%"></div>'+
         '<div class="fl">'+l+'</div><div class="fn">'+v+'</div></div>';
}

/* ===== V8 · данные ===== */
function dataHTML(){
  var q=state.quality;
  var h='<div class="card"><div class="t">Качество данных · месяц</div>'+
    '<div class="kv"><span>Сдали план до 10:00</span><b class="'+(q.plans>=90?'g':'s')+'">'+q.plans+'%</b></div>'+
    '<div class="bar"><i class="'+(q.plans>=90?'':'st')+'" style="width:'+q.plans+'%"></i></div>'+
    '<div class="kv"><span>Отметили дела в течение дня</span><b>'+q.closed+'%</b></div>'+
    '<div class="kv"><span>Правок задним числом</span><b class="s">'+q.edits+'</b></div>'+
    '<div class="kv"><span>Из них правок сумм</span><b class="r">'+q.editSums+'</b></div>'+
    '<div class="kv"><span>Слабее всех заполняет</span><b>'+q.worst+' · '+q.worstPct+'%</b></div></div>';
  h+='<div class="hint">Этот экран отвечает, можно ли верить всем остальным. Шесть правок сумм за месяц — повод открыть журнал.</div>';
  h+='<div class="sec">Журнал правок</div>';
  for(var i=0;i<q.log.length;i++){ var l=q.log[i];
    h+='<div class="item"><div class="ic">'+ic('edit')+'</div><div class="tx"><div class="tp">'+l.when+'</div>'+
       '<div class="nm" style="font-size:13.5px;font-weight:500;white-space:normal">'+esc(l.what)+'</div>'+
       '<div class="sub">'+esc(l.who)+'</div></div></div>';
  }
  h+='<div class="sec">Норматив</div><div class="card">'+
    '<div class="kv"><span>Версия</span><b>'+state.norm.ver+' · с '+state.norm.from+'</b></div>'+
    '<div class="kv"><span>Комиссия на агента в месяц</span><b>'+money(state.norm.rev)+'</b></div>'+
    '<div class="kv"><span>Задатков в месяц</span><b>'+state.norm.pd+'</b></div>'+
    '<div class="kv"><span>Стажёр</span><b>метка до 3 сделок</b></div></div>'+
    '<button class="add" onclick="openNorm()">Изменить норматив</button>'+
    '<div class="warnbox">Изменение создаёт новую версию. Прошлые месяцы остаются посчитанными по старой — иначе история поедет задним числом.</div>';
  h+='<button class="add" style="margin-top:12px" onclick="logout()">Выйти из кабинета</button>';
  return h;
}
function openNorm(){
  document.getElementById('sheet').innerHTML=
    '<h3>Новая версия норматива</h3><div class="sh">действует с даты сохранения</div>'+
    '<div class="lbl">Комиссия на агента в месяц ₽</div><input type="number" inputmode="numeric" id="nRev" value="'+state.norm.rev+'">'+
    '<div class="lbl">Задатков в месяц</div><input type="number" inputmode="numeric" id="nPd" value="'+state.norm.pd+'">'+
    '<div class="warnbox">Прошлые периоды пересчитаны не будут.</div>'+
    '<div class="sbtn"><button onclick="closeSheet()">Отмена</button><button class="pri" onclick="saveNorm()">Сохранить версию</button></div>';
  document.getElementById('ovl').classList.add('on');
}
function saveNorm(){
  var r=document.getElementById('nRev'), p=document.getElementById('nPd');
  if(!r.value||!p.value){ alert('Заполните оба поля'); return; }
  state.norm.rev=Number(r.value); state.norm.pd=Number(p.value);
  state.norm.ver=String(Number(state.norm.ver)+0)+' · ред.';
  var d=new Date(); state.norm.from=('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear();
  save(); closeSheet(); render();
}
function closeSheet(){ document.getElementById('ovl').classList.remove('on'); }
function logout(){ state.user=null; pickName=null; save(); render(); }
function resetAll(){
  if(!confirm('Сбросить прототип и начать заново?')) return;
  var u=state.user; state=seed(); state.user=u; save(); nav='today'; openTeam=null; render();
}
render();
</script>
</body>
</html>
