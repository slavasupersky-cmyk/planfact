<style>
:root{
  color-scheme:light dark;
  --ink:#101010; --ink-2:#5A5A5A; --mute:#757575;
  --line:#E6E6E6; --paper:#FFFFFF; --card:#FFFFFF;
  --surface:#FAFAFA; --surface-2:#F0F0F0;
  --dot:#0D7A46; --on-dot:#FFFFFF; --star:#8A6100; --red:#B3261E;
  --dot:#0D7A46; --on-dot:#FFFFFF; --star:#8A6100; --red:#B3261E;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#F4F4F4;--ink-2:#9A9A9A;--mute:#8E8E8E;--line:#242424;--paper:#0A0A0A;--card:#131313;--surface:#131313;--surface-2:#1C1C1C;--dot:#AEEA00;--on-dot:#0A0A0A;--star:#D9A03A;--red:#FF6B6B}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.55}
.app{max-width:560px;margin:0 auto;padding:14px 14px 190px}
button{font-family:inherit}

/* вход */
.login{max-width:420px;margin:0 auto;padding:56px 18px}
.login .mark{font-size:26px;font-weight:600;letter-spacing:-.03em;margin-bottom:6px}
.login .mark i{font-style:normal;color:var(--dot)}
.login .sub{font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,Consolas,monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:34px}
.login h2{font-size:21px;letter-spacing:-.02em;margin:0 0 16px}
.pick{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:2px;padding:14px;margin-bottom:7px;font-size:15px;color:var(--ink-2)}
.pick.on{border-color:var(--dot);border-width:2px;background:var(--card);color:var(--ink);font-weight:700}
.login .note{font-size:12.5px;color:var(--mute);margin-top:12px;text-align:center}

.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:12px;border-bottom:2px solid var(--ink);margin-bottom:14px}
.mark{font-size:20px;font-weight:600;letter-spacing:-.03em;line-height:1}
.mark i{font-style:normal;color:var(--dot)}
.mark small{display:block;font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:400;margin-top:5px}
.who{text-align:right}
.who b{display:block;font-size:14px}
.who span{font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,Consolas,monospace;font-size:10px;letter-spacing:.08em;color:var(--mute)}

.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:13px;margin-bottom:12px}
.card .t{font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:9px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.grid4 div,.grid3 div{background:var(--surface);border-radius:2px;padding:8px 5px;text-align:center}
.grid4 button{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:8px 5px;text-align:center;color:inherit;width:100%}
.grid4 button:active{background:var(--surface-2)}
.tabs.sub button{padding:10px 6px;font-size:13px;font-weight:500}
.tabs.sub button.on{background:var(--surface-2);color:var(--ink);border-color:var(--line);font-weight:700}
.dayrow .rt{font-size:13px}
.grid4 b,.grid3 b{display:block;font-size:17px;font-weight:600;letter-spacing:-.03em}
b.good{color:var(--dot)} b.bad{color:var(--red)}
.grid4 span,.grid3 span{font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.bar{height:7px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin:9px 0 4px}
.bar i{display:block;height:100%;background:var(--dot)}
.kv{display:flex;justify-content:space-between;font-size:14.5px;color:var(--ink-2);padding:6px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv b{color:var(--ink)}

.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:2px;padding:13px 6px;font-size:15px;font-weight:600}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabs button .c{font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,Consolas,monospace;font-size:10px;display:block;margin-top:3px;opacity:.7}

.sec{font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:16px 2px 8px}
.item{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:2px;padding:12px 13px;margin-bottom:8px;display:flex;gap:11px;align-items:center;color:inherit}
.item .ic{width:30px;height:30px;flex:none;border-radius:2px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.item .tx{flex:1;min-width:0}
.item .tp{font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.item .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .rt{font-size:13px;font-weight:700;flex:none;text-align:right;max-width:42%}
.rt.ok{color:var(--dot)} .rt.mv{color:var(--star)} .rt.no{color:var(--red)} .rt.wait{color:var(--mute);font-weight:500}
.item.done{opacity:.72}
.star{color:var(--star)}
.add{width:100%;background:transparent;border:1.5px dashed var(--line);color:var(--mute);border-radius:2px;padding:13px;font-size:14px;font-weight:600;margin-bottom:8px}
.hint{font-size:13.5px;color:var(--mute);margin:2px 4px 12px}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);border-top:1px solid var(--line)}
.bottom .in{max-width:560px;margin:0 auto;padding:10px 14px calc(8px + env(safe-area-inset-bottom))}
.cta{width:100%;background:var(--dot);color:var(--on-dot);border:0;border-radius:2px;padding:16px;font-size:16px;font-weight:600;letter-spacing:-.01em}
.cta[disabled]{background:var(--surface-2);color:var(--mute)}
.cta.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.timer{text-align:center;font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,Consolas,monospace;font-size:11.5px;letter-spacing:.06em;color:var(--mute);margin-top:7px}
.nav{display:flex;gap:2px;margin-top:8px}
.nav button{flex:1;background:none;border:0;color:var(--mute);font-size:11.5px;padding:6px 2px;border-radius:2px}
.nav button b{display:flex;justify-content:center;margin-bottom:3px;font-weight:400}
.nav button.on{color:var(--ink);font-weight:700}

.ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}
.ovl.on{display:flex}
.sheet{background:var(--paper);width:100%;max-width:560px;margin:0 auto;border-radius:2px 2px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
.sheet h3{margin:0 0 3px;font-size:18px;letter-spacing:-.02em}
.sheet .sh{font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:14px}
.lbl{font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:14px 2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:12px 13px;font-size:15px;color:var(--ink-2);flex:1 1 auto;min-width:calc(33% - 6px);display:flex;align-items:center;justify-content:center}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.chip.on.g{background:var(--dot);color:var(--on-dot)}
.chip.on.r{background:var(--red);color:#fff}
.chip.on.s{background:var(--star);color:#fff}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:2px;padding:13px;font-size:16px;font-family:inherit;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbtn{display:flex;gap:8px;margin-top:18px}
.sbtn button{flex:1;border-radius:2px;padding:15px;font-size:15px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink-2)}
.sbtn button.pri{background:var(--dot);color:var(--on-dot);border-color:var(--dot)}
.sbtn button.pri[disabled]{background:var(--surface-2);color:var(--mute);border-color:var(--line)}
.again{width:100%;margin-top:9px;background:transparent;border:1.5px dashed var(--line);color:var(--mute);border-radius:2px;padding:12px;font-size:13.5px;font-weight:600}
.done-card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:18px;text-align:center}
.done-card .big{font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1}
.done-card .lb{font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.done-card p{font-size:14px;color:var(--ink-2);margin:14px 0 0}
.foot{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute);text-align:center}
.foot button{background:none;border:0;color:var(--mute);font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,Consolas,monospace;font-size:11px;text-decoration:underline;padding:6px}
</style>
</head>

(function migrate(){
  var d=seed();
  for(var k in d){ if(typeof state[k]==='undefined') state[k]=d[k]; }

function startTimer(){ if(tick) clearInterval(tick); if(state.submitted) return;
  tick=setInterval(function(){ var e=document.getElementById('timer');
    if(e) e.textContent='на экране '+fmt(Math.round((Date.now()-t0)/1000)); },1000); }
function fmt(s){ var m=Math.floor(s/60), r=s%60; return m? m+' мин '+r+' с' : r+' с'; }

/* ================= состояние навигации ================= */
var nav='day', tab='f', pickName=null;

/* ================= общий рендер ================= */
function render(){
  try{ draw(); }catch(e){
    document.getElementById('root').innerHTML=
      '<div class="app"><div class="card"><div class="t">Что-то пошло не так</div>'+
      '<p style="font-size:14px;margin:0 0 12px">Скорее всего сохранились данные прошлой версии.</p>'+
      '<button class="add" onclick="hardReset()">Очистить и открыть заново</button>'+
      '<div class="hint" style="margin-top:8px">'+esc(e.message)+'</div></div></div>';
  }
}
function hardReset(){ try{ localStorage.removeItem(KEY); }catch(e){} mem=null; state=seed(); save(); location.reload(); }
function draw(){
  var r=document.getElementById('root');
  if(!state.user){ r.innerHTML=loginHTML(); return; }
  var body='';
  if(nav==='day')   body=dayHTML();
  if(nav==='leads') body=leadsHTML();
  if(nav==='fc')    body=fcHTML();
  if(nav==='me')    body=meHTML();
  r.innerHTML=
    '<div class="app">'+
      '<div class="hdr"><div class="mark">ТОЧНО<i>.</i><small>план / факт · v0.3</small></div>'+
      '<div class="who"><b>'+esc(state.user)+'</b><span>'+ru(state.date)+'</span></div></div>'+
      body+
      '<div class="foot">ТоПФ · кабинет агента v0.3 · прототип.<br>Данные сохраняются только на этом устройстве.<br>'+
      '<button onclick="resetAll()">сбросить и начать заново</button></div>'+
    '</div>'+ bottomHTML();
  startTimer();
}
function bottomHTML(){
  var cta='';
  if(nav==='day'&&!state.submitted)
    cta='<button class="cta" onclick="submitDay()">Сдать факт и план</button><div class="timer" id="timer"></div>';
  else if(nav==='day')
    cta='<button class="cta" disabled>Сдано ✓</button>';
  else if(nav==='fc'&&!state.fcSent)
    cta='<button class="cta" onclick="sendFc()">Отправить прогноз РОПу</button>';
  return '<div class="bottom"><div class="in">'+cta+
    '<div class="nav">'+
      nb('day','list','День')+nb('leads','phone','Заявки')+nb('fc','target','Прогноз')+nb('me','chart','Моё')+
    '</div></div></div>';
}
function nb(k,i,n){ return '<button class="'+(nav===k?'on':'')+'" onclick="go(\''+k+'\')"><b>'+ic(i,21)+'</b>'+n+'</button>'; }
function go(k){ nav=k; render(); }
function esc(s){ return (s||'').replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); }
function ru(d){ var p=d.split('-'); var M=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return parseInt(p[2],10)+' '+M[parseInt(p[1],10)-1]; }
function money(n){ return Number(n).toLocaleString('ru-RU')+' ₽'; }

/* ================= A0 · вход ================= */
function loginHTML(){
  var h='<div class="login"><div class="mark">ТОЧНО<i>.</i></div><div class="sub">план / факт · v0.3</div>'+
    '<h2>Вход в кабинет</h2>';
  for(var i=0;i<STAFF.length;i++)
    h+='<button class="pick'+(pickName===STAFF[i]?' on':'')+'" onclick="pickName=\''+STAFF[i]+'\';render()">'+STAFF[i]+'</button>';
  h+='<div class="lbl">Пароль</div><input type="password" id="pw" placeholder="••••••" value="">'+
     '<div class="sbtn"><button class="pri" onclick="doLogin()">Войти</button></div>'+
     '<div class="note">Пароль в прототипе любой.<br>Забыли — сбросит РОП.</div></div>';
  return h;
}
function doLogin(){
  var pw=document.getElementById('pw');
  if(!pickName){ alert('Выберите себя из списка'); return; }
  if(!pw.value){ alert('Введите пароль'); return; }
  state.user=pickName; save(); t0=Date.now(); nav='day'; render();
}

/* ================= A1 · день ================= */
function NORM(){ return {pd:1,pokaz:15,ocenka:4,rekl:4}; }
function NAMES(){ return {pd:'Задаток',pokaz:'Показы',ocenka:'Оценки',rekl:'В рекламу'}; }
function weekItems(k){
  var out=[];
  for(var i=0;i<state.week.length;i++) if(state.week[i].type===k) out.push({obj:state.week[i].obj,day:state.week[i].day});
  for(var j=0;j<state.yest.length;j++){ var y=state.yest[j];
    if(y.status==='ok'&&y.type===k) out.push({obj:y.obj,day:'Вчера'}); }
  return out;
}
function dayHTML(){
  var left=0; for(var j=0;j<state.yest.length;j++) if(!state.yest[j].status) left++;
  var N=NORM(), NM=NAMES(), h='';
  h+='<div class="card"><div class="t">Норма недели · день '+state.weekDay+' из '+state.weekOf+'</div><div class="grid4">';
  var keys=['pd','pokaz','ocenka','rekl'];
  for(var q=0;q<keys.length;q++){ var kk=keys[q], done=weekItems(kk).length;
    h+='<button onclick="openNormSheet(\''+kk+'\')"><b class="'+(done>=N[kk]?'good':'')+'">'+done+'/'+N[kk]+'</b>'+
       '<span>'+(kk==='pd'?'задаток':(kk==='pokaz'?'показы':(kk==='ocenka'?'оценки':'реклама')))+'</span></button>';
  }
  h+='</div><div class="hint" style="margin:9px 0 0">Тап по цифре — что уже засчитано и сколько осталось.</div></div>';

  h+='<div class="tabs">'+
     '<button class="'+(tab==='f'?'on':'')+'" onclick="setTab(\'f\')">Факт вчера<span class="c">'+(left?left+' без отметки':'готово')+'</span></button>'+
     '<button class="'+(tab==='p'?'on':'')+'" onclick="setTab(\'p\')">План сегодня<span class="c">'+planCount()+' дел</span></button></div>';
  h+='<div class="tabs sub">'+
     '<button class="'+(tab==='past'?'on':'')+'" onclick="setTab(\'past\')">Прошлое</button>'+
     '<button class="'+(tab==='fut'?'on':'')+'" onclick="setTab(\'fut\')">Будущее<span class="c">'+state.future.length+'</span></button></div>';

  if(tab==='past') return h+pastHTML();
  if(tab==='fut')  return h+futHTML();

  if(state.submitted){
    h+='<div class="done-card"><div class="big">'+fmt(state.seconds)+'</div><div class="lb">заняла сдача</div>'+
       '<p>Факт за '+ru(state.dateY)+' и план на '+ru(state.date)+' ушли РОПу. Он увидит их в сводке до 11:00.</p></div>'+
       '<div class="hint" style="margin-top:12px">Дела можно продолжать отмечать в течение дня — тогда завтра утром сдача займёт секунды.</div>';
    return h;
  }
  if(tab==='f'){
    h+='<div class="sec">Вчера было запланировано · '+ru(state.dateY)+'</div>';
    for(var a=0;a<state.yest.length;a++) h+=itemHTML(state.yest[a],'y');
    h+='<button class="add" onclick="openAdd(\'y\')">+ Что было вне плана ★</button>';
    h+='<div class="hint">Если отмечали дела по ходу дня, здесь уже всё проставлено — останется подтвердить.</div>';
  } else {
    if(state.fromRop) h+='<div class="sec">От РОПа</div><div class="item"><div class="ic">'+ic('pin')+'</div><div class="tx"><div class="nm">'+esc(state.fromRop)+'</div></div></div>';
    h+='<div class="sec">План на сегодня</div>';
    var moved=[];
    for(var b=0;b<state.yest.length;b++){ var it=state.yest[b];
      if(it.status==='move'&&it.moveTo===state.date) moved.push(it); }
    for(var m=0;m<moved.length;m++) h+=itemHTML(moved[m],'m');
    for(var f=0;f<state.future.length;f++) if(state.future[f].date===state.date) h+=itemHTML(state.future[f],'t');
    for(var c=0;c<state.today.length;c++) h+=itemHTML(state.today[c],'t');
    h+='<button class="add" onclick="openAdd(\'t\')">+ Добавить дело</button>';
    if(!planCount()) h+='<div class="hint">Пустой день. Норма — 6 дел.</div>';
  }
  return h;
}
function planCount(){
  var n=state.today.length;
  for(var b=0;b<state.yest.length;b++) if(state.yest[b].status==='move'&&state.yest[b].moveTo===state.date) n++;
  for(var f=0;f<state.future.length;f++) if(state.future[f].date===state.date) n++;
  return n;
}
function pastHTML(){
  var h='<div class="sec">Последние дни · только просмотр</div>';
  for(var i=0;i<state.past.length;i++){ var d=state.past[i];
    var pct=Math.round(d.fact/d.plan*100);
    h+='<button class="item dayrow" onclick="openPast('+i+')"><div class="ic">'+ic(d.sent?'ok':'alert')+'</div><div class="tx">'+
       '<div class="tp">'+(d.sent?'сдан вовремя':'сдан с опозданием')+'</div>'+
       '<div class="nm">'+d.day+'</div><div class="sub">план '+d.plan+' · факт '+d.fact+'</div></div>'+
       '<span class="rt '+(pct>=100?'ok':(pct>=70?'mv':'no'))+'">'+pct+'%</span></button>';
  }
  h+='<div class="hint">Прошлые дни правке не подлежат. Дополнить можно только вчерашний — и это остаётся в журнале.</div>';
  return h;
}
function openPast(i){
  var d=state.past[i], h='<h3>'+d.day+'</h3><div class="sh">план '+d.plan+' · факт '+d.fact+'</div>';
  for(var j=0;j<d.items.length;j++)
    h+='<div class="item"><div class="tx"><div class="nm" style="font-size:13.5px;font-weight:500;white-space:normal">'+esc(d.items[j])+'</div></div></div>';
  h+='<div class="hint" style="margin-top:12px">Правка закрыта.</div>'+
     '<div class="sbtn"><button onclick="closeSheet()">Закрыть</button></div>';
  document.getElementById('sheet').innerHTML=h;
  document.getElementById('ovl').classList.add('on');
}
function futHTML(){
  var h='<div class="sec">Уже назначено вперёд</div>';
  var list=state.future.slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  var cur='';
  for(var i=0;i<list.length;i++){ var f=list[i];
    if(f.date===state.date) continue;
    if(f.date!==cur){ cur=f.date; h+='<div class="sec">'+ru(f.date)+'</div>'; }
    h+=itemHTML(f,'fut');
  }
  if(!list.length) h+='<div class="hint">Пока ничего не назначено вперёд.</div>';
  h+='<button class="add" onclick="openAdd(\'fut\')">+ Назначить на дату</button>';
  h+='<div class="hint">Договорились о показе на четверг — записали сразу. В четверг утром это само окажется в плане дня.</div>';
  return h;
}
function openNormSheet(kk){
  var N=NORM(), NM=NAMES(), items=weekItems(kk), done=items.length, need=N[kk]-done;
  var leftDays=state.weekOf-state.weekDay;
  var h='<h3>'+NM[kk]+'</h3><div class="sh">неделя · день '+state.weekDay+' из '+state.weekOf+'</div>';
  h+='<div class="card"><div class="kv"><span>Сделано</span><b>'+done+' из '+N[kk]+'</b></div>'+
     '<div class="bar"><i style="width:'+Math.min(Math.round(done/N[kk]*100),100)+'%"></i></div>'+
     '<div class="kv"><span>Осталось</span><b class="'+(need<=0?'':'')+'">'+(need<=0?'норма закрыта':need)+'</b></div>'+
     '<div class="kv"><span>Дней до конца недели</span><b>'+leftDays+'</b></div>'+
     (need>0&&leftDays>0?'<div class="kv"><span>Темп</span><b>'+(need/leftDays).toFixed(1)+' в день</b></div>':'')+
     '</div>';
  if(kk==='pd'&&state.fc.length){
    h+='<div class="sec">В прогнозе на неделю</div>';
    for(var q=0;q<state.fc.length;q++)
      h+='<div class="item"><div class="ic">'+ic('target')+'</div><div class="tx"><div class="tp">'+state.fc[q].p+'</div>'+
         '<div class="nm">'+esc(state.fc[q].obj)+'</div></div><span class="rt ok">'+money(state.fc[q].sum)+'</span></div>';
  }
  h+='<div class="sec">Засчитано на этой неделе</div>';
  if(!items.length) h+='<div class="hint">Пока ничего.</div>';
  for(var i=0;i<items.length;i++)
    h+='<div class="item"><div class="ic">'+ic('ok')+'</div><div class="tx"><div class="tp">'+items[i].day+'</div>'+
       '<div class="nm">'+esc(items[i].obj)+'</div></div></div>';
  h+='<div class="sbtn"><button onclick="closeSheet()">Закрыть</button></div>';
  document.getElementById('sheet').innerHTML=h;
  document.getElementById('ovl').classList.add('on');
}
function cell(v,g,l){ return '<div><b class="'+(g?'good':'')+'">'+v+'</b><span>'+l+'</span></div>'; }
function setTab(t){ tab=t; render(); }

function statusView(it){
  if(!it.status) return '<span class="rt wait">отметить</span>';
  if(it.status==='ok')    return '<span class="rt ok">✓</span>';
  if(it.status==='move')  return '<span class="rt mv">↩ '+(it.moveTo?ru(it.moveTo):'')+'</span>';
  if(it.status==='cancel')return '<span class="rt no">✕</span>';
  if(it.status==='none')  return '<span class="rt no">не назначено</span>';
  return '';
}
function itemHTML(it,src){
  var t=T(it.type), sub=[];
  if(it.cl) sub.push(it.cl); if(it.time) sub.push(it.time);
  if(it.sum) sub.push(money(it.sum)); if(it.note) sub.push(it.note);
  var right = src==='y' ? statusView(it)
            : src==='m' ? '<span class="rt mv">↩ перенос</span>'
            : src==='fut' ? '<span class="rt wait">'+(it.time||'—')+'</span>'
            : '<span class="rt wait">'+(it.time||'—')+'</span>';
  var click = src==='y' ? 'openStatus('+it.id+')' : (src==='t'?'openEdit('+it.id+')':(src==='fut'?'delFuture('+it.id+')':''));
  return '<button class="item'+(src==='y'&&it.status?' done':'')+'" onclick="'+click+'"><div class="ic">'+ic(t.ic)+'</div><div class="tx">'+
    '<div class="tp">'+t.n+(it.star?' <span class="star">★ вне плана</span>':'')+'</div>'+
    '<div class="nm">'+esc(it.obj||'—')+'</div>'+
    (sub.length?'<div class="sub">'+esc(sub.join(' · '))+'</div>':'')+
    '</div>'+right+'</button>';
}

/* ================= A3 · отметка ================= */
var cur=null, curStatus=null, curReason=null;
function openStatus(id){
  cur=null; for(var i=0;i<state.yest.length;i++) if(state.yest[i].id===id) cur=state.yest[i];
  if(!cur) return;
  curStatus=cur.status||null; curReason=cur.reason||null;
  drawStatus(); document.getElementById('ovl').classList.add('on');
}
function drawStatus(){
  var t=T(cur.type);
  var h='<h3>'+t.n+' · '+esc(cur.obj)+'</h3><div class="sh">'+(cur.cl?esc(cur.cl)+' · ':'')+ru(state.dateY)+'</div>'+
    '<div class="lbl">Что вышло</div><div class="chips">'+
    sbtn('ok','Состоялось','g')+sbtn('move','Перенос','s')+sbtn('cancel','Отмена','r')+sbtn('none','Не назначено','r')+'</div>';
  if(curStatus==='move') h+='<div class="lbl">Перенесено на</div><input type="date" id="fDate" value="'+(cur.moveTo||state.date)+'">';
  if(curStatus==='move'||curStatus==='cancel'||curStatus==='none'){
    h+='<div class="lbl">Причина</div><div class="chips">';
    for(var i=0;i<REASONS.length;i++)
      h+='<button class="chip'+(curReason===REASONS[i]?' on':'')+'" onclick="curReason=\''+REASONS[i]+'\';drawStatus()">'+REASONS[i]+'</button>';
    h+='</div>';
  }
  if(curStatus==='ok'&&t.money)
    h+='<div class="lbl">Сумма комиссии · обязательно</div><input type="number" inputmode="numeric" id="fSum" value="'+(cur.sum||'')+'" placeholder="105000">';
  h+='<div class="lbl">Результат</div><textarea id="fNote" placeholder="Планируем ПД в пятницу">'+esc(cur.note||'')+'</textarea>'+
     '<div class="sbtn"><button onclick="closeSheet()">Отмена</button>'+
     '<button class="pri" onclick="saveStatus()"'+(curStatus?'':' disabled')+'>Сохранить</button></div>';
  document.getElementById('sheet').innerHTML=h;
}
function sbtn(k,l,c){ return '<button class="chip'+(curStatus===k?' on '+c:'')+'" onclick="curStatus=\''+k+'\';drawStatus()">'+l+'</button>'; }
function saveStatus(){
  var sum=document.getElementById('fSum');
  if(curStatus==='ok'&&T(cur.type).money&&(!sum||!sum.value)){ alert('Для ПД и ОД сумма комиссии обязательна'); return; }
  cur.status=curStatus; cur.reason=curReason||null;
  var d=document.getElementById('fDate'); if(curStatus==='move'&&d) cur.moveTo=d.value;
  if(sum) cur.sum=sum.value;
  var n=document.getElementById('fNote'); if(n) cur.note=n.value;
  save(); closeSheet(); render();
}

/* ================= A2 · добавление ================= */
var addTo='t', form={};
function openAdd(where,keep){
  addTo=where;
  form = keep? {type:form.type, cl:form.cl, obj:'', time:'', sum:'', note:'', date:form.date} : {type:'pokaz',obj:'',cl:'',time:'',sum:'',note:'',date:''};
  drawAdd(); document.getElementById('ovl').classList.add('on');
}
function openEdit(id){
  var it=null; for(var i=0;i<state.today.length;i++) if(state.today[i].id===id) it=state.today[i];
  if(!it) return;
  addTo='edit'; form={id:it.id,type:it.type,obj:it.obj,cl:it.cl,time:it.time,sum:it.sum||'',note:it.note||''};
  drawAdd(); document.getElementById('ovl').classList.add('on');
}
function drawAdd(){
  var t=T(form.type);
  var h='<h3>'+(addTo==='edit'?'Дело':(addTo==='y'?'Дело вне плана ★':(addTo==='fut'?'Назначить вперёд':'Новое дело')))+'</h3>'+
        '<div class="sh">'+(addTo==='y'?ru(state.dateY):(addTo==='fut'?'выберите дату':ru(state.date)))+'</div><div class="lbl">Тип</div><div class="chips">';
  for(var i=0;i<TYPES.length;i++)
    h+='<button class="chip'+(form.type===TYPES[i].k?' on':'')+'" onclick="form.type=\''+TYPES[i].k+'\';grab();drawAdd()">'+ic(TYPES[i].ic,16)+'<span style="margin-left:7px">'+TYPES[i].n+'</span></button>';
  h+='</div>';
  if(addTo==='fut') h+='<div class="lbl">Дата</div><input type="date" id="aDate" value="'+(form.date||'')+'" min="'+state.date+'">';
  h+='<div class="lbl">'+t.obj+'</div><input id="aObj" value="'+esc(form.obj)+'" placeholder="Строителей 11">';
  if(t.cl) h+='<div class="lbl">'+t.cl+' · имя без фамилии</div><input id="aCl" value="'+esc(form.cl)+'" placeholder="Кондрева">';
  h+='<div class="row2"><div><div class="lbl">Время</div><input type="time" id="aTime" value="'+(form.time||'')+'"></div>';
  h+= t.money? '<div><div class="lbl">Комиссия ₽</div><input type="number" inputmode="numeric" id="aSum" value="'+(form.sum||'')+'" placeholder="105000"></div>' : '<div></div>';
  h+='</div><div class="sbtn"><button onclick="closeSheet()">Отмена</button><button class="pri" onclick="saveAdd(0)">Сохранить</button></div>';
  if(form.type==='pokaz'&&addTo!=='edit') h+='<button class="again" onclick="saveAdd(1)">Сохранить и ещё показ этому же покупателю</button>';
  if(addTo==='edit') h+='<button class="again" onclick="delItem()">Удалить дело</button>';
  document.getElementById('sheet').innerHTML=h;
  setTimeout(function(){ var o=document.getElementById('aObj'); if(o&&!form.obj) o.focus(); },50);
}
function grab(){
  var o=document.getElementById('aObj'),c=document.getElementById('aCl'),m=document.getElementById('aTime'),
      s=document.getElementById('aSum'),dd=document.getElementById('aDate');
  if(o)form.obj=o.value; if(c)form.cl=c.value; if(m)form.time=m.value; if(s)form.sum=s.value; if(dd)form.date=dd.value;
}
function saveAdd(again){
  grab();
  if(!form.obj){ alert('Укажите объект'); return; }
  if(T(form.type).money&&!form.sum){ alert('Для ПД и ОД сумма комиссии обязательна'); return; }
  if(addTo==='edit'){
    for(var i=0;i<state.today.length;i++) if(state.today[i].id===form.id){
      state.today[i].type=form.type; state.today[i].obj=form.obj; state.today[i].cl=form.cl;
      state.today[i].time=form.time; state.today[i].sum=form.sum; }
  } else {
    var it={id:++state.seq,type:form.type,obj:form.obj,cl:form.cl,time:form.time,sum:form.sum};
    if(addTo==='y'){ it.status='ok'; it.star=true; state.yest.push(it); }
    else if(addTo==='fut'){
      if(!form.date){ alert('Выберите дату'); return; }
      it.date=form.date;
      if(it.date===state.date) state.today.push(it); else state.future.push(it);
    }
    else state.today.push(it);
  }
  save();
  if(again){ openAdd(addTo,true); render(); return; }
  closeSheet(); render();
}
function delFuture(id){
  var it=null; for(var i=0;i<state.future.length;i++) if(state.future[i].id===id) it=state.future[i];
  if(!it) return;
  if(!confirm('Убрать «'+it.obj+'» из назначенного?')) return;
  var n=[]; for(var j=0;j<state.future.length;j++) if(state.future[j].id!==id) n.push(state.future[j]);
  state.future=n; save(); render();
}
function delItem(){
  var n=[]; for(var i=0;i<state.today.length;i++) if(state.today[i].id!==form.id) n.push(state.today[i]);
  state.today=n; save(); closeSheet(); render();
}
function closeSheet(){ document.getElementById('ovl').classList.remove('on'); }

/* ================= A4 · заявки ================= */
function leadsHTML(){
  var done=0,show=0;
  for(var i=0;i<state.leads.length;i++){ var l=state.leads[i];
    if(l.st) done++;
    if(l.st==='Показ назначен'||l.st==='Показ совершён') show++; }
  var h='<div class="card"><div class="t">Заявки за вчера</div><div class="grid3">'+
    cell(state.leads.length,false,'пришло')+cell(done+'/'+state.leads.length,done===state.leads.length,'разобрано')+
    cell(show,show>0,'в показ')+'</div>'+
    '<div class="hint" style="margin:10px 0 0">Из '+state.leads.length+' заявок получилось показов: '+show+'. Это и есть цифра, которую смотрит РОП.</div></div>';
  h+='<div class="sec">Разобрать</div>';
  for(var j=0;j<state.leads.length;j++){ var d=state.leads[j];
    var rt = d.st? '<span class="rt '+(LEADBAD[d.st]?'no':'ok')+'">'+d.st+'</span>' : '<span class="rt wait">выбрать</span>';
    h+='<button class="item'+(d.st?' done':'')+'" onclick="openLead('+d.id+')"><div class="ic">'+ic('phone')+'</div><div class="tx">'+
       '<div class="tp">'+d.src+'</div><div class="nm">'+esc(d.obj)+'</div></div>'+rt+'</button>';
  }
  h+='<div class="hint">У заявки одно текущее состояние, а не набор галочек — поэтому цифры складываются.</div>';
  return h;
}
var curLead=null;
function openLead(id){
  curLead=null; for(var i=0;i<state.leads.length;i++) if(state.leads[i].id===id) curLead=state.leads[i];
  if(!curLead) return;
  var h='<h3>'+esc(curLead.obj)+'</h3><div class="sh">'+curLead.src+' · вчера</div><div class="lbl">Состояние</div><div class="chips">';
  for(var j=0;j<LEAD.length;j++)
    h+='<button class="chip'+(curLead.st===LEAD[j]?' on'+(LEADBAD[LEAD[j]]?' r':' g'):'')+'" onclick="setLead(\''+LEAD[j]+'\')">'+LEAD[j]+'</button>';
  h+='</div><div class="sbtn"><button onclick="closeSheet()">Закрыть</button></div>';
  document.getElementById('sheet').innerHTML=h;
  document.getElementById('ovl').classList.add('on');
}
function setLead(v){ curLead.st=v; save(); closeSheet(); render(); }

/* ================= A5 · прогноз ================= */
function fcHTML(){
  var sum=0; for(var i=0;i<state.fc.length;i++) sum+=Number(state.fc[i].sum||0);
  var h='<div class="card"><div class="t">Прогноз на неделю</div><div class="grid3">'+
    cell(state.fc.length,false,'объекта')+cell(Math.round(sum/1000)+'к',false,'комиссия')+
    cell(state.fcLast.hit+' из '+state.fcLast.was,state.fcLast.hit>=state.fcLast.was/2,'сбылось')+'</div>'+
    '<div class="hint" style="margin:10px 0 0">Прошлую неделю закрыли '+state.fcLast.hit+' из '+state.fcLast.was+'. Это про честность с самим собой, а не отчёт.</div></div>';
  h+='<div class="sec">Объекты, которые рассчитываю закрыть</div>';
  for(var j=0;j<state.fc.length;j++){ var f=state.fc[j];
    h+='<button class="item" onclick="openFc('+f.id+')"><div class="ic">'+ic('target')+'</div><div class="tx">'+
       '<div class="tp">'+f.p+'</div><div class="nm">'+esc(f.obj)+'</div>'+
       '<div class="sub">'+esc(f.cl||'')+'</div></div><span class="rt '+(f.p==='высокая'?'ok':(f.p==='низкая'?'no':'mv'))+'">'+money(f.sum)+'</span></button>';
  }
  h+='<button class="add" onclick="openFc(0)">+ Добавить объект в прогноз</button>';
  if(state.fcSent) h+='<div class="hint">Прогноз отправлен РОПу ✓</div>';
  return h;
}
var curFc=null;
function openFc(id){
  curFc = id? null : {id:0,obj:'',cl:'',sum:'',p:'средняя'};
  if(id) for(var i=0;i<state.fc.length;i++) if(state.fc[i].id===id) curFc=JSON.parse(JSON.stringify(state.fc[i]));
  drawFc(); document.getElementById('ovl').classList.add('on');
}
function drawFc(){
  var h='<h3>'+(curFc.id?'Объект в прогнозе':'Новый объект')+'</h3><div class="sh">неделя</div>'+
    '<div class="lbl">Объект</div><input id="pObj" value="'+esc(curFc.obj)+'" placeholder="Строителей 11">'+
    '<div class="lbl">Покупатель · имя без фамилии</div><input id="pCl" value="'+esc(curFc.cl)+'" placeholder="Кондрева">'+
    '<div class="lbl">Ожидаемая комиссия ₽</div><input type="number" inputmode="numeric" id="pSum" value="'+(curFc.sum||'')+'" placeholder="105000">'+
    '<div class="lbl">Вероятность</div><div class="chips">';
  for(var i=0;i<PROB.length;i++)
    h+='<button class="chip'+(curFc.p===PROB[i]?' on':'')+'" onclick="grabFc();curFc.p=\''+PROB[i]+'\';drawFc()">'+PROB[i]+'</button>';
  h+='</div><div class="sbtn"><button onclick="closeSheet()">Отмена</button><button class="pri" onclick="saveFc()">Сохранить</button></div>';
  if(curFc.id) h+='<button class="again" onclick="delFc()">Убрать из прогноза</button>';
  document.getElementById('sheet').innerHTML=h;
}
function grabFc(){
  var o=document.getElementById('pObj'),c=document.getElementById('pCl'),s=document.getElementById('pSum');
  if(o)curFc.obj=o.value; if(c)curFc.cl=c.value; if(s)curFc.sum=s.value;
}
function saveFc(){
  grabFc();
  if(!curFc.obj||!curFc.sum){ alert('Нужны объект и ожидаемая комиссия'); return; }
  if(curFc.id){ for(var i=0;i<state.fc.length;i++) if(state.fc[i].id===curFc.id) state.fc[i]=curFc; }
  else { curFc.id=++state.seq; state.fc.push(curFc); }
  state.fcSent=false; save(); closeSheet(); render();
}
function delFc(){
  var n=[]; for(var i=0;i<state.fc.length;i++) if(state.fc[i].id!==curFc.id) n.push(state.fc[i]);
  state.fc=n; save(); closeSheet(); render();
}
function sendFc(){ if(!state.fc.length){ alert('Прогноз пустой'); return; } state.fcSent=true; save(); render(); }

/* ================= A7 · моё ================= */
function meHTML(){
  var m=state.month, pct=Math.round(m.done/m.norm*100);
  var conv=m.leads? Math.round(m.leadShow/m.leads*100):0;
  var h='<div class="card"><div class="t">Месяц</div>'+
    '<div class="kv"><span>Подписанная комиссия</span><b>'+money(m.done)+' из '+money(m.norm)+'</b></div>'+
    '<div class="bar"><i style="width:'+Math.min(pct,100)+'%"></i></div>'+
    '<div class="kv"><span>Задатки</span><b>'+m.pd+' из '+m.pdNorm+'</b></div>'+
    '<div class="kv"><span>Место в отделе</span><b>'+m.place+' из '+m.of+'</b></div></div>';
  h+='<div class="card"><div class="t">Моя воронка за месяц</div>'+
    '<div class="kv"><span>Заявки</span><b>'+m.leads+'</b></div>'+
    '<div class="kv"><span>Из них в показ</span><b>'+m.leadShow+' · '+conv+'%</b></div>'+
    '<div class="kv"><span>Показы</span><b>'+m.pokaz+'</b></div>'+
    '<div class="kv"><span>Оценки</span><b>'+m.ocenka+'</b></div>'+
    '<div class="kv"><span>В рекламу</span><b>'+m.rekl+'</b></div>'+
    '<div class="kv"><span>Показов на задаток</span><b>'+(m.pd? Math.round(m.pokaz/m.pd):'—')+'</b></div></div>';
  h+='<div class="card"><div class="t">Кабинет</div>'+
    '<div class="kv"><span>Сотрудник</span><b>'+esc(state.user)+'</b></div>'+
    '<div class="kv"><span>Отдел</span><b>№2</b></div>'+
    '<div class="kv"><span>Статус</span><b>агент</b></div></div>'+
    '<button class="add" onclick="logout()">Выйти из кабинета</button>';
  return h;
}
function logout(){ state.user=null; pickName=null; save(); render(); }

/* ================= сдача и сброс ================= */
function submitDay(){
  var left=0; for(var i=0;i<state.yest.length;i++) if(!state.yest[i].status) left++;
  if(left){ tab='f'; render(); alert('Осталось отметить дел за вчера: '+left); return; }
  var moved=0; for(var j=0;j<state.yest.length;j++) if(state.yest[j].status==='move'&&state.yest[j].moveTo===state.date) moved++;
  if(state.today.length+moved===0){ tab='p'; render(); alert('План на сегодня пустой'); return; }
  state.seconds=Math.round((Date.now()-t0)/1000); state.submitted=true; save(); render();
}
function resetAll(){
  if(!confirm('Сбросить прототип и начать заново?')) return;
  var u=state.user; state=seed(); state.user=u; save(); t0=Date.now(); nav='day'; tab='f'; render();
}

render();
</script>
</body>
</html>
