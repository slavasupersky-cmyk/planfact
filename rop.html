<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>ТОЧНО. — Кабинет РОПа</title>
<style>
:root{
  color-scheme:light;
  --ink:#101010; --ink-2:#5A5A5A; --mute:#757575;
  --line:#E6E6E6; --paper:#FFFFFF; --card:#FFFFFF;
  --surface:#FAFAFA; --surface-2:#F0F0F0;
  --lime:#AEEA00; --on-lime:#101010; --green:#0D7A46;
  --plan:#5A5A5A; --star:#8A6100; --red:#B3261E; --r:6px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.55}
button{font-family:inherit}
.app{max-width:560px;margin:0 auto;padding:14px 14px 160px}

.login{max-width:420px;margin:0 auto;padding:56px 18px}
.login .mark{font-size:26px;font-weight:600;letter-spacing:-.03em;margin-bottom:6px}
.login .mark i{font-style:normal;color:var(--lime)}
.login .sub{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:34px}
.login h2{font-size:21px;letter-spacing:-.03em;margin:0 0 16px}
.pick{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:7px;font-size:15px;color:var(--ink-2)}
.pick.on{border-color:var(--ink);border-width:2px;color:var(--ink);font-weight:600}
.note{font-size:13px;color:var(--mute);margin-top:12px;text-align:center}

.hdr{padding-bottom:12px;border-bottom:2px solid var(--ink);margin-bottom:14px}
.hdr .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mark{font-size:20px;font-weight:600;letter-spacing:-.03em;line-height:1}
.mark i{font-style:normal;color:var(--lime)}
.mark small{display:block;font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:400;margin-top:5px}
.who{text-align:right}
.who b{display:block;font-size:14px;font-weight:600}
.who span{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mute)}
.role{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:var(--surface-2);color:var(--ink-2);padding:2px 7px;border-radius:var(--r);margin-top:4px}

.btn{width:100%;min-height:54px;border-radius:var(--r);padding:14px;font-size:15.5px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:9px}
.btn.pri{background:var(--lime);color:var(--on-lime);border-color:var(--lime)}
.btn.ghost{border-style:dashed;color:var(--mute);background:transparent}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn+.btn{margin-top:8px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:12px}
.card .t{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.grid button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-height:60px;padding:9px 4px;text-align:center;color:inherit;width:100%}
.grid b{display:block;font-size:17px;font-weight:600;letter-spacing:-.03em}
.grid b.good{color:var(--green)} .grid b.bad{color:var(--red)}
.grid span{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.bar{height:6px;background:var(--surface-2);border-radius:var(--r);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--lime)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;color:var(--ink-2);padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv b{color:var(--ink);text-align:right;white-space:nowrap;font-weight:600}
.kv b.g{color:var(--green)} .kv b.r{color:var(--red)} .kv b.s{color:var(--star)} .kv b.p{color:var(--plan)}
.pf{display:flex;gap:6px;align-items:baseline;justify-content:flex-end;white-space:nowrap}
.pf .f{font-weight:600;color:var(--green)} .pf .sl{color:var(--mute)} .pf .p{color:var(--plan)}

.sec{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:18px 2px 8px;scroll-margin-top:12px}
.sec.warn{color:var(--red)}
.item{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;margin-bottom:8px;display:flex;gap:12px;align-items:center;color:inherit}
.item.done{background:var(--surface)}
.item.alert{border-left:3px solid var(--red)}
.item.mv{border-left:3px solid var(--star)}
.item .ic{width:42px;height:42px;flex:none;border-radius:var(--r);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--green);font-size:14px;font-weight:600}
.item .tx{flex:1;min-width:0}
.item .tp{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.item .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:13.5px;color:var(--ink-2)}
.item .rt{font-size:13px;font-weight:600;flex:none;text-align:right;max-width:42%}
.rt.ok{color:var(--green)} .rt.mv{color:var(--star)} .rt.no{color:var(--red)} .rt.wait{color:var(--mute);font-weight:400}
.hint{font-size:13.5px;color:var(--mute);margin:2px 4px 12px}
.back{background:none;border:0;color:var(--mute);font-size:14.5px;padding:4px 0 10px;font-weight:600}

details{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
details[open]{border-color:var(--ink)}
summary{list-style:none;cursor:pointer;padding:13px;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
summary::-webkit-details-marker{display:none}
summary .cnt{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mute);font-weight:400}
summary .arw{color:var(--mute);font-size:13px}
details[open] summary{border-bottom:1px solid var(--line)}
.dbody{padding:11px}
.dbody .item{margin-bottom:6px}
.dbody .item:last-child{margin-bottom:0}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);border-top:1px solid var(--line)}
.bottom .in{max-width:560px;margin:0 auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{background:none;border:0;color:var(--mute);font-size:11px;padding:6px 2px;width:100%}
.nav button b{display:flex;justify-content:center;margin-bottom:3px;font-weight:400}
.nav button.on{color:var(--ink);font-weight:600}
.nav button.on b{color:var(--green)}

.ovl{position:fixed;inset:0;background:rgba(16,16,16,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:flex-end;z-index:40}
.ovl.on{display:flex}
.sheet{background:var(--paper);width:calc(100% - 24px);max-width:536px;margin:0 auto 12px;border-radius:14px;padding:18px 16px 20px;max-height:88vh;min-height:52vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.18);display:flex;flex-direction:column}
.sheet h3{margin:0 0 3px;font-size:19px;letter-spacing:-.03em}
.sh{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:14px}
.lbl{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:14px 2px 6px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.chips.three{grid-template-columns:repeat(3,1fr)}
.chip{background:var(--card);border:1px solid var(--line);border-radius:var(--r);min-height:52px;padding:10px 8px;font-size:14.5px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;text-align:center;width:100%}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.chip.on.g{background:var(--lime);color:var(--on-lime);border-color:var(--lime)}
.chip.on.r{background:var(--red);color:#fff;border-color:var(--red)}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;font-size:16px;font-family:inherit;color:var(--ink)}
input[type=date]{padding:11px 12px;min-height:48px;-webkit-appearance:none;appearance:none}
textarea{min-height:70px;resize:vertical}
.sbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;padding-top:18px;align-items:stretch}
.sbtn .btn{min-height:54px;margin:0}
.big{font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.big small{display:block;font-size:13.5px;font-weight:400;color:var(--ink-2);letter-spacing:0;margin-top:6px}
.foot{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute);text-align:center}
.foot button{background:none;border:0;color:var(--mute);font-family:ui-monospace,Menlo,monospace;font-size:11px;text-decoration:underline;padding:6px}
</style>
</head>
<body>
<div id="root"></div>
<div class="ovl" id="ovl" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>

<script>
/* ================= иконки ================= */
var IC={
users:'<circle cx="9" cy="8" r="3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.5a3 3 0 0 1 0 5.5"/><path d="M17.5 14a6 6 0 0 1 3 6"/>',

cross:'<circle cx="12" cy="12" r="8.5"/><path d="M9.2 9.2l5.6 5.6M14.8 9.2l-5.6 5.6"/>',
tune:'<path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15.5" cy="12" r="2"/><circle cx="7.5" cy="17" r="2"/>'
};
function ic(n,s){ s=s||24; return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block">'+(IC[n]||'')+'</svg>'; }

/* ================= хранилище ================= */
var KEY='topf-rop-v22', mem=null;
function save(){ var s=JSON.stringify(state); try{ localStorage.setItem(KEY,s);}catch(e){ mem=s; } }
function load(){ var s=null; try{ s=localStorage.getItem(KEY);}catch(e){ s=mem; } if(!s)s=mem;
  if(!s) return null; try{ return JSON.parse(s);}catch(e){ return null; } }

/* ================= справочники ================= */
var ROPS=['Ковалёва Марина','Титов Сергей','Ершова Наталья'];
var CLS=[{k:'sdelka',n:'Сделка',ic:'deal'},{k:'pd',n:'Задаток',ic:'money'},{k:'pokaz',n:'Показ',ic:'home'},
         {k:'ocenka',n:'Оценка',ic:'search'},{k:'vstr',n:'Встреча',ic:'meet'},{k:'rekl',n:'Реклама',ic:'screen'},
         {k:'other',n:'Другое',ic:'list'}];
var NORMKEYS=[{k:'sdelka',l:'сделки'},{k:'pd',l:'задаток'},{k:'pokaz',l:'показы'},
              {k:'ocenka',l:'оценки'},{k:'vstr',l:'встречи'},{k:'rekl',l:'реклама'},{k:'leads',l:'заявки'}];
function C(k){ for(var i=0;i<CLS.length;i++) if(CLS[i].k===k) return CLS[i]; return CLS[0]; }
function money(n){ return Number(n||0).toLocaleString('ru-RU')+' ₽'; }
function kk(n){ return Math.round(Number(n||0)/1000)+'к'; }
function esc(s){ return String(s==null?'':s).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); }
function iso(d){ return d.toISOString().slice(0,10); }
function plus(n){ return iso(new Date(Date.now()+n*864e5)); }
var MN=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
var MNN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var WD=['вс','пн','вт','ср','чт','пт','сб'];
function ru(d){ var p=String(d).split('-'); return parseInt(p[2],10)+' '+MN[parseInt(p[1],10)-1]; }
function rud(d){ var dt=new Date(d+'T00:00:00'); return WD[dt.getDay()]+', '+ru(d); }
function weekStart(){ var d=new Date(), day=(d.getDay()+6)%7; return plus(-day); }
function weekEnd(){ var d=new Date(), day=(d.getDay()+6)%7; return plus(6-day); }
function monthNom(){ return MNN[new Date().getMonth()]; }
function ini(n){ var p=n.split(' '); return (p[0]||'')[0]+((p[1]||'')[0]||''); }

function seed(){
  var t=iso(new Date()), y=plus(-1);
  function ag(id,name,sent,st,tasks,week,month,fc,leads){
    var done=0,ref=0,mv=0;
    for(var i=0;i<tasks.length;i++){ if(tasks[i].st==='done')done++; else if(tasks[i].st==='refuse')ref++; else mv++; }
    return {id:id,name:name,sent:sent,status:st,tasks:tasks,plan:tasks.length,done:done,refused:ref,moved:mv,

  var T=function(cls,obj,cl,st,extra){ var o={cls:cls,obj:obj,cl:cl,st:st}; for(var k in (extra||{})) o[k]=extra[k]; return o; };

    agents:[
      ag(1,'Кастромина Ольга',true,null,[
        T('pd','Попова 72','Кондрева','done',{sum:98000,res:'Подписали, сделка 16-го'}),
        T('pokaz','Строителей 11','Кондрева','done',{res:'Думают до четверга'}),
        T('pokaz','Мира 6','Сомова','done'),
        T('ocenka','Мира 45','Сомов','refuse',{reason:'Продавец отказал',why:'Передумал продавать до весны'}),
        T('vstr','Офис','Юлия','moved',{reason:'Покупатель перенёс',to:plus(1)}),
        T('rekl','Ладожская 146','Титов','done')],
        {sdelka:0,pd:1,pokaz:8,ocenka:5,vstr:4,rekl:3,leads:19},
        {sdelka:1,pd:3,pokaz:21,ocenka:14,vstr:12,rekl:6,leads:58},
        [{obj:'Строителей 11',cl:'Кондрева',sum:105000,date:plus(1),done:false},
         {obj:'Мира 6',cl:'Сомова',sum:112000,date:plus(9),done:false},
         {obj:'Попова 72',cl:'Кондрева',sum:98000,date:plus(-1),done:true}],19),
      ag(2,'Розанова Мария',true,null,[
        T('sdelka','Кулакова 2','Гончаров','done',{res:'Сделка прошла'}),

        [{obj:'Норвуд',cl:'Юлия',sum:95000,date:plus(2),done:false},
         {obj:'Тепличная 4',cl:'Маргарита',sum:105000,date:plus(-1),done:true},
         {obj:'Сити Квартал',cl:'Ольга',sum:120000,date:plus(12),done:false}],22),
      ag(3,'Кондратьева Ирина',true,null,[
        T('pokaz','Попова 72','Пётр','refuse',{reason:'Покупатель отказался',why:'Не понравился район'}),
        T('pokaz','Мира 45','Пётр','done'),
        T('ocenka','Тепличная 4','Маргарита','done'),
        T('vstr','Офис','Пётр','moved',{reason:'Покупатель не на связи',to:plus(2)}),
        T('other','Разобрать документы по Мира 6','','done')],
        {sdelka:0,pd:0,pokaz:6,ocenka:3,vstr:3,rekl:1,leads:14},
        {sdelka:1,pd:2,pokaz:17,ocenka:10,vstr:9,rekl:3,leads:47},

        {sdelka:0,pd:1,pokaz:7,ocenka:4,vstr:3,rekl:2,leads:16},
        {sdelka:1,pd:2,pokaz:18,ocenka:12,vstr:8,rekl:4,leads:52},
        [{obj:'Тепличная 4',cl:'Маргарита',sum:105000,date:plus(4),done:false}],16),
      ag(6,'Ершова Дарья',true,null,[
        T('sdelka','Мира 6','Сомова','done'),
        T('pd','Онежская 19','Юлия','done',{sum:97000}),
        T('pokaz','Строителей 68а','Пётр','done'),
        T('ocenka','Попова 72','Кондрева','done'),
        T('vstr','Офис','Юлия','done'),

/* ================= расчёты ================= */
function normM(k){ return state.norm[k]||0; }
function normW(k){ return Math.ceil(normM(k)/4.33); }
function agent(id){ for(var i=0;i<state.agents.length;i++) if(state.agents[i].id===id) return state.agents[i]; return null; }
function sumBy(f){ var n=0; for(var i=0;i<state.agents.length;i++) n+=f(state.agents[i]); return n; }
function teamW(k){ return sumBy(function(a){ return a.week[k]||0; }); }
function teamM(k){ return sumBy(function(a){ return a.month[k]||0; }); }
function teamNW(k){ return normW(k)*state.agents.length; }
function teamNM(k){ return normM(k)*state.agents.length; }
function sentCount(){ return sumBy(function(a){ return a.sent?1:0; }); }
function acceptedCount(){ return sumBy(function(a){ return a.status?1:0; }); }
function collect(st){
  var o=[]; for(var i=0;i<state.agents.length;i++){ var a=state.agents[i];
    for(var j=0;j<a.tasks.length;j++) if(a.tasks[j].st===st) o.push({who:a.name,id:a.id,t:a.tasks[j]}); }
  return o;
}
function fcSplit(mode){
  var we=weekEnd(), me=plus(30), t=state.date;
  var out={plan:[],fact:[],late:[]};
  for(var i=0;i<state.agents.length;i++){ var a=state.agents[i];
    for(var j=0;j<a.fc.length;j++){ var f=a.fc[j], rec={who:a.name,id:a.id,f:f};
      var inP = mode==='week'? f.date<=we : (mode==='month'? f.date<=me : f.date>me);
      if(!inP) continue;
      if(f.done) out.fact.push(rec);
      else if(f.date<t) out.late.push(rec);
      else out.plan.push(rec);
    } }
  return out;
}
function fcSum(list){ var s=0; for(var i=0;i<list.length;i++) s+=Number(list[i].f.sum||0); return s; }

  h+='<div class="sec warn">Отказы · '+refs.length+'</div>';
  for(var r=0;r<refs.length;r++) h+=factRow(refs[r]);
  if(!refs.length) h+='<div class="hint">Отказов нет.</div>';
  h+='<div class="sec" style="color:var(--star)">Переносы · '+mvs.length+'</div>';
  for(var v=0;v<mvs.length;v++) h+=factRow(mvs[v]);
  h+='<div class="hint">Отказ в норму не идёт, но время потрачено — поэтому он виден отдельно и поимённо.</div>';
  return h;
}

/* ================= ПРОГНОЗ ================= */
function fcHTML(){
  var s=fcSplit(fcMode);
  var planS=fcSum(s.plan), factS=fcSum(s.fact), lateS=fcSum(s.late);
  var all=s.plan.length+s.fact.length+s.late.length;
  var h='<div class="card"><div class="t">Прогноз отдела · задатки</div>'+
    '<div class="chips three" style="margin-bottom:12px">'+
    fcTab('week','Неделя')+fcTab('month',monthNom())+fcTab('future','Дальше')+'</div>'+
    '<div class="big">'+money(factS)+' <span style="color:var(--mute);font-size:22px">/ '+money(planS+factS+lateS)+'</span>'+
    '<small>факт / прогноз · '+s.fact.length+' из '+all+'</small></div>'+
    '<div class="bar"><i style="width:'+((planS+factS+lateS)?Math.min(Math.round(factS/(planS+factS+lateS)*100),100):0)+'%"></i></div>'+
    (fcMode!=='future'?'<div class="kv"><span>Норма отдела</span><b class="p">'+
      (fcMode==='week'?teamNW('pd')+' задатков в неделю':teamNM('pd')+' в месяц')+'</b></div>':'')+
    '</div>';
  h+=fcBlock('Факт · закрытые',s.fact,'ok');
  h+=fcBlock('Прогноз · впереди',s.plan,'wait');
  h+=fcBlock('Просрочены · дата прошла',s.late,'no');
  h+='<div class="sec">По агентам</div>';
  for(var i=0;i<state.agents.length;i++){ var a=state.agents[i];
    var cnt=0,sm=0,fn=0;
    for(var j=0;j<a.fc.length;j++){ var f=a.fc[j];
      var inP = fcMode==='week'? f.date<=weekEnd() : (fcMode==='month'? f.date<=plus(30) : f.date>plus(30));
      if(!inP) continue; cnt++; sm+=Number(f.sum||0); if(f.done) fn++; }
    if(!cnt) continue;
    h+='<div class="item"><div class="ic">'+ini(a.name)+'</div><div class="tx">'+
       '<div class="tp">задатков '+cnt+' · закрыто '+fn+'</div><div class="nm">'+esc(a.name)+'</div></div>'+
       '<span class="rt ok">'+kk(sm)+'</span></div>';
  }
  h+='<div class="hint">Опоздавший задаток — промах недели, но попадание месяца. Поэтому периоды считаются раздельно, а просроченные вынесены отдельным блоком.</div>';
  return h;
}
function fcTab(m,n){ return '<button class="chip'+(fcMode===m?' on':'')+'" onclick="fcMode=\''+m+'\';render()">'+n+'</button>'; }
function fcBlock(title,list,cls){
  if(!list.length) return '';
  var sum=fcSum(list);
  var h='<details'+(cls==='no'?' open':'')+'><summary>'+title+'<span class="cnt">'+list.length+' · '+kk(sum)+'</span><span class="arw">▾</span></summary><div class="dbody">';
  for(var i=0;i<list.length;i++){ var x=list[i];
    h+='<div class="item'+(cls==='no'?' alert':'')+'"><div class="ic">'+ic('money')+'</div><div class="tx">'+
       '<div class="tp">'+ru(x.f.date)+' · '+esc(x.who)+'</div><div class="nm">'+esc(x.f.obj)+'</div>'+
       '<div class="sub">'+esc(x.f.cl)+'</div></div><span class="rt '+cls+'">'+money(x.f.sum)+'</span></div>'; }
  return h+'</div></details>';
}

/* ================= ОТЧЁТ ================= */
function repHTML(){
  var n=state.agents.length, s=sentCount();
  if(state.sentUp){
    return '<div class="card" style="text-align:center"><div class="big">Отчёт отправлен</div>'+
      '<div class="hint" style="margin-top:12px">Собственник получил факт за вчера и план на сегодня.</div></div>'+
      '<button class="btn ghost" onclick="state.sentUp=false;save();render()">Показать отчёт снова</button>'+repArchive();
  }
  var plan=sumBy(function(a){return a.plan;}), done=sumBy(function(a){return a.done;});
  var refs=collect('refuse').length, mvs=collect('moved').length;
  var h='<div class="card"><div class="t">Отчёт за '+rud(state.dateY)+' · собран сам</div>'+
    '<div class="kv"><span>Дела</span><span class="pf"><span class="f">'+done+'</span><span class="sl">/</span><span class="p">'+plan+'</span></span></div>'+
    '<div class="kv"><span>Отказов</span><b class="'+(refs?'r':'')+'">'+refs+'</b></div>'+
    '<div class="kv"><span>Переносов</span><b class="s">'+mvs+'</b></div>'+
    '<div class="kv"><span>Заявок</span><b>'+sumBy(function(a){return a.leads;})+'</b></div>'+
    '<div class="kv"><span>Сдали до 10:00</span><b class="'+(s===n?'g':'r')+'">'+s+' из '+n+'</b></div></div>';
  h+='<div class="card"><div class="t">По классам · неделя · факт / план</div>';
  for(var i=0;i<NORMKEYS.length;i++){ var k=NORMKEYS[i].k, d=teamW(k), nn=teamNW(k);
    h+='<div class="kv"><span>'+NORMKEYS[i].l+'</span><span class="pf"><span class="f">'+d+'</span><span class="sl">/</span><span class="p">'+nn+'</span></span></div>'; }
  h+='</div>';
  h+='<div class="sec">Комментарий по отделу</div>'+
     '<div class="card" style="padding:11px"><textarea id="cm" placeholder="Объяснить то, что требует контекста" oninput="state.comment=this.value">'+esc(state.comment)+'</textarea></div>'+
     '<div class="sec">Мои основные задачи на сегодня</div>'+
     '<div class="card" style="padding:11px"><textarea id="mt" placeholder="Что я сам делаю сегодня" oninput="state.mytasks=this.value">'+esc(state.mytasks)+'</textarea></div>'+
     '<button class="btn pri" onclick="sendUp()">Отправить собственнику · до 11:00</button>';
  return h+repArchive();
}
function repArchive(){
  var days=[],weeks=[],months=[];
  for(var i=0;i<state.reports.length;i++){ var r=state.reports[i];
    (r.kind==='day'?days:(r.kind==='week'?weeks:months)).push(r); }
  var h='<div class="sec">Прошлые отчёты · только просмотр</div>';
  h+=repGroup('Ежедневные',days,'day');
  h+=repGroup('Еженедельные',weeks,'week');
  h+=repGroup('Ежемесячные',months,'month');
  h+='<div class="hint">Недельные и месячные считаются сами по показателям. Изменить сданный отчёт нельзя.</div>';
  return h;
}
function repGroup(title,list,kind){
  if(!list.length) return '';
  var h='<details><summary>'+title+'<span class="cnt">'+list.length+'</span><span class="arw">▾</span></summary><div class="dbody">';
  for(var i=0;i<list.length;i++){ var r=list[i], idx=state.reports.indexOf(r);
    var sub = kind==='day'? 'сделано '+r.fact+' из '+r.plan+' · отказов '+r.ref+' · заявок '+r.leads
            : 'задаток '+r.w.pd+' · показы '+r.w.pokaz;
    h+='<button class="item" onclick="openReport('+idx+')"><div class="ic">'+ic(kind==='day'?'ok':'chart')+'</div>'+
       '<div class="tx"><div class="tp">'+ru(r.date)+'</div><div class="nm">'+esc(r.label)+'</div>'+
       '<div class="sub" style="white-space:normal">'+esc(sub)+'</div></div><span class="rt wait">открыть</span></button>'; }
  return h+'</div></details>';
}
function openReport(i){
  var r=state.reports[i], h='<h3>'+esc(r.label)+'</h3><div class="sh">'+ru(r.date)+'</div>';
  if(r.kind==='day'){
    h+='<div class="card"><div class="kv"><span>Дела</span><span class="pf"><span class="f">'+r.fact+'</span><span class="sl">/</span><span class="p">'+r.plan+'</span></span></div>'+
       '<div class="kv"><span>Отказов</span><b class="r">'+r.ref+'</b></div>'+
       '<div class="kv"><span>Переносов</span><b class="s">'+r.mv+'</b></div>'+
       '<div class="kv"><span>Заявок</span><b>'+r.leads+'</b></div></div>';
  } else {
    h+='<div class="card">';
    for(var j=0;j<NORMKEYS.length;j++){ var k=NORMKEYS[j].k, v=r.w[k]; if(!v) continue;
      var p=String(v).split('/');
      h+='<div class="kv"><span>'+NORMKEYS[j].l+'</span><span class="pf"><span class="f">'+p[0]+'</span><span class="sl">/</span><span class="p">'+p[1]+'</span>'+
         '<span class="sl" style="margin-left:6px">'+Math.round(p[0]/p[1]*100)+'%</span></span></div>'; }
    h+='</div>';
  }
  h+='<div class="hint">Отчёт закрыт для правок.</div>'+
     '<div class="sbtn"><button class="btn" onclick="closeSheet()">Закрыть</button><button class="btn pri" onclick="closeSheet()">Понятно</button></div>';
  sheet(h);
}
function sendUp(){ state.sentUp=true; save(); render(); }

/* ================= НАСТРОЙКИ ================= */
function setHTML(){
  var h='<div class="card"><div class="t">Нормы на агента · факт задаёт собственник</div>';
  for(var i=0;i<NORMKEYS.length;i++){ var k=NORMKEYS[i].k;
    h+='<div class="kv"><span>'+NORMKEYS[i].l+'</span><span class="pf"><span class="p">'+normW(k)+' в неделю</span>'+
       '<span class="sl">·</span><span class="p">'+normM(k)+' в месяц</span></span></div>'; }
  h+='</div><button class="btn" onclick="openNorms()">Изменить нормы</button>'+
     '<div class="hint" style="margin-top:10px">Задаётся месячная, недельная считается автоматически: месячная ÷ 4,33 вверх.</div>';
  h+='<div class="sec">Агенты · '+state.agents.length+'</div>';
  for(var j=0;j<state.agents.length;j++){ var a=state.agents[j];
    h+='<details><summary>'+ini(a.name)+' · '+esc(a.name)+'<span class="arw">▾</span></summary><div class="dbody">'+
       '<button class="btn" onclick="resetPw('+a.id+')">Сбросить пароль</button>'+
       '<button class="btn warn" onclick="delAgent('+a.id+')">Удалить из отдела</button></div></details>';
  }
  h+='<button class="btn" onclick="addAgent()">+ Добавить агента</button>';
  h+='<div class="card" style="margin-top:12px"><div class="t">Кабинет</div>'+
     '<div class="kv"><span>РОП</span><b>'+esc(state.user)+'</b></div>'+
     '<div class="kv"><span>Отдел</span><b>№2</b></div>'+
     '<div class="kv"><span>Чужие отделы</span><b>не видны</b></div></div>'+
     '<button class="btn ghost" onclick="logout()">Выйти из кабинета</button>';
  return h;
}
function openNorms(){
  var h='<h3>Нормы на агента</h3><div class="sh">месяц · неделя считается сама</div>';
  for(var i=0;i<NORMKEYS.length;i++){ var k=NORMKEYS[i].k;
    h+='<div class="lbl">'+NORMKEYS[i].l+' · сейчас '+normW(k)+' в неделю</div><input type="number" inputmode="numeric" id="n_'+k+'" value="'+normM(k)+'">'; }
  h+='<div class="sbtn"><button class="btn" onclick="closeSheet()">Отмена</button>'+
     '<button class="btn pri" onclick="saveNorms()">Сохранить</button></div>';
  sheet(h);
}
function saveNorms(){
  for(var i=0;i<NORMKEYS.length;i++){ var k=NORMKEYS[i].k, e=document.getElementById('n_'+k);
    if(e&&e.value!=='') state.norm[k]=Number(e.value); }
  save(); closeSheet(); render();
}
function resetPw(id){
  var a=agent(id);
  sheet('<h3>Сбросить пароль?</h3><div class="sh">'+esc(a.name)+'</div>'+
    '<div class="hint">Агент получит новый пароль в Телеграме, все его сессии закроются.</div>'+
    '<div class="sbtn"><button class="btn" onclick="closeSheet()">Отмена</button>'+
    '<button class="btn pri" onclick="closeSheet()">Сбросить</button></div>');
}
function delAgent(id){
  var a=agent(id);
  sheet('<h3>Удалить из отдела?</h3><div class="sh">'+esc(a.name)+'</div>'+
    '<div class="hint">Доступ закроется, а все его записи останутся в отчётах — иначе статистика прошлых месяцев поедет.</div>'+
    '<div class="sbtn"><button class="btn" onclick="closeSheet()">Отмена</button>'+
    '<button class="btn warn" onclick="doDel('+id+')">Удалить</button></div>');
}
function doDel(id){
  var n=[]; for(var i=0;i<state.agents.length;i++) if(state.agents[i].id!==id) n.push(state.agents[i]);
  state.agents=n; save(); closeSheet(); render();
}
function addAgent(){
  sheet('<h3>Новый агент</h3><div class="sh">в отдел №2</div>'+
    '<div class="lbl">Фамилия и имя</div><input id="aName" placeholder="Иванова Мария">'+
    '<div class="hint">Пароль придёт ему в Телеграм, при первом входе система попросит его сменить.</div>'+
    '<div class="sbtn"><button class="btn" onclick="closeSheet()">Отмена</button>'+
    '<button class="btn pri" onclick="saveAgent()">Добавить</button></div>');
}
function saveAgent(){
  var e=document.getElementById('aName');
  if(!e.value){ alert('Укажите имя'); return; }
  var z={sdelka:0,pd:0,pokaz:0,ocenka:0,vstr:0,rekl:0,leads:0};
  state.agents.push({id:++state.seq,name:e.value,sent:false,status:null,tasks:[],plan:0,done:0,refused:0,moved:0,
    week:JSON.parse(JSON.stringify(z)),month:JSON.parse(JSON.stringify(z)),fc:[],leads:0,rop:[]});
  save(); closeSheet(); render();
}
function logout(){ state.user=null; pickName=null; save(); render(); }

/* ================= общее ================= */
function sheet(h){ document.getElementById('sheet').innerHTML=h; document.getElementById('ovl').classList.add('on'); }
function closeSheet(){ document.getElementById('ovl').classList.remove('on'); }
function resetAll(){
  sheet('<h3>Сбросить прототип?</h3><div class="sh">данные вернутся к исходным</div>'+
    '<div class="sbtn"><button class="btn" onclick="closeSheet()">Отмена</button>'+
    '<button class="btn pri" onclick="doReset()">Сбросить</button></div>');
}
function doReset(){ var u=state.user; state=seed(); state.user=u; save(); nav='inbox'; openA=null; closeSheet(); render(); }
render();
</script>
</body>
</html>
