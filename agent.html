<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>ТОЧНО. — Кабинет агента</title>
<style>
:root{
  color-scheme:light;
  --ink:#101010; --ink-2:#5A5A5A; --mute:#757575;
  --line:#E6E6E6; --paper:#FFFFFF; --card:#FFFFFF;
  --surface:#FAFAFA; --surface-2:#F0F0F0;
  --dot:#0D7A46; --on-dot:#FFFFFF; --star:#8A6100; --red:#B3261E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.55}
button{font-family:inherit}
.app{max-width:560px;margin:0 auto;padding:14px 14px 150px}

.login{max-width:420px;margin:0 auto;padding:56px 18px}
.login .mark{font-size:26px;font-weight:600;letter-spacing:-.03em;margin-bottom:6px}
.login .mark i{font-style:normal;color:var(--dot)}
.login .sub{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:34px}
.login h2{font-size:21px;letter-spacing:-.03em;margin:0 0 16px}
.pick{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:2px;padding:14px;margin-bottom:7px;font-size:15px;color:var(--ink-2)}
.pick.on{border-color:var(--dot);border-width:2px;color:var(--ink);font-weight:600}
.note{font-size:13px;color:var(--mute);margin-top:12px;text-align:center}

.hdr{padding-bottom:12px;border-bottom:2px solid var(--ink);margin-bottom:14px}
.hdr .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mark{font-size:20px;font-weight:600;letter-spacing:-.03em;line-height:1}
.mark i{font-style:normal;color:var(--dot)}
.mark small{display:block;font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:400;margin-top:5px}
.who{text-align:right}
.who b{display:block;font-size:14px;font-weight:600}
.who span{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mute)}

.submit{width:100%;margin-top:12px;background:var(--dot);color:var(--on-dot);border:0;border-radius:2px;padding:15px;font-size:16px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:9px}
.submit[disabled]{background:var(--surface-2);color:var(--mute)}
.status{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
.dotmark{width:9px;height:9px;border-radius:50%;flex:none}
.dotmark.ok{background:var(--dot)} .dotmark.wait{background:var(--star)} .dotmark.no{background:var(--red)} .dotmark.none{background:var(--line)}

.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:13px;margin-bottom:12px}
.card .t{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.norms{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.norms button{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:9px 5px;text-align:center;color:inherit}
.norms b{display:block;font-size:17px;font-weight:600;letter-spacing:-.03em}
.norms b.good{color:var(--dot)}
.norms span{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.bar{height:6px;background:var(--surface-2);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--dot)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;color:var(--ink-2);padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv b{color:var(--ink);text-align:right;white-space:nowrap;font-weight:600}
.kv b.g{color:var(--dot)} .kv b.r{color:var(--red)} .kv b.s{color:var(--star)}

.sec{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:18px 2px 8px}
.item{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:2px;padding:12px 13px;margin-bottom:8px;display:flex;gap:12px;align-items:center;color:inherit}
.item.done{background:var(--surface)}
.item.alert{border-color:var(--red)}
.item .ic{width:44px;height:44px;flex:none;border-radius:2px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--dot)}
.item .tx{flex:1;min-width:0}
.item .tp{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.item .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .rt{font-size:13px;font-weight:600;flex:none;text-align:right;max-width:40%}
.rt.ok{color:var(--dot)} .rt.mv{color:var(--star)} .rt.no{color:var(--red)} .rt.wait{color:var(--mute);font-weight:400}
.add{width:100%;background:transparent;border:1.5px dashed var(--line);color:var(--mute);border-radius:2px;padding:13px;font-size:14.5px;font-weight:600;margin-bottom:8px}
.add.solid{border-style:solid;border-color:var(--ink);color:var(--ink)}
.hint{font-size:13.5px;color:var(--mute);margin:2px 4px 12px}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);border-top:1px solid var(--line)}
.bottom .in{max-width:560px;margin:0 auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.nav{display:flex;gap:2px}
.nav button{flex:1;background:none;border:0;color:var(--mute);font-size:11px;padding:6px 2px}
.nav button b{display:flex;justify-content:center;margin-bottom:3px;font-weight:400}
.nav button.on{color:var(--dot);font-weight:600}

.ovl{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:20}
.ovl.on{display:flex}
.sheet{background:var(--paper);width:100%;max-width:560px;margin:0 auto;border-radius:2px 2px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
.sheet h3{margin:0 0 3px;font-size:19px;letter-spacing:-.03em}
.sh{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:14px}
.wiz{position:fixed;inset:0;background:var(--paper);z-index:30;display:none;overflow-y:auto}
.wiz.on{display:block}
.wiz .in{max-width:560px;margin:0 auto;padding:16px 14px 120px}
.wtitle{font-size:22px;letter-spacing:-.03em;margin:0 0 4px;font-weight:600}
.steps{display:flex;gap:5px;margin-bottom:16px}
.steps div{flex:1;height:4px;background:var(--surface-2)}
.steps div.on{background:var(--dot)}
.wizbar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
.wizbar .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.wizbar button{flex:1;border-radius:2px;padding:15px;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink-2)}
.wizbar button.pri{background:var(--dot);color:var(--on-dot);border-color:var(--dot);flex:2}

.lbl{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:14px 2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:12px 13px;font-size:15px;color:var(--ink-2);flex:1 1 auto;min-width:calc(33% - 6px);display:flex;align-items:center;justify-content:center;gap:7px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.chip.on.g{background:var(--dot);color:var(--on-dot);border-color:var(--dot)}
.chip.on.r{background:var(--red);color:#fff;border-color:var(--red)}
.chip.on.s{background:var(--star);color:#fff;border-color:var(--star)}
.chip.half{min-width:calc(50% - 6px)}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:2px;padding:13px;font-size:16px;font-family:inherit;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbtn{display:flex;gap:8px;margin-top:18px}
.sbtn button{flex:1;border-radius:2px;padding:15px;font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink-2)}
.sbtn button.pri{background:var(--dot);color:var(--on-dot);border-color:var(--dot)}
.big{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.big small{display:block;font-size:13.5px;font-weight:400;color:var(--ink-2);letter-spacing:0;margin-top:6px}
.foot{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute);text-align:center}
.foot button{background:none;border:0;color:var(--mute);font-family:ui-monospace,Menlo,monospace;font-size:11px;text-decoration:underline;padding:6px}
</style>
</head>
<body>
<div id="root"></div>
<div class="ovl" id="ovl" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="wiz" id="wiz"><div class="in" id="wizin"></div><div class="wizbar"><div class="in" id="wizbar"></div></div></div>

<script>
/* ================= иконки ================= */
var IC={
list:'<rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M8 8h8M8 12h8M8 16h5"/>',
chart:'<path d="M4 20h16"/><path d="M7.5 20v-5M12 20v-9M16.5 20v-6"/>',
home:'<path d="M4 11 12 4l8 7"/><path d="M6.5 10v10h11V10"/>',
search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/>',
money:'<rect x="3" y="6" width="18" height="12" rx="1.5"/><circle cx="12" cy="12" r="2.5"/>',
doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 17h4"/>',
meet:'<circle cx="8" cy="8.5" r="2.5"/><circle cx="16" cy="8.5" r="2.5"/><path d="M3.5 19a4.5 4.5 0 0 1 9 0"/><path d="M11.5 19a4.5 4.5 0 0 1 9 0"/>',
screen:'<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M9 20h6M12 16v4"/>',
target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 12h.01"/>',
past:'<path d="M3.8 12a8.2 8.2 0 1 0 2.6-6"/><path d="M3.5 3.5v4.2h4.2"/><path d="M12 8v4.4l3 1.8"/>',
future:'<rect x="3" y="5" width="18" height="16" rx="1.5"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M9.5 15.5h5.5m-2-2.2 2.2 2.2-2.2 2.2"/>',
send:'<path d="M20.5 3.5 3.5 10.8l7 2.9 2.9 7z"/><path d="M20.5 3.5 10.5 13.7"/>',
pin:'<path d="M9 3h6l-1 5.2 3 2.8v2H7v-2l3-2.8z"/><path d="M12 13v8"/>',
ok:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
alert:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.5M12 16.5v.01"/>',
week:'<rect x="3" y="4" width="18" height="17" rx="1.5"/><path d="M3 9h18M8 2v4M16 2v4M7 13h4M7 17h8"/>',
plus:'<path d="M12 5v14M5 12h14"/>'
};
function ic(n,s){ s=s||26; return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block">'+(IC[n]||'')+'</svg>'; }

/* ================= хранилище ================= */
var KEY='topf-agent-v4', mem=null;
function save(){ var s=JSON.stringify(state); try{ localStorage.setItem(KEY,s);}catch(e){ mem=s; } }
function load(){ var s=null; try{ s=localStorage.getItem(KEY);}catch(e){ s=mem; } if(!s)s=mem;
  if(!s) return null; try{ return JSON.parse(s);}catch(e){ return null; } }

/* ================= справочники ================= */
var STAFF=['Брыкина Александра','Кастромина Ольга','Кондратьева Ирина','Розанова Мария','Смирнова Анна'];
var TYPES=[
 {k:'pokaz', n:'Показ',    ic:'home',   cl:'buyer'},
 {k:'ocenka',n:'Оценка',   ic:'search', cl:'seller'},
 {k:'vstr',  n:'Встреча',  ic:'meet',   cl:'buyer'},
 {k:'pd',    n:'Задаток',  ic:'money',  cl:'any',  money:true},
 {k:'rekl',  n:'В рекламу',ic:'screen', cl:'seller'},
 {k:'od',    n:'Договор',  ic:'doc',    cl:'any',  money:true}
];
var NORMKEYS=[{k:'pd',label:'задаток'},{k:'pokaz',label:'показы'},{k:'ocenka',label:'оценки'},
              {k:'rekl',label:'реклама'},{k:'vstr',label:'встречи'},{k:'leads',label:'заявки'}];
var REASONS=['Клиент перенёс','Клиент не на связи','Собственник отказал','Не успел(а)','Ушли мимо','Ипотека не одобрена'];
function T(k){ for(var i=0;i<TYPES.length;i++) if(TYPES[i].k===k) return TYPES[i]; return TYPES[0]; }

/* ================= даты ================= */
function iso(d){ return d.toISOString().slice(0,10); }
function plus(n){ return iso(new Date(Date.now()+n*864e5)); }
var MN=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
var WD=['вс','пн','вт','ср','чт','пт','сб'];
function ru(d){ var p=String(d).split('-'); return parseInt(p[2],10)+' '+MN[parseInt(p[1],10)-1]; }
function rud(d){ var dt=new Date(d+'T00:00:00'); return WD[dt.getDay()]+', '+ru(d); }
function money(n){ return Number(n||0).toLocaleString('ru-RU')+' ₽'; }
function esc(s){ return String(s==null?'':s).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); }
function weekLabel(){ var d=new Date(), day=(d.getDay()+6)%7; return 'Неделя с '+ru(plus(-day)); }

/* ================= данные ================= */
function seed(){
  var t=iso(new Date()), y=plus(-1);
  return {
    user:null, date:t, dateY:y, seq:100,
    norm:{pd:1,pokaz:5,ocenka:4,rekl:2,vstr:4,leads:6},
    monthNorm:{pokaz:20,ocenka:16,rekl:6},
    tasks:[
      {id:1,type:'pokaz', obj:'Строителей 11', cl:'Кондрева', clt:'buyer', date:y,       time:'18:00', status:'done'},
      {id:2,type:'pokaz', obj:'Попова 72',     cl:'Кондрева', clt:'buyer', date:y,       time:'19:00', status:null},
      {id:3,type:'ocenka',obj:'Ладожская 35',  cl:'Роза',     clt:'seller',date:y,       time:'13:00', status:null},
      {id:4,type:'rekl',  obj:'Мира 45',       cl:'Сомов',    clt:'seller',date:y,       time:'',      status:null},
      {id:5,type:'vstr',  obj:'Офис',          cl:'Юлия',     clt:'buyer', date:y,       time:'16:00', status:null},
      {id:6,type:'pokaz', obj:'Онежская 19',   cl:'Юлия',     clt:'buyer', date:t,       time:'12:00', status:null},
      {id:7,type:'ocenka',obj:'Тепличная 4',   cl:'Маргарита',clt:'seller',date:t,       time:'16:00', status:null},
      {id:8,type:'pokaz', obj:'Строителей 68а',cl:'Пётр',     clt:'buyer', date:plus(1), time:'11:00', status:null},
      {id:9,type:'pd',    obj:'Тепличная 4',   cl:'Маргарита',clt:'buyer', date:plus(2), time:'15:00', sum:105000, status:null}
    ],
    ropTasks:[
      {id:21,text:'Разобрать портфель',date:t,done:null,why:''},
      {id:22,text:'Сделать предложение по цене Маргарите',date:t,done:null,why:''}
    ],
    leadsY:null,
    weekDone:{pokaz:4,ocenka:1,rekl:1,vstr:1,pd:0,leads:5},
    fc:{week:weekLabel(),items:[{id:31,obj:'Строителей 11',cl:'Кондрева',sum:105000}],sent:false},
    reports:[
      {date:plus(-1),label:'Вчера',        kind:'day', status:'accepted',plan:5,fact:4,leads:5},
      {date:plus(-2),label:'Позавчера',    kind:'day', status:'extra',   plan:6,fact:6,leads:7,note:'Принят с задачей: разобрать портфель'},
      {date:plus(-4),label:'Пт – сб – вс', kind:'day', status:'accepted',plan:9,fact:7,leads:11},
      {date:plus(-7),label:'Прошлая неделя',kind:'week',status:'auto',
       w:{pd:'1/1',pokaz:'12/5',ocenka:'3/4',rekl:'2/2',vstr:'5/4',leads:'24/6'}}
    ],
    today:{sent:false,status:null,at:null},
    month:{pokaz:14,ocenka:5,rekl:3,vstr:6,pd:2,leads:22,comm:320000}
  };
}
var state=load()||seed();
(function migrate(){
  var d=seed();
  for(var k in d){ if(typeof state[k]==='undefined') state[k]=d[k]; }
  if(state.date!==iso(new Date())){ var u=state.user; state=seed(); state.user=u; }
  save();
})();

/* ================= выборки ================= */
function byDate(d){ var o=[]; for(var i=0;i<state.tasks.length;i++) if(state.tasks[i].date===d) o.push(state.tasks[i]); return o; }
function futureTasks(){ var o=[]; for(var i=0;i<state.tasks.length;i++) if(state.tasks[i].date>state.date) o.push(state.tasks[i]);
  o.sort(function(a,b){ return a.date<b.date?-1:1; }); return o; }
function task(id){ for(var i=0;i<state.tasks.length;i++) if(state.tasks[i].id===id) return state.tasks[i]; return null; }
function yestLeft(){ var n=0,y=byDate(state.dateY); for(var i=0;i<y.length;i++) if(!y[i].status) n++; return n; }
function weekCount(k){
  var n=state.weekDone[k]||0, d=byDate(state.dateY).concat(byDate(state.date));
  for(var i=0;i<d.length;i++) if(d[i].type===k&&d[i].status==='done') n++;
  return n;
}
function weekLeads(){ return (state.weekDone.leads||0)+(state.leadsY||0); }

/* ================= рендер ================= */
var nav='today', pickName=null, meMode='month';
function render(){
  try{ draw(); }catch(e){
    document.getElementById('root').innerHTML='<div class="app"><div class="card"><div class="t">Что-то пошло не так</div>'+
      '<p style="font-size:14px">Похоже, сохранились данные прошлой версии.</p>'+
      '<button class="add" onclick="hardReset()">Очистить и открыть заново</button>'+
      '<div class="hint">'+esc(e.message)+'</div></div></div>';
  }
}
function hardReset(){ try{ localStorage.removeItem(KEY);}catch(e){} mem=null; state=seed(); save(); location.reload(); }
function draw(){
  var r=document.getElementById('root');
  if(!state.user){ r.innerHTML=loginHTML(); return; }
  var body = nav==='today'? todayHTML()
           : nav==='yest' ? yestHTML()
           : nav==='past' ? pastHTML()
           : nav==='fut'  ? futHTML()
           : nav==='fc'   ? fcHTML()
           : meHTML();
  r.innerHTML='<div class="app">'+hdrHTML()+body+
    '<div class="foot">ТОЧНО. · кабинет агента v0.4 · прототип<br>Данные хранятся только на этом устройстве.<br>'+
    '<button onclick="resetAll()">сбросить и начать заново</button></div></div>'+navHTML();
}
function navHTML(){
  var t=(nav==='yest'?'today':nav);
  return '<div class="bottom"><div class="in"><div class="nav">'+
    nb(t,'today','list','Сегодня')+nb(t,'past','past','Прошлое')+nb(t,'fut','future','Будущее')+
    nb(t,'fc','target','Прогноз')+nb(t,'me','chart','Моё')+'</div></div></div>';
}
function nb(cur,k,i,n){ return '<button class="'+(cur===k?'on':'')+'" onclick="go(\''+k+'\')"><b>'+ic(i,24)+'</b>'+n+'</button>'; }
function go(k){ nav=k; render(); }

function hdrHTML(){
  var st=state.today;
  var h='<div class="hdr"><div class="row">'+
    '<div class="mark">ТОЧНО<i>.</i><small>план / факт · v0.4</small></div>'+
    '<div class="who"><b>'+esc(state.user)+'</b><span>'+rud(state.date)+'</span></div></div>';
  if(!st.sent){
    h+='<button class="submit" onclick="openWiz()">'+ic('send',20)+'Сдать план и факт</button>'+
       '<div class="status"><span class="dotmark none"></span>Не сдан · срок до 10:00</div>';
  } else {

function itemHTML(it,mode){
  var t=T(it.type), sub=[];
  if(it.cl) sub.push(it.cl+(it.clt?' · '+(it.clt==='buyer'?'покупатель':'продавец'):''));

  var right = mode==='fut' ? '<span class="rt wait">'+ru(it.date)+(it.time?' · '+it.time:'')+'</span>'
            : (it.status?statusView(it):'<span class="rt wait">отметить</span>');

    '<div class="tx"><div class="tp">'+t.n+(it.star?' · вне плана':'')+'</div>'+
    '<div class="nm">'+esc(it.obj||'без адреса')+'</div>'+
    (sub.length?'<div class="sub">'+esc(sub.join(' · '))+'</div>':'')+'</div>'+right+'</button>';

function statusView(it){
  if(it.status==='done')   return '<span class="rt ok">сделано</span>';
  if(it.status==='cancel') return '<span class="rt no">отмена</span>';
  if(it.status==='none')   return '<span class="rt no">не назначено</span>';
  return '<span class="rt wait">отметить</span>';
}

  if(curStatus==='move') h+='<div class="lbl">Перенесено на</div><input type="date" id="fDate" value="'+(cur.moveTo||plus(1))+'" min="'+state.date+'">';
  if(curStatus&&curStatus!=='done'){
    h+='<div class="lbl">Причина</div><div class="chips">';
    for(var i=0;i<REASONS.length;i++)
      h+='<button class="chip half'+(curReason===REASONS[i]?' on':'')+'" onclick="curReason=\''+REASONS[i]+'\';drawTask()">'+REASONS[i]+'</button>';
    h+='</div>';

    h+='<div class="lbl">Сумма комиссии · обязательно</div><input type="number" inputmode="numeric" id="fSum" value="'+(cur.sum||'')+'" placeholder="105000">';
  h+='<div class="lbl">Результат</div><textarea id="fNote" placeholder="Планируем задаток в пятницу">'+esc(cur.note)+'</textarea>'+
     '<div class="sbtn"><button onclick="closeSheet()">Отмена</button>'+
     '<button class="pri" onclick="saveTask()"'+(curStatus?'':' disabled')+'>Сохранить</button></div>'+
     '<button class="add" style="margin-top:9px" onclick="openAdd(cur.date,cur.star,cur.id)">Изменить объект и клиента</button>';

}
function sb(k,l,c){ return '<button class="chip half'+(curStatus===k?' on '+c:'')+'" onclick="curStatus=\''+k+'\';drawTask()">'+l+'</button>'; }
function saveTask(){
  var s=document.getElementById('fSum');
  if(curStatus==='done'&&T(cur.type).money&&(!s||!s.value)){ alert('Для задатка и договора сумма комиссии обязательна'); return; }
  var n=document.getElementById('fNote'); if(n) cur.note=n.value;
  if(s&&s.value) cur.sum=Number(s.value);
  if(curStatus==='move'){
    var d=document.getElementById('fDate');
    cur.date=d?d.value:plus(1); cur.status=null; cur.reason=curReason;

    cur.status=curStatus; cur.reason=(curStatus==='done'?null:curReason);

  save(); closeSheet(); if(document.getElementById('wiz').classList.contains('on')) drawWiz(); else render();
}

var curRop=null;
function openRop(id){
  for(var i=0;i<state.ropTasks.length;i++) if(state.ropTasks[i].id===id) curRop=state.ropTasks[i];
  if(!curRop) return;
  sheet('<h3>Задача от РОПа</h3><div class="sh">'+ru(curRop.date)+'</div>'+
    '<div class="card"><div style="font-size:15px">'+esc(curRop.text)+'</div></div>'+
    '<div class="lbl">Выполнено?</div><div class="chips">'+
    '<button class="chip half'+(curRop.done===true?' on g':'')+'" onclick="setRop(true)">Да</button>'+
    '<button class="chip half'+(curRop.done===false?' on r':'')+'" onclick="setRop(false)">Нет</button></div>'+
    (curRop.done===false?'<div class="lbl">Почему не сделано · обязательно</div><textarea id="rWhy" placeholder="Не дозвонился собственнику">'+esc(curRop.why)+'</textarea>':'')+
    '<div class="sbtn"><button onclick="closeSheet()">Закрыть</button><button class="pri" onclick="saveRop()">Сохранить</button></div>');
}
function setRop(v){ curRop.done=v; openRop(curRop.id); }
function saveRop(){
  if(curRop.done===null){ alert('Отметьте да или нет'); return; }
  var w=document.getElementById('rWhy');
  if(curRop.done===false&&(!w||!w.value)){ alert('Напишите, почему не сделано'); return; }
  if(w) curRop.why=w.value;
  save(); closeSheet(); render();
}

/* ================= добавление дела ================= */
var form={};
function openAdd(date,star,editId){
  form={id:editId||0,type:'pokaz',obj:'',cl:'',clt:'buyer',date:date||state.date,time:'',sum:'',star:!!star,vague:false};
  if(editId){ var t=task(editId); if(t) form={id:t.id,type:t.type,obj:t.obj,cl:t.cl,clt:t.clt,date:t.date,time:t.time,sum:t.sum||'',star:!!t.star,vague:!!t.vague}; }
  fixClt(); drawAdd();
}
function openVague(){ form={id:0,type:'pokaz',obj:'',cl:'',clt:'',date:state.date,time:'',sum:'',star:false,vague:true}; drawAdd(); }
function fixClt(){ var t=T(form.type); if(t.cl!=='any') form.clt=t.cl; }
function drawAdd(){
  var t=T(form.type);
  var h='<h3>'+(form.id?'Дело':(form.vague?'Назначить новое':(form.star?'Дело вне плана':'Новое дело')))+'</h3>'+
    '<div class="sh">'+(form.vague?'без адреса и клиента':rud(form.date))+'</div>'+
    '<div class="lbl">Тип</div><div class="chips">';
  for(var i=0;i<TYPES.length;i++)
    h+='<button class="chip half'+(form.type===TYPES[i].k?' on':'')+'" onclick="grab();form.type=\''+TYPES[i].k+'\';fixClt();drawAdd()">'+ic(TYPES[i].ic,18)+TYPES[i].n+'</button>';
  h+='</div><div class="lbl">Дата</div><input type="date" id="aDate" value="'+form.date+'">';
  if(!form.vague){
    h+='<div class="lbl">Объект · адрес</div><input id="aObj" value="'+esc(form.obj)+'" placeholder="Строителей 11">'+
       '<div class="lbl">Клиент · имя без фамилии</div><input id="aCl" value="'+esc(form.cl)+'" placeholder="Кондрева">'+
       '<div class="lbl">Тип клиента</div><div class="chips">';
    if(t.cl==='any'){
      h+='<button class="chip half'+(form.clt==='buyer'?' on':'')+'" onclick="grab();form.clt=\'buyer\';drawAdd()">Покупатель</button>'+
         '<button class="chip half'+(form.clt==='seller'?' on':'')+'" onclick="grab();form.clt=\'seller\';drawAdd()">Продавец</button>';
    } else {
      h+='<button class="chip on">'+(t.cl==='buyer'?'Покупатель':'Продавец')+' · по типу дела</button>';
    }
    h+='</div>';
  }
  h+='<div class="row2"><div><div class="lbl">Время</div><input type="time" id="aTime" value="'+(form.time||'')+'"></div>'+
     (t.money?'<div><div class="lbl">Комиссия ₽</div><input type="number" inputmode="numeric" id="aSum" value="'+(form.sum||'')+'" placeholder="105000"></div>':'<div></div>')+
     '</div><div class="sbtn"><button onclick="closeSheet()">Отмена</button><button class="pri" onclick="saveAdd(0)">Сохранить</button></div>';
  if(!form.id&&!form.vague&&form.type==='pokaz') h+='<button class="add" style="margin-top:9px" onclick="saveAdd(1)">Сохранить и ещё показ этому же клиенту</button>';
  if(form.id) h+='<button class="add" style="margin-top:9px" onclick="delTask()">Удалить дело</button>';
  sheet(h);
  setTimeout(function(){ var o=document.getElementById('aObj'); if(o&&!form.obj) o.focus(); },60);
}
function grab(){
  var g=function(id){ var e=document.getElementById(id); return e?e.value:null; }, v;
  if((v=g('aObj'))!==null) form.obj=v;
  if((v=g('aCl'))!==null) form.cl=v;
  if((v=g('aTime'))!==null) form.time=v;
  if((v=g('aSum'))!==null) form.sum=v;
  if((v=g('aDate'))!==null) form.date=v;
}
function saveAdd(again){
  grab(); fixClt();
  var t=T(form.type);
  if(!form.vague&&!form.obj){ alert('Укажите адрес объекта'); return; }
  if(!form.vague&&t.cl==='any'&&!form.clt){ alert('Выберите: покупатель или продавец'); return; }
  if(t.money&&!form.vague&&!form.sum){ alert('Для задатка и договора нужна сумма комиссии'); return; }
  if(form.id){
    var e=task(form.id);
    e.type=form.type; e.obj=form.obj; e.cl=form.cl; e.clt=form.clt; e.date=form.date; e.time=form.time;
    if(form.sum) e.sum=Number(form.sum);
  } else {
    var it={id:++state.seq,type:form.type,obj:form.obj,cl:form.cl,clt:form.clt,date:form.date,time:form.time,status:null};
    if(form.sum) it.sum=Number(form.sum);
    if(form.star){ it.star=true; it.status='done'; }
    if(form.vague){ it.vague=true; it.obj=''; it.cl=''; }
    state.tasks.push(it);
  }
  save();
  if(again){
    form={id:0,type:'pokaz',obj:'',cl:form.cl,clt:form.clt,date:form.date,time:'',sum:'',star:form.star,vague:false};
    drawAdd(); return;
  }
  closeSheet();
  if(document.getElementById('wiz').classList.contains('on')) drawWiz(); else render();
}
function delTask(){
  if(!confirm('Удалить дело?')) return;
  var n=[]; for(var i=0;i<state.tasks.length;i++) if(state.tasks[i].id!==form.id) n.push(state.tasks[i]);
  state.tasks=n; save(); closeSheet();
  if(document.getElementById('wiz').classList.contains('on')) drawWiz(); else render();
}

/* ================= мастер сдачи ================= */
var step=0, wLeads='';
function openWiz(){ step=0; wLeads=(state.leadsY===null?'':String(state.leadsY)); drawWiz(); document.getElementById('wiz').classList.add('on'); }
function closeWiz(){ document.getElementById('wiz').classList.remove('on'); render(); }
function drawWiz(){
  var h='<div class="steps">'+[0,1,2,3].map(function(i){ return '<div class="'+(i<=step?'on':'')+'"></div>'; }).join('')+'</div>', bar='';
  if(step===0){
    var y=byDate(state.dateY), left=yestLeft();
    h+='<div class="wtitle">Факт за вчера</div><div class="sh">'+rud(state.dateY)+'</div>';
    for(var i=0;i<y.length;i++) h+=itemHTML(y[i],'today');
    h+='<button class="add solid" onclick="openAdd(state.dateY,true)">+ Что было вне плана</button>';
    if(left) h+='<div class="hint" style="color:var(--red)">Не отмечено дел: '+left+'. Без этого сдать нельзя.</div>';
    bar='<button onclick="closeWiz()">Закрыть</button><button class="pri" onclick="wizNext()">Дальше</button>';
  }
  if(step===1){
    h+='<div class="wtitle">Заявки за вчера</div><div class="sh">сколько пришло</div>'+
       '<div class="card"><div class="kv"><span>Норма недели</span><b>'+state.norm.leads+'</b></div>'+
       '<div class="kv"><span>Уже за неделю</span><b>'+(state.weekDone.leads||0)+'</b></div></div>'+
       '<div class="lbl">Заявок за вчера</div><input type="number" inputmode="numeric" id="wLeads" value="'+wLeads+'" placeholder="0">'+
       '<div class="hint">Это входящий поток, а не ваша работа. Цифра нужна, чтобы считать, сколько заявок дошло до показа.</div>';
    bar='<button onclick="wizBack()">Назад</button><button class="pri" onclick="wizNext()">Дальше</button>';
  }
  if(step===2){
    var t=byDate(state.date);
    h+='<div class="wtitle">План на сегодня</div><div class="sh">'+rud(state.date)+'</div>';
    for(var j=0;j<t.length;j++) h+=itemHTML(t[j],'fut');
    h+='<button class="add solid" onclick="openAdd(state.date)">+ Добавить дело</button>'+
       '<button class="add" onclick="openVague()">Назначить новое · без адреса</button>';
    if(!t.length) h+='<div class="hint" style="color:var(--red)">План пустой. Добавьте хотя бы одно дело.</div>';
    bar='<button onclick="wizBack()">Назад</button><button class="pri" onclick="wizNext()">Дальше</button>';
  }
  if(step===3){
    h+='<div class="wtitle">Прогноз недели</div><div class="sh">'+esc(state.fc.week)+'</div>'+
       '<div class="card"><div class="big">'+money(fcSum())+'<small>по объектам: '+state.fc.items.length+'</small></div></div>';
    for(var w=0;w<state.fc.items.length;w++){ var f=state.fc.items[w];
      h+='<button class="item" onclick="openFc('+f.id+')"><div class="ic">'+ic('target')+'</div><div class="tx">'+
         '<div class="tp">задаток</div><div class="nm">'+esc(f.obj)+'</div><div class="sub">'+esc(f.cl)+'</div></div>'+
         '<span class="rt ok">'+money(f.sum)+'</span></button>';
    }
    h+='<button class="add solid" onclick="openFc(0)">+ Добавить объект</button>'+
       '<div class="hint">Подтвердите прогноз или скорректируйте. В понедельник он обязателен.</div>';
    bar='<button onclick="wizBack()">Назад</button><button class="pri" onclick="wizDone()">Сдать план и факт</button>';
  }
  document.getElementById('wizin').innerHTML=h;
  document.getElementById('wizbar').innerHTML=bar;
}
function wizBack(){ if(step===1){ var e=document.getElementById('wLeads'); if(e) wLeads=e.value; } step--; drawWiz(); }
function wizNext(){
  if(step===0&&yestLeft()){ alert('Отметьте все вчерашние дела'); return; }
  if(step===1){ var e=document.getElementById('wLeads');
    if(!e||e.value===''){ alert('Укажите количество заявок за вчера'); return; } wLeads=e.value; }
  if(step===2&&!byDate(state.date).length){ alert('План на сегодня пустой'); return; }
  step++; drawWiz();
}
function wizDone(){
  state.leadsY=Number(wLeads||0);
  state.fc.sent=true;
  var d=new Date();
  state.today={sent:true,status:'sent',at:('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)};
  var y=byDate(state.dateY), f=0;
  for(var i=0;i<y.length;i++) if(y[i].status==='done') f++;
  state.reports.unshift({date:state.dateY,label:'Вчера · сдан только что',kind:'day',status:'sent',plan:y.length,fact:f,leads:state.leadsY});
  save(); closeWiz(); nav='today'; render();
}

/* ================= общее ================= */
function sheet(h){ document.getElementById('sheet').innerHTML=h; document.getElementById('ovl').classList.add('on'); }
function closeSheet(){ document.getElementById('ovl').classList.remove('on'); }
function resetAll(){ if(!confirm('Сбросить прототип?')) return; var u=state.user; state=seed(); state.user=u; save(); nav='today'; render(); }
render();
</script>
</body>
</html>
