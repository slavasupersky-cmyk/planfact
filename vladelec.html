<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>ТОЧНО. — Кабинет собственника</title>
<style>
/* ============================================================
   ТОЧНО · план/факт — единая система интерфейса
   Цвета: чёрный, белый, салатовый + два сигнальных
   Шрифт: один · размеры 28/17/15/12 · начертания 400/600
   ============================================================ */
:root{
  --ink:#0F0F0F;        /* текст и активный фон */
  --mute:#8C8C8C;       /* единственный серый для текста */
  --line:#E9E9E9;       /* единственный серый для границ */
  --soft:#F6F6F6;       /* единственный серый для подложек */
  --bg:#FFFFFF;
  --lime:#AEEA00;       /* факт, достигнутое, главное действие */
  --on-lime:#0F0F0F;
  --plan:#F07C00;       /* план, ещё не сделано */
  --alarm:#E03A2F;      /* отказ, срыв */
  --t1:28px; --t2:17px; --t3:15px; --t4:12px;
  --r:8px; --pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:var(--t3);line-height:1.5;font-weight:400}
button,input,textarea{font-family:inherit;font-size:var(--t3);color:var(--ink)}
.app{max-width:560px;margin:0 auto;padding:var(--s4) var(--s4) 170px}

/* ---------- типографика ---------- */
.t1{font-size:var(--t1);font-weight:600;letter-spacing:-.03em;line-height:1.15}
.t2{font-size:var(--t2);font-weight:600;letter-spacing:-.01em;line-height:1.3}
.lbl,.sec,.sh,.t{font-size:var(--t4);font-weight:400;color:var(--mute);
  text-transform:uppercase;letter-spacing:.04em;line-height:1.3}
.hint{font-size:var(--t4);color:var(--mute);margin:var(--s2) 2px var(--s3)}
.big{font-size:var(--t1);font-weight:600;letter-spacing:-.03em;line-height:1.15}
.big small{display:block;font-size:var(--t4);font-weight:400;color:var(--mute);letter-spacing:0;margin-top:var(--s2)}

/* ---------- шапка ---------- */
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3);
  padding-bottom:var(--s3);border-bottom:1px solid var(--line);margin-bottom:var(--s4)}
.mark{font-size:20px;font-weight:600;letter-spacing:-.03em;line-height:1}
.mark i{font-style:normal;color:var(--lime)}
.mark small{display:block;font-size:var(--t4);color:var(--mute);font-weight:400;margin-top:6px;letter-spacing:.04em;text-transform:uppercase}
.who{display:flex;flex-direction:column;align-items:flex-end;gap:var(--s1);text-align:right}
.who b{font-size:var(--t3);font-weight:600}
.who .dt{font-size:var(--t4);color:var(--mute)}
.role{font-size:var(--t4);font-weight:600;background:var(--lime);color:var(--on-lime);
  padding:2px var(--s2);border-radius:var(--r);letter-spacing:.04em;text-transform:uppercase}

/* ---------- кнопки ---------- */
.btn{width:100%;height:52px;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:var(--r);font-size:var(--t3);font-weight:600;display:flex;align-items:center;
  justify-content:center;gap:var(--s2);padding:0 var(--s3)}
.btn+.btn{margin-top:var(--s2)}
.btn.pri{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.btn.ghost{border-style:dashed;color:var(--mute)}
.btn.warn{border-color:var(--alarm);color:var(--alarm)}
.btn[disabled]{background:var(--soft);border-color:var(--soft);color:var(--mute)}
.submit{margin-top:var(--s3)}
.status{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s2);font-size:var(--t4);color:var(--mute)}
.dm{width:8px;height:8px;border-radius:var(--pill);flex:none;background:var(--line)}
.dm.ok{background:var(--lime)} .dm.wait{background:var(--plan)} .dm.no{background:var(--alarm)}
.back{border:0;background:none;color:var(--mute);font-size:var(--t3);padding:0 0 var(--s3);font-weight:600}

/* ---------- карточки ---------- */
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--s4);margin-bottom:var(--s3)}
.card .t{display:block;margin-bottom:var(--s3)}
.sec{margin:var(--s5) 2px var(--s2)}
.sec.warn{color:var(--alarm)}

/* ---------- показатели ---------- */
.nrow{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.nrow button,.grid button,.grid div{background:var(--soft);border:0;border-radius:var(--r);
  padding:var(--s3) var(--s1);text-align:center;color:inherit;width:100%}
.nrow b,.grid b{display:block;font-size:var(--t2);font-weight:600;letter-spacing:-.02em;color:var(--plan)}
.nrow b.good,.grid b.good{color:var(--ink)}
.nrow b.bad,.grid b.bad{color:var(--alarm)}
.nrow span,.grid span{display:block;font-size:var(--t4);color:var(--mute);margin-top:2px}
.bar{height:6px;border-radius:var(--pill);background:var(--soft);overflow:hidden;margin:var(--s3) 0 var(--s2)}
.bar i{display:block;height:100%;background:var(--lime)}

/* ---------- строка «ключ — значение» ---------- */
.kv{display:grid;grid-template-columns:1fr 76px 48px;align-items:baseline;gap:var(--s2);
  padding:var(--s3) 0;border-bottom:1px solid var(--line);font-size:var(--t3)}
.kv.two{grid-template-columns:1fr auto}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--mute)}
.kv b,.kv .pf{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.kv .pct{text-align:right;font-size:var(--t4);color:var(--mute);font-variant-numeric:tabular-nums}
.kv b.g{color:var(--ink)} .kv b.r{color:var(--alarm)} .kv b.s{color:var(--plan)} .kv b.p{color:var(--plan)}
.pf .f{color:var(--ink)} .pf .sl{color:var(--mute);margin:0 2px} .pf .p{color:var(--plan)}

/* ---------- строка списка ---------- */
.item{width:100%;display:flex;align-items:center;gap:var(--s3);text-align:left;color:inherit;
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--s3) var(--s4);margin-bottom:var(--s2)}
.item.done{background:var(--soft);border-color:var(--soft)}
.item.alert{border-left:2px solid var(--alarm)}
.item.mv{border-left:2px solid var(--mute)}
.item .ic{width:40px;height:40px;flex:none;border-radius:var(--r);background:var(--soft);
  display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:var(--t3);font-weight:600}
.item .tx{flex:1;min-width:0}
.item .nm{font-size:var(--t2);font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .nm .tm{font-weight:400;color:var(--mute);margin-left:var(--s2)}
.item .sub{font-size:var(--t4);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tp{display:none}
.item .rt{flex:none;font-size:var(--t4);font-weight:600;text-align:right;max-width:40%}
.rt.ok{color:var(--ink)} .rt.no{color:var(--alarm)} .rt.mv{color:var(--mute)} .rt.wait{color:var(--mute);font-weight:400}

/* ---------- сворачиваемые блоки ---------- */
details{border:1px solid var(--line);border-radius:var(--r);margin-bottom:var(--s2);overflow:hidden}
details[open]{border-color:var(--ink)}
summary{list-style:none;cursor:pointer;padding:var(--s3) var(--s4);display:flex;align-items:center;
  gap:var(--s2);font-size:var(--t2);font-weight:600}
summary::-webkit-details-marker{display:none}
summary .cnt{margin-left:auto;font-size:var(--t4);color:var(--mute);font-weight:400}
summary .arw{display:none}
details[open] summary{border-bottom:1px solid var(--line)}
.dbody{padding:var(--s3) var(--s4)}

/* ---------- сегменты и чипы ---------- */
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2)}
.chips.three{grid-template-columns:repeat(3,1fr)}
.chip{height:48px;border:1px solid var(--line);background:var(--bg);color:var(--mute);
  border-radius:var(--r);font-size:var(--t3);font-weight:400;display:flex;align-items:center;
  justify-content:center;gap:6px;text-align:center;padding:0 var(--s2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.chip.on.g{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.chip.on.r{background:var(--alarm);border-color:var(--alarm);color:#fff}
.chip.on.s{background:var(--plan);border-color:var(--plan);color:#fff}

/* ---------- поля ---------- */
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--s3) var(--s4);font-size:16px}
input[type=date],input[type=time]{height:52px;padding:0 var(--s3);-webkit-appearance:none;appearance:none}
textarea{min-height:84px;resize:vertical;line-height:1.45}
.lbl{display:block;margin:var(--s4) 2px var(--s2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}

/* ---------- нижняя навигация ---------- */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line)}
.bottom .in{max-width:560px;margin:0 auto;padding:var(--s2) var(--s3) calc(var(--s2) + env(safe-area-inset-bottom))}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{background:none;border:0;color:var(--mute);font-size:var(--t4);padding:6px 2px;width:100%}
.nav button b{display:flex;justify-content:center;margin-bottom:var(--s1);font-weight:400}
.nav button.on{color:var(--ink);font-weight:600}

/* ---------- слой поверх ---------- */
.ovl{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;
  background:rgba(15,15,15,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ovl.on{display:flex}
.sheet{width:100%;max-width:560px;margin:0 auto;height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--bg);border-radius:16px 16px 0 0;padding:var(--s5) var(--s4) 0;
  display:flex;flex-direction:column}
.sheet h3{margin:0 0 var(--s1);font-size:var(--t1);font-weight:600;letter-spacing:-.03em;line-height:1.15}
.sh{display:block;margin-bottom:var(--s4)}
.sbtn{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:auto;
  padding:var(--s4) 0 calc(var(--s4) + env(safe-area-inset-bottom));position:sticky;bottom:0;background:var(--bg);z-index:2}
.sbtn .btn{margin:0}

/* ---------- мастер ---------- */
.wiz{position:fixed;inset:0;z-index:30;display:none;overflow-y:auto;background:var(--bg)}
.wiz.on{display:block}
.wiz .in{max-width:560px;margin:0 auto;padding:var(--s4) var(--s4) 210px}
.wtitle{font-size:var(--t1);font-weight:600;letter-spacing:-.03em;line-height:1.15;margin:0 0 var(--s1)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s1);margin-bottom:var(--s4)}
.steps div{height:3px;border-radius:var(--pill);background:var(--soft)}
.steps div.on{background:var(--lime)}
.wizbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom))}
.wizbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.wizbar .btn{margin:0}

/* ---------- вход ---------- */
.login{max-width:420px;margin:0 auto;padding:64px var(--s4)}
.login .mark{font-size:var(--t1);margin-bottom:var(--s2)}
.login .sub{font-size:var(--t4);color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin-bottom:var(--s5)}
.login h2{font-size:var(--t2);font-weight:600;margin:0 0 var(--s3)}
.pick{width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--s3) var(--s4);margin-bottom:var(--s2);font-size:var(--t3);color:var(--mute)}
.pick.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.note{font-size:var(--t4);color:var(--mute);margin-top:var(--s3);text-align:center}

/* ---------- подвал ---------- */
.foot{margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--line);
  font-size:var(--t4);color:var(--mute);text-align:center}
.foot button{background:none;border:0;color:var(--mute);font-size:var(--t4);text-decoration:underline;padding:6px}
.party{background:var(--lime);color:var(--on-lime);border-radius:var(--r);padding:var(--s4);
  text-align:center;font-weight:600;margin-bottom:var(--s3)}

/* ---------- строка-таблица (общая для всех кабинетов) ---------- */
.task{width:100%;display:grid;grid-template-columns:40px 58px 1fr auto;gap:var(--s3);align-items:center;
  text-align:left;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--s3) var(--s4);margin-bottom:var(--s2)}
.task.hassum{grid-template-columns:40px 58px 1fr auto auto}
.task.noic{grid-template-columns:58px 1fr auto}
.task.done{background:var(--soft);border-color:var(--soft)}
.task.hi{border-left:2px solid var(--plan)}
.task.bad{border-left:2px solid var(--alarm)}
.task .ic{width:40px;height:40px;border-radius:var(--r);background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:var(--t3);font-weight:600}
.task.done .ic{background:var(--bg)}
.task .c{min-width:0}
.task .c b{display:block;font-size:var(--t2);font-weight:600;letter-spacing:-.01em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.task .c span{display:block;font-size:var(--t4);color:var(--mute);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .c span.wrap{white-space:normal}
.task .sum{font-size:var(--t2);font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.task .r{display:flex;align-items:center;justify-content:flex-end;gap:var(--s2)}
.task .r:empty{display:none}
.st{display:inline-flex;align-items:center;height:32px;padding:0 var(--s3);border-radius:var(--pill);font-size:var(--t3);font-weight:600;white-space:nowrap;border:0;font-family:inherit}
.st.wait{background:rgba(240,124,0,.14);color:var(--plan)}
.st.ok{background:var(--lime);color:var(--on-lime)}
.st.no{background:rgba(224,58,47,.12);color:var(--alarm)}
.st.mv{background:var(--soft);color:var(--mute)}
.st.act{background:var(--ink);color:var(--bg)}
.status.alarm{color:var(--alarm)}
.hdr .row{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3)}
.hdr{display:block}
.who span{font-size:var(--t4);color:var(--mute)}
.verdict{font-size:var(--t2);font-weight:600;letter-spacing:-.01em;line-height:1.3;margin:0 0 var(--s2)}
.verdict.good{color:var(--ink)} .verdict.bad{color:var(--alarm)}
.cmp{font-size:var(--t4);color:var(--mute)}
.cmp b{font-weight:600;color:var(--ink)}
.seg{display:grid;gap:var(--s2);margin-bottom:var(--s3)}
.seg.two{grid-template-columns:1fr 1fr} .seg.three{grid-template-columns:repeat(3,1fr)}

/* ---------- тёмная тема ---------- */
:root{--ink:#F2F2F2;--mute:#8C8C8C;--line:#242424;--soft:#161616;--bg:#0B0B0B;--lime:#AEEA00;--on-lime:#0B0B0B;--plan:#FF9838;--alarm:#FF6B5C;color-scheme:dark}
.nrow b.good,.grid b.good,.kv b.g,.pf .f,.rt.ok{color:var(--lime)}
.task .ic{color:var(--lime)}
.ovl{background:rgba(0,0,0,.6)}
.sheet{border:1px solid var(--line);border-bottom:0}
.st.wait{background:rgba(255,152,56,.18)} .st.no{background:rgba(255,107,92,.16)}

</style>
</head>
<body>
<div id="root"></div>
<div class="ovl" id="ovl" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<script>
var IC={
users:'<circle cx="9" cy="8" r="3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.5a3 3 0 0 1 0 5.5"/><path d="M17.5 14a6 6 0 0 1 3 6"/>',
money:'<rect x="3" y="6" width="18" height="12" rx="1.5"/><circle cx="12" cy="12" r="2.5"/>',
doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 17h4"/>',
tune:'<path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15.5" cy="12" r="2"/><circle cx="7.5" cy="17" r="2"/>',
ok:'<path d="M5 12.5l4.5 4.5L19 7.5"/>'
};
function ic(n,s){ s=s||22; return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block">'+(IC[n]||'')+'</svg>'; }
var KEY='topf-owner-v4', mem=null;
function save(){ var s=JSON.stringify(state); try{ localStorage.setItem(KEY,s);}catch(e){ mem=s; } }
function load(){ var s=null; try{ s=localStorage.getItem(KEY);}catch(e){ s=mem; } if(!s)s=mem; if(!s) return null; try{ return JSON.parse(s);}catch(e){ return null; } }
var NK=[{k:'sdelka',l:'сделки'},{k:'pd',l:'задаток'},{k:'pokaz',l:'показы'},{k:'ocenka',l:'оценки'},{k:'vstr',l:'встречи'},{k:'rekl',l:'реклама'},{k:'leads',l:'заявки'}];
function money(n){ return Number(n||0).toLocaleString('ru-RU')+' ₽'; }
function mln(n){ return (n/1000000).toFixed(1).replace('.',',')+' млн'; }
function kk(n){ return Math.round(n/1000)+'к'; }
function esc(s){ return String(s==null?'':s).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); }
function iso(d){ return d.toISOString().slice(0,10); }
function plus(n){ return iso(new Date(Date.now()+n*864e5)); }
var MN=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'], WD=['вс','пн','вт','ср','чт','пт','сб'];
function ru(d){ var p=String(d).split('-'); return parseInt(p[2],10)+' '+MN[parseInt(p[1],10)-1]; }
function rud(d){ var dt=new Date(d+'T00:00:00'); return WD[dt.getDay()]+', '+ru(d); }
function ini(n){ var p=n.split(' '); return (p[0]||'')[0]+((p[1]||'')[0]||''); }
function warn(t){ flash(t,true); }
function flash(txt,bad){ var e=document.createElement('div'); e.style.cssText='position:fixed;left:0;right:0;top:0;z-index:60;padding:16px 14px;text-align:center;font-weight:600;font-size:15px;'+(bad?'background:#E03A2F;color:#fff':'background:#AEEA00;color:#0F0F0F'); e.textContent=txt; document.body.appendChild(e); setTimeout(function(){ if(e.parentNode) e.parentNode.removeChild(e); },bad?2600:1800); }

/* ================= данные ================= */
function seed(){
  var t=iso(new Date()), y=plus(-1);
  var A=function(n,k,prev){ return {name:n,week:{sdelka:k[0],pd:k[1],pokaz:k[2],ocenka:k[3],vstr:k[4],rekl:k[5],leads:k[6]},
    month:{sdelka:k[0]*3,pd:k[1]*3,pokaz:k[2]*4,ocenka:k[3]*4,vstr:k[4]*4,rekl:k[5]*4,leads:k[6]*4},pdSum:k[1]*100000,low:!!prev}; };
  function dep(id,name,rop,agents,sent,got,prevPd){ return {id:id,name:name,rop:rop,agents:agents,sent:sent,got:got,prevPd:prevPd}; }
  return {
    user:null,date:t,dateY:y,
    norm:{sdelka:4,pd:4,pokaz:20,ocenka:20,vstr:20,rekl:8,leads:40}, normW:{sdelka:1,pd:1,pokaz:5,ocenka:5,vstr:5,rekl:2,leads:10},

/* ================= расчёты ================= */
function normM(k){ return state.norm[k]||0; } function normW(k){ return state.normW[k]||0; }
function agents(){ var o=[]; for(var i=0;i<state.deps.length;i++) o=o.concat(state.deps[i].agents); return o; }
function depSum(d,p,k){ var n=0; for(var i=0;i<d.agents.length;i++) n+=d.agents[i][p][k]||0; return n; }
function coSum(p,k){ var n=0; for(var i=0;i<state.deps.length;i++) n+=depSum(state.deps[i],p,k); return n; }
function coNorm(p,k){ return (p==='week'?normW(k):normM(k))*agents().length; }
function depNorm(d,p,k){ return (p==='week'?normW(k):normM(k))*d.agents.length; }
function sentAll(){ var s=0,n=0; for(var i=0;i<state.deps.length;i++){ s+=state.deps[i].sent; n+=state.deps[i].agents.length; } return [s,n]; }
function pace(){ var expected=state.monthPlan*state.daysPassed/state.daysTotal; return Math.round((state.signedMonth/expected-1)*100); }

  h+='<div class="hint">Прошлые периоды пересчитаны не будут.</div><div class="sbtn"><button class="btn" onclick="closeSheet()">Отмена</button><button class="btn pri" onclick="saveNorms()">Сохранить версию</button></div>'; sheet(h); }
function saveNorms(){ for(var i=0;i<NK.length;i++){ var k=NK[i].k, w=document.getElementById('w_'+k), m=document.getElementById('m_'+k); if(w&&w.value!=='') state.normW[k]=Number(w.value); if(m&&m.value!=='') state.norm[k]=Number(m.value); } save(); closeSheet(); flash('Новая версия норм сохранена'); render(); }
function addDep(){ sheet('<h3>Новый отдел</h3><span class="sh">и его руководитель</span><span class="lbl">Название</span><input id="dName" placeholder="Отдел №4"><span class="lbl">РОП · фамилия и имя</span><input id="dRop" placeholder="Соколова Ирина"><div class="hint">РОП получит доступ и сам заведёт агентов.</div><div class="sbtn"><button class="btn" onclick="closeSheet()">Отмена</button><button class="btn pri" onclick="saveDep()">Создать</button></div>'); }
function saveDep(){ var n=document.getElementById('dName'), r=document.getElementById('dRop'); if(!n.value||!r.value){ warn('Заполните название и РОПа'); return; } var id=1; for(var i=0;i<state.deps.length;i++) if(state.deps[i].id>=id) id=state.deps[i].id+1; state.deps.push({id:id,name:n.value,rop:r.value,agents:[],sent:0,got:false,prevPd:0}); save(); closeSheet(); render(); }
function editRop(id){ var d=null; for(var i=0;i<state.deps.length;i++) if(state.deps[i].id===id) d=state.deps[i]; sheet('<h3>Сменить РОПа</h3><span class="sh">'+esc(d.name)+'</span><div class="card"><div class="kv two"><span>Сейчас</span><b>'+esc(d.rop)+'</b></div></div><span class="lbl">Новый РОП</span><input id="rName" placeholder="Фамилия и имя"><div class="sbtn"><button class="btn" onclick="closeSheet()">Отмена</button><button class="btn pri" onclick="saveRop('+id+')">Сменить</button></div>'); }
function saveRop(id){ var e=document.getElementById('rName'); if(!e.value){ warn('Укажите имя'); return; } for(var i=0;i<state.deps.length;i++) if(state.deps[i].id===id) state.deps[i].rop=e.value; save(); closeSheet(); render(); }
function delDep(id){ sheet('<h3>Удалить отдел?</h3><span class="sh">записи останутся в отчётах</span><div class="sbtn"><button class="btn" onclick="closeSheet()">Отмена</button><button class="btn warn" onclick="doDelDep('+id+')">Удалить</button></div>'); }
function doDelDep(id){ state.deps=state.deps.filter(function(d){ return d.id!==id; }); save(); closeSheet(); render(); }
function logout(){ state.user=null; pickName=null; save(); render(); }
function sheet(h){ document.getElementById('sheet').innerHTML=h; document.getElementById('ovl').classList.add('on'); }
function closeSheet(){ document.getElementById('ovl').classList.remove('on'); }
function resetAll(){ sheet('<h3>Сбросить прототип?</h3><span class="sh">данные вернутся к исходным</span><div class="sbtn"><button class="btn" onclick="closeSheet()">Отмена</button><button class="btn pri" onclick="doReset()">Сбросить</button></div>'); }
function doReset(){ var u=state.user; state=seed(); state.user=u; save(); nav='today'; openD=null; closeSheet(); render(); }
render();
</script>
</body>
