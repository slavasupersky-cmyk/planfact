<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>ТОЧНО. — Кабинет агента</title>
<style>
:root{
  color-scheme:light;
  --ink:#101010; --ink-2:#5A5A5A; --mute:#757575;
  --line:#E6E6E6; --paper:#FFFFFF; --card:#FFFFFF;
  --surface:#FAFAFA; --surface-2:#F0F0F0;
  --lime:#AEEA00; --on-lime:#101010; --green:#0D7A46;
  --star:#8A6100; --red:#B3261E; --r:6px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.55}
button{font-family:inherit}
.app{max-width:560px;margin:0 auto;padding:14px 14px 150px}
.mono{font-family:ui-monospace,"SF Mono","Roboto Mono","Noto Sans Mono",Menlo,monospace}

.login{max-width:420px;margin:0 auto;padding:56px 18px}
.login .mark{font-size:26px;font-weight:600;letter-spacing:-.03em;margin-bottom:6px}
.login .mark i{font-style:normal;color:var(--lime)}
.login .sub{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:34px}
.login h2{font-size:21px;letter-spacing:-.03em;margin:0 0 16px}
.pick{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:7px;font-size:15px;color:var(--ink-2)}
.pick.on{border-color:var(--ink);border-width:2px;color:var(--ink);font-weight:600}
.note{font-size:13px;color:var(--mute);margin-top:12px;text-align:center}

.hdr{padding-bottom:12px;border-bottom:2px solid var(--ink);margin-bottom:14px}
.hdr .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mark{font-size:20px;font-weight:600;letter-spacing:-.03em;line-height:1}
.mark i{font-style:normal;color:var(--lime)}
.mark small{display:block;font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:400;margin-top:5px}
.who{text-align:right}
.who b{display:block;font-size:14px;font-weight:600}
.who span{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mute)}

.btn{width:100%;min-height:54px;border-radius:var(--r);padding:14px;font-size:15.5px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:9px}
.btn.pri{background:var(--lime);color:var(--on-lime);border-color:var(--lime)}
.btn.ghost{border-style:dashed;color:var(--mute);background:transparent}
.btn[disabled]{background:var(--surface-2);color:var(--mute);border-color:var(--surface-2)}
.btn+.btn{margin-top:8px}
.submit{margin-top:12px}
.status{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
.dm{width:9px;height:9px;border-radius:50%;flex:none}
.dm.ok{background:var(--green)} .dm.wait{background:var(--star)} .dm.no{background:var(--red)} .dm.none{background:var(--line)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:12px}
.card .t{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.grid button,.grid div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-height:58px;padding:9px 4px;text-align:center;color:inherit;width:100%}
.grid b{display:block;font-size:16px;font-weight:600;letter-spacing:-.03em}
.grid b.good{color:var(--green)}
.grid span{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.bar{height:6px;background:var(--surface-2);border-radius:var(--r);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--lime)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;color:var(--ink-2);padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv b{color:var(--ink);text-align:right;white-space:nowrap;font-weight:600}
.kv b.g{color:var(--green)} .kv b.r{color:var(--red)} .kv b.s{color:var(--star)}

.sec{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:18px 2px 8px}
.item{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;margin-bottom:8px;display:flex;gap:12px;align-items:center;color:inherit}
.item.done{background:var(--surface)}
.item.alert{border-color:var(--red)}
.item .ic{width:44px;height:44px;flex:none;border-radius:var(--r);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--green)}
.item .tx{flex:1;min-width:0}
.item .tp{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.item .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .rt{font-size:13px;font-weight:600;flex:none;text-align:right;max-width:40%}
.rt.ok{color:var(--green)} .rt.mv{color:var(--star)} .rt.no{color:var(--red)} .rt.wait{color:var(--mute);font-weight:400}
.hint{font-size:13.5px;color:var(--mute);margin:2px 4px 12px}
.yest{--card:#FAFAFA;--surface:#F3F3F3}
.yest .item{border-color:#DFDFDF}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);border-top:1px solid var(--line)}
.bottom .in{max-width:560px;margin:0 auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{background:none;border:0;color:var(--mute);font-size:11px;padding:6px 2px;width:100%}
.nav button b{display:flex;justify-content:center;margin-bottom:3px;font-weight:400}
.nav button.on{color:var(--ink);font-weight:600}
.nav button.on b{color:var(--green)}

.ovl{position:fixed;inset:0;background:rgba(16,16,16,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:flex-end;z-index:40}
.ovl.on{display:flex}
.sheet{background:var(--paper);width:calc(100% - 24px);max-width:536px;margin:0 auto 12px;border-radius:14px;padding:18px 16px 20px;max-height:88vh;min-height:58vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.18);display:flex;flex-direction:column}
.sheet h3{margin:0 0 3px;font-size:19px;letter-spacing:-.03em}
.sheet .grow{flex:1}
.sh{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:14px}
.wiz{position:fixed;inset:0;background:var(--paper);z-index:30;display:none;overflow-y:auto}
.wiz.on{display:block}
.wiz .in{max-width:560px;margin:0 auto;padding:16px 14px 200px}
.wtitle{font-size:22px;letter-spacing:-.03em;margin:0 0 4px;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:16px}
.steps div{height:4px;background:var(--surface-2);border-radius:var(--r)}
.steps div.on{background:var(--lime)}
.wizbar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
.wizbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch}
.wizbar .in.one{grid-template-columns:1fr}

.lbl{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:14px 2px 6px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.chips.three{grid-template-columns:repeat(3,1fr)}
.chip{background:var(--card);border:1px solid var(--line);border-radius:var(--r);min-height:52px;padding:10px 8px;font-size:14.5px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:7px;text-align:center;width:100%}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.chip.on.g{background:var(--lime);color:var(--on-lime);border-color:var(--lime)}
.chip.on.r{background:var(--red);color:#fff;border-color:var(--red)}
.chip.on.s{background:var(--star);color:#fff;border-color:var(--star)}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;font-size:16px;font-family:inherit;color:var(--ink)}
input[type=date],input[type=time]{padding:11px 12px;min-height:48px;-webkit-appearance:none;appearance:none}
textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;padding-top:18px;align-items:stretch}
.sbtn .btn{min-height:54px;margin:0}
.big{font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.big small{display:block;font-size:13.5px;font-weight:400;color:var(--ink-2);letter-spacing:0;margin-top:6px}
.foot{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute);text-align:center}
.foot button{background:none;border:0;color:var(--mute);font-family:ui-monospace,Menlo,monospace;font-size:11px;text-decoration:underline;padding:6px}
.party{background:var(--lime);color:var(--on-lime);border-radius:var(--r);padding:14px;text-align:center;font-weight:600;margin-bottom:12px}
</style>
</head>
<body>
<div id="root"></div>
<div class="ovl" id="ovl" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="wiz" id="wiz"><div class="in" id="wizin"></div><div class="wizbar"><div class="in" id="wizbar"></div></div></div>

<script>
/* ================= иконки ================= */
var IC={
list:'<rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M8 8h8M8 12h8M8 16h5"/>',

future:'<rect x="3" y="5" width="18" height="16" rx="1.5"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M9.5 15.5h5.5m-2-2.2 2.2 2.2-2.2 2.2"/>',
send:'<path d="M20.5 3.5 3.5 10.8l7 2.9 2.9 7z"/><path d="M20.5 3.5 10.5 13.7"/>',
pin:'<path d="M9 3h6l-1 5.2 3 2.8v2H7v-2l3-2.8z"/><path d="M12 13v8"/>',
ok:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',

week:'<rect x="3" y="4" width="18" height="17" rx="1.5"/><path d="M3 9h18M8 2v4M16 2v4M7 13h4M7 17h8"/>',
phone:'<path d="M5 4h3.5l1.8 4.5-2.3 1.4a12 12 0 0 0 5.1 5.1l1.4-2.3L19 14.5V18a1.5 1.5 0 0 1-1.7 1.5A15.5 15.5 0 0 1 3.5 5.7 1.5 1.5 0 0 1 5 4z"/>'
};
function ic(n,s){ s=s||26; return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block">'+(IC[n]||'')+'</svg>'; }

/* ================= хранилище ================= */
var KEY='topf-agent-v21', mem=null;
function save(){ var s=JSON.stringify(state); try{ localStorage.setItem(KEY,s);}catch(e){ mem=s; } }
function load(){ var s=null; try{ s=localStorage.getItem(KEY);}catch(e){ s=mem; } if(!s)s=mem;
  if(!s) return null; try{ return JSON.parse(s);}catch(e){ return null; } }

/* ================= классы ================= */
var STAFF=['Брыкина Александра','Кастромина Ольга','Кондратьева Ирина','Розанова Мария','Смирнова Анна'];
/* cl: сторона клиента · sides: чьи причины показываем · free: причины текстом */
var TYPES=[
 {k:'pokaz', n:'Показ',   ic:'home',   cl:'buyer',  sides:'both'},
 {k:'ocenka',n:'Оценка',  ic:'search', cl:'seller', sides:'seller'},
 {k:'vstr',  n:'Встреча', ic:'meet',   cl:'buyer',  sides:'both'},
 {k:'rekl',  n:'Реклама', ic:'screen', cl:'seller', sides:'free'},
 {k:'pd',    n:'Задаток', ic:'money',  cl:'any',    sides:'both', money:true},
 {k:'sdelka',n:'Сделка',  ic:'deal',   cl:'any',    sides:'both', dayoff:true}
];
var NORMKEYS=[{k:'pd',l:'задаток'},{k:'sdelka',l:'сделки'},{k:'pokaz',l:'показы'},
              {k:'ocenka',l:'оценки'},{k:'vstr',l:'встречи'},{k:'rekl',l:'реклама'},{k:'leads',l:'заявки'}];
var MOVE={buyer:[{k:'buyer_move',n:'Покупатель перенёс'},{k:'buyer_nc',n:'Покупатель не на связи'}],
          seller:[{k:'seller_move',n:'Продавец перенёс'},{k:'seller_nc',n:'Продавец не на связи'}]};
var REF={buyer:[{k:'buyer_ref',n:'Покупатель отказался'}],
         seller:[{k:'seller_ref',n:'Продавец отказал'}]};
function reasons(t,kind){
  var src=(kind==='move'?MOVE:REF), out=[];
  if(t.sides==='both'||t.sides==='buyer') out=out.concat(src.buyer);
  if(t.sides==='both'||t.sides==='seller') out=out.concat(src.seller);
  out.push({k:'other',n:'Другое'});
  return out;
}
function rname(k){
  var all=MOVE.buyer.concat(MOVE.seller,REF.buyer,REF.seller);
  for(var i=0;i<all.length;i++) if(all[i].k===k) return all[i].n;
  return k==='other'?'Другое':k;
}
function T(k){ for(var i=0;i<TYPES.length;i++) if(TYPES[i].k===k) return TYPES[i]; return TYPES[0]; }

/* ================= даты ================= */
function iso(d){ return d.toISOString().slice(0,10); }
function plus(n){ return iso(new Date(Date.now()+n*864e5)); }
var MN=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
var MNF=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var WD=['вс','пн','вт','ср','чт','пт','сб'];
function ru(d){ var p=String(d).split('-'); return parseInt(p[2],10)+' '+MN[parseInt(p[1],10)-1]; }
function rud(d){ var dt=new Date(d+'T00:00:00'); return WD[dt.getDay()]+', '+ru(d); }
function weekStart(){ var d=new Date(), day=(d.getDay()+6)%7; return plus(-day); }
function weekEnd(){ var d=new Date(), day=(d.getDay()+6)%7; return plus(6-day); }
function monthStart(){ var d=new Date(); return iso(new Date(d.getFullYear(),d.getMonth(),2)).slice(0,8)+'01'; }
function monthEnd(){ var d=new Date(); return iso(new Date(d.getFullYear(),d.getMonth()+1,1)); }
function monthName(){ var d=new Date(); return MNF[d.getMonth()]; }
function monthNom(){ var d=new Date(); return ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'][d.getMonth()]; }
function money(n){ return Number(n||0).toLocaleString('ru-RU')+' ₽'; }
function esc(s){ return String(s==null?'':s).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); }

/* ================= данные ================= */
function history(){
  var ws=weekStart(), out=[], id=50;
  var tpl=[{type:'pokaz',obj:'Мира 6',cl:'Сомова',clt:'buyer',back:1},
           {type:'pokaz',obj:'Попова 72',cl:'Сомова',clt:'buyer',back:2},
           {type:'ocenka',obj:'Ладожская 146',cl:'Титов',clt:'seller',back:2},
           {type:'rekl',obj:'Мира 42',cl:'Титов',clt:'seller',back:1},
           {type:'vstr',obj:'Офис',cl:'Пётр',clt:'buyer',back:3},
           {type:'pokaz',obj:'Тепличная 4',cl:'Маргарита',clt:'buyer',back:3}];
  for(var i=0;i<tpl.length;i++){ var dt=plus(-tpl[i].back);
    if(dt<ws) continue;
    out.push({id:id++,type:tpl[i].type,obj:tpl[i].obj,cl:tpl[i].cl,clt:tpl[i].clt,date:dt,time:'',status:'done'});
  }
  return out;
}

      {id:16,type:'sdelka',obj:'Норвуд',        cl:'Юлия',     clt:'buyer', date:t,time:'14:00',status:null},
      /* будущее · раскидано по дням */
      {id:21,type:'pokaz', obj:'Строителей 68а',cl:'Пётр',     clt:'buyer', date:plus(1),time:'11:00',status:null},
      {id:22,type:'ocenka',obj:'Мира 42',       cl:'Титов',    clt:'seller',date:plus(1),time:'15:00',status:null},
      {id:23,type:'pd',    obj:'Тепличная 4',   cl:'Маргарита',clt:'buyer', date:plus(2),time:'15:00',sum:105000,status:null},

/* ================= нормы ================= */
function normM(k){ return state.monthNorm[k]||0; }
function normW(k){ return Math.ceil(normM(k)/4.33); }

/* ================= выборки ================= */
function byDate(d){ var o=[]; for(var i=0;i<state.tasks.length;i++) if(state.tasks[i].date===d) o.push(state.tasks[i]); return o; }
function task(id){ for(var i=0;i<state.tasks.length;i++) if(state.tasks[i].id===id) return state.tasks[i]; return null; }
function futureTasks(){ var o=[]; for(var i=0;i<state.tasks.length;i++) if(state.tasks[i].date>state.date) o.push(state.tasks[i]);
  o.sort(function(a,b){ return a.date<b.date?-1:1; }); return o; }
function yestLeft(){ var n=0,y=byDate(state.dateY); for(var i=0;i<y.length;i++) if(!y[i].status) n++; return n; }
function inRange(d,a,b){ return d>=a&&d<=b; }
function doneIn(k,a,b){
  var n=0; for(var i=0;i<state.tasks.length;i++){ var t=state.tasks[i];
    if(t.type===k&&t.status==='done'&&inRange(t.date,a,b)) n++; }
  return n;
}
function leadsIn(a,b){
  var n=0; for(var i=0;i<state.leads.length;i++) if(inRange(state.leads[i].date,a,b)) n+=state.leads[i].n;
  if(state.leadsY!==null&&inRange(state.dateY,a,b)) n+=state.leadsY;
  return n;
}
function cntW(k){ return k==='leads'? leadsIn(weekStart(),state.date) : doneIn(k,weekStart(),state.date); }
function cntM(k){ return k==='leads'? leadsIn(monthStart(),state.date) : doneIn(k,monthStart(),state.date); }
function listW(k,doneOnly){
  var o=[]; for(var i=0;i<state.tasks.length;i++){ var t=state.tasks[i];
    if(t.type!==k) continue;
    if(doneOnly){ if(t.status==='done'&&inRange(t.date,weekStart(),state.date)) o.push(t); }
    else if(!t.status&&t.date>=state.date) o.push(t);
  }
  o.sort(function(a,b){ return a.date<b.date?-1:1; }); return o;
}

/* ================= прогноз ================= */
function fcRange(mode){
  if(mode==='week') return [weekStart(),weekEnd()];
  if(mode==='month') return [monthStart(),monthEnd()];
  return [monthEnd(),'9999-12-31'];
}
function fcItems(mode){
  var r=fcRange(mode), o=[];
  for(var i=0;i<state.tasks.length;i++){ var t=state.tasks[i];
    if(t.type!=='pd'||t.status==='refuse') continue;
    if(mode==='future'? t.date>r[0] : inRange(t.date,r[0],r[1])) o.push(t);
  }
  o.sort(function(a,b){ return a.date<b.date?-1:1; }); return o;
}
function fcStat(mode){
  var it=fcItems(mode), pn=it.length, ps=0, fn=0, fs=0;
  for(var i=0;i<it.length;i++){ ps+=Number(it[i].sum||0);
    if(it[i].status==='done'){ fn++; fs+=Number(it[i].sum||0); } }
  return {n:pn,s:ps,fn:fn,fs:fs,items:it};
}

       '<b class="'+(d>=n?'g':'')+'">'+d+' / '+n+' · '+Math.round(d/n*100)+'%</b></div>';
  }
  h+='</div>';
  h+='<div class="hint">Норма недели считается из месячной: месячная ÷ 4,33 с округлением вверх. Поэтому сумма недельных чуть больше месячной — так задумано.</div>';
  h+='<div class="card"><div class="t">Кабинет</div>'+
     '<div class="kv"><span>Сотрудник</span><b>'+esc(state.user)+'</b></div>'+
     '<div class="kv"><span>Отдел</span><b>№2</b></div></div>'+
     '<button class="btn ghost" onclick="logout()">Выйти из кабинета</button>';
  return h;
}
function logout(){ state.user=null; pickName=null; save(); render(); }

function miniRow(t,right){

/* ================= отметка дела ================= */
var cur=null,cSt=null,cRs=null,cDeal=false;
function openTask(id){
  cur=task(id); if(!cur) return;
  if(cur.status==='moved'||cur.status==='refuse'||(cur.status==='done'&&cur.date<state.dateY)) return viewTask();
  if(cur.date>state.date) return openAdd(cur.date,false,cur.id);
  cSt=cur.status||null; cRs=cur.reason||null; cDeal=false; drawTask();
}
function viewTask(){
  var t=T(cur.type);
  sheet('<h3>'+t.n+' · '+esc(cur.obj||'без адреса')+'</h3><div class="sh">'+rud(cur.date)+'</div>'+
    '<div class="card"><div class="kv"><span>Статус</span><b>'+({done:'сделано',refuse:'отказ',moved:'перенесено'}[cur.status])+'</b></div>'+
    (cur.reason?'<div class="kv"><span>Причина</span><b>'+esc(rname(cur.reason))+'</b></div>':'')+
    (cur.why?'<div class="kv"><span>Пояснение</span><b>'+esc(cur.why)+'</b></div>':'')+
    (cur.res?'<div class="kv"><span>Результат</span><b>'+esc(cur.res)+'</b></div>':'')+'</div>'+
    '<div class="sbtn"><button class="btn" onclick="closeSheet()">Закрыть</button><button class="btn pri" onclick="closeSheet()">Понятно</button></div>');
}
function drawTask(){
  var t=T(cur.type);
  var h='<h3>'+t.n+' · '+esc(cur.obj||'без адреса')+'</h3><div class="sh">'+rud(cur.date)+(cur.time?' · '+cur.time:'')+'</div>'+
    '<div class="lbl">Что вышло</div><div class="chips three">'+
    sb('done','Сделано','g')+sb('move','Перенос','s')+sb('refuse','Отказ','r')+'</div>';

  if(cSt==='done'){
    if(t.money) h+='<div class="lbl">Подтвердите сумму · обязательно</div><input type="number" inputmode="numeric" id="fSum" value="'+(cur.sum||'')+'" placeholder="105000">';
    h+='<div class="lbl">Результат</div><textarea id="fRes"'+(t.k==='ocenka'?'':' placeholder="Что решили"')+'>'+esc(cur.res)+'</textarea>';
    if(t.k==='pd'){
      h+='<div class="lbl">Сделка</div><div class="chips">'+
         '<button class="chip'+(cDeal?' on g':'')+'" onclick="grabTask();cDeal=true;drawTask()">Назначить</button>'+
         '<button class="chip'+(!cDeal?' on':'')+'" onclick="grabTask();cDeal=false;drawTask()">Пока нет</button></div>';
      if(cDeal) h+='<div class="lbl">Дата сделки</div><input type="date" id="fDeal" value="'+(cur.dealDate||plus(14))+'" min="'+state.date+'">';
    }
    if(t.k==='sdelka') h+='<div class="party">Сделка закрыта. Отличный день.</div>';
  }
  if(cSt==='move'){
    h+='<div class="lbl">Перенесено на · обязательно</div><input type="date" id="fDate" value="'+(cur.moveTo||plus(1))+'" min="'+state.date+'">';
    h+=reasonBlock(t,'move');
  }
  if(cSt==='refuse') h+=reasonBlock(t,'refuse');

  h+='<div class="sbtn"><button class="btn" onclick="closeSheet()">Отмена</button>'+
     '<button class="btn pri" onclick="saveTask()"'+(cSt?'':' disabled')+'>Сохранить</button></div>'+
     '<button class="btn ghost" style="margin-top:8px" onclick="openAdd(cur.date,cur.star,cur.id)">Изменить объект и клиента</button>';
  sheet(h);
}
function reasonBlock(t,kind){
  if(t.sides==='free')
    return '<div class="lbl">Причина · обязательно</div><textarea id="fWhy" placeholder="Опишите, что произошло">'+esc(cur.why)+'</textarea>';
  var rs=reasons(t,kind), h='<div class="lbl">Причина</div><div class="chips">';
  for(var i=0;i<rs.length;i++)
    h+='<button class="chip'+(cRs===rs[i].k?' on':'')+'" onclick="grabTask();cRs=\''+rs[i].k+'\';drawTask()">'+rs[i].n+'</button>';
  h+='</div>';
  if(cRs==='other'||kind==='refuse')
    h+='<div class="lbl">'+(kind==='refuse'?'Описать почему · обязательно':'Пояснить · обязательно')+
       '</div><textarea id="fWhy" placeholder="Что произошло">'+esc(cur.why)+'</textarea>';
  return h;
}
function sb(k,l,c){ return '<button class="chip'+(cSt===k?' on '+c:'')+'" onclick="grabTask();cSt=\''+k+'\';cRs=null;drawTask()">'+l+'</button>'; }
function grabTask(){
  var g=function(id){ var e=document.getElementById(id); return e?e.value:null; },v;
  if((v=g('fRes'))!==null) cur.res=v;
  if((v=g('fWhy'))!==null) cur.why=v;
  if((v=g('fSum'))!==null&&v) cur.sum=Number(v);
}
function saveTask(){
  grabTask();
  var t=T(cur.type);
  if(cSt==='done'&&t.money&&!cur.sum){ alert('Подтвердите сумму комиссии'); return; }
  if(cSt==='move'){
    var d=document.getElementById('fDate');
    if(!d||!d.value){ alert('Укажите новую дату'); return; }
    if(t.sides==='free'&&!cur.why){ alert('Опишите причину переноса'); return; }
    if(t.sides!=='free'&&!cRs){ alert('Выберите причину'); return; }
    if(cRs==='other'&&!cur.why){ alert('Поясните причину'); return; }
    var copy={id:++state.seq,type:cur.type,obj:cur.obj,cl:cur.cl,clt:cur.clt,date:d.value,time:cur.time,sum:cur.sum,status:null};
    state.tasks.push(copy);
    cur.status='moved'; cur.reason=cRs; cur.moveTo=d.value;
  } else if(cSt==='refuse'){
    if(t.sides==='free'&&!cur.why){ alert('Опишите причину отказа'); return; }
    if(t.sides!=='free'&&!cRs){ alert('Выберите причину'); return; }
    if(!cur.why){ alert('Опишите, почему отказ'); return; }
    cur.status='refuse'; cur.reason=cRs;
    if(t.money) cur.sum=0;
  } else {
    cur.status='done'; cur.reason=null;
    if(t.k==='pd'&&cDeal){
      var dd=document.getElementById('fDeal');
      cur.dealDate=dd?dd.value:plus(14);
      state.tasks.push({id:++state.seq,type:'sdelka',obj:cur.obj,cl:cur.cl,clt:cur.clt,date:cur.dealDate,time:'',status:null,fromPd:cur.id});
    }
  }
  save(); closeSheet(); afterChange();
}

/* ================= задача от РОПа ================= */
var curRop=null;
function openRop(id){
  for(var i=0;i<state.ropTasks.length;i++) if(state.ropTasks[i].id===id) curRop=state.ropTasks[i];
  if(!curRop) return;
  sheet('<h3>Задача от РОПа</h3><div class="sh">'+ru(curRop.date)+'</div>'+
    '<div class="card"><div style="font-size:15px">'+esc(curRop.text)+'</div></div>'+
    '<div class="lbl">Выполнено?</div><div class="chips">'+
    '<button class="chip'+(curRop.done===true?' on g':'')+'" onclick="setRop(true)">Да</button>'+
    '<button class="chip'+(curRop.done===false?' on r':'')+'" onclick="setRop(false)">Нет</button></div>'+
    (curRop.done===false?'<div class="lbl">Почему не сделано · обязательно</div><textarea id="rWhy" placeholder="Не дозвонился собственнику">'+esc(curRop.why)+'</textarea>':'')+
    '<div class="sbtn"><button class="btn" onclick="closeSheet()">Закрыть</button><button class="btn pri" onclick="saveRop()">Сохранить</button></div>');

function setRop(v){ curRop.done=v; openRop(curRop.id); }
function saveRop(){
  if(curRop.done===null){ alert('Отметьте да или нет'); return; }
  var w=document.getElementById('rWhy');
  if(curRop.done===false&&(!w||!w.value)){ alert('Напишите, почему не сделано'); return; }
  if(w) curRop.why=w.value;
  save(); closeSheet(); afterChange();
}

/* ================= добавление дела ================= */
var frm={};
function openAdd(date,star,editId,type){
  frm={id:editId||0,type:type||'pokaz',obj:'',cl:'',clt:'',date:date||state.date,time:'',sum:'',star:!!star,vague:false};
  if(editId){ var t=task(editId); if(t) frm={id:t.id,type:t.type,obj:t.obj,cl:t.cl,clt:t.clt,date:t.date,time:t.time,sum:t.sum||'',star:!!t.star,vague:!!t.vague}; }
  fixClt(); drawAdd();
}
function openVague(){ frm={id:0,type:'pokaz',obj:'',cl:'',clt:'',date:state.date,time:'',sum:'',star:false,vague:true}; fixClt(); drawAdd(); }
function fixClt(){ var t=T(frm.type); if(t.cl!=='any') frm.clt=t.cl; }
function drawAdd(){
  var t=T(frm.type);
  var h='<h3>'+(frm.id?'Дело':(frm.vague?'Назначить новое':(frm.star?'Дело вне плана':'Новое дело')))+'</h3>'+
    '<div class="sh">'+(frm.vague?'без адреса и клиента':rud(frm.date))+'</div>'+
    '<div class="lbl">Класс</div><div class="chips three">';
  for(var i=0;i<TYPES.length;i++)
    h+='<button class="chip'+(frm.type===TYPES[i].k?' on':'')+'" onclick="grabAdd();frm.type=\''+TYPES[i].k+'\';fixClt();drawAdd()">'+TYPES[i].n+'</button>';
  h+='</div><div class="row2"><div><div class="lbl">Дата</div><input type="date" id="aDate" value="'+frm.date+'"></div>'+
     '<div><div class="lbl">Время</div><input type="time" id="aTime" value="'+(frm.time||'')+'"></div></div>';
  if(!frm.vague){
    h+='<div class="lbl">Объект · адрес</div><input id="aObj" value="'+esc(frm.obj)+'" placeholder="Строителей 11">'+
       '<div class="lbl">Клиент · имя без фамилии</div><input id="aCl" value="'+esc(frm.cl)+'" placeholder="Кондрева">'+
       '<div class="lbl">Тип клиента</div><div class="chips">';
    if(t.cl==='any'){
      h+='<button class="chip'+(frm.clt==='buyer'?' on':'')+'" onclick="grabAdd();frm.clt=\'buyer\';drawAdd()">Покупатель</button>'+
         '<button class="chip'+(frm.clt==='seller'?' on':'')+'" onclick="grabAdd();frm.clt=\'seller\';drawAdd()">Продавец</button>';
    } else {
      h+='<button class="chip on" style="grid-column:1/-1">'+(t.cl==='buyer'?'Покупатель':'Продавец')+' · по классу</button>';
    }
    h+='</div>';
  }
  if(t.money) h+='<div class="lbl">Сумма комиссии ₽ · обязательно</div><input type="number" inputmode="numeric" id="aSum" value="'+(frm.sum||'')+'" placeholder="105000">';
  if(t.dayoff) h+='<div class="hint" style="margin-top:12px">Сделка занимает день целиком — в этот день другие дела не планируются.</div>';
  h+='<div class="sbtn"><button class="btn" onclick="closeSheet()">Отмена</button><button class="btn pri" onclick="saveAdd(0)">Сохранить</button></div>';
  if(!frm.id&&!frm.vague&&frm.type==='pokaz') h+='<button class="btn ghost" style="margin-top:8px" onclick="saveAdd(1)">Сохранить и ещё показ этому же клиенту</button>';
  if(frm.id) h+='<button class="btn ghost" style="margin-top:8px" onclick="delTask()">Удалить дело</button>';
  sheet(h);
  setTimeout(function(){ var o=document.getElementById('aObj'); if(o&&!frm.obj) o.focus(); },60);
}
function grabAdd(){
  var g=function(id){ var e=document.getElementById(id); return e?e.value:null; },v;
  if((v=g('aObj'))!==null) frm.obj=v;
  if((v=g('aCl'))!==null) frm.cl=v;
  if((v=g('aTime'))!==null) frm.time=v;
  if((v=g('aSum'))!==null) frm.sum=v;
  if((v=g('aDate'))!==null) frm.date=v;
}
function saveAdd(again){
  grabAdd(); fixClt();
  var t=T(frm.type);
  if(!frm.vague&&!frm.obj){ alert('Укажите адрес объекта'); return; }
  if(!frm.vague&&t.cl==='any'&&!frm.clt){ alert('Выберите: покупатель или продавец'); return; }
  if(t.money&&!frm.vague&&!frm.sum){ alert('Для задатка сумма комиссии обязательна'); return; }
  if(frm.id){
    var e=task(frm.id);
    e.type=frm.type; e.obj=frm.obj; e.cl=frm.cl; e.clt=frm.clt; e.date=frm.date; e.time=frm.time;
    if(frm.sum) e.sum=Number(frm.sum);
  } else {
    var it={id:++state.seq,type:frm.type,obj:frm.obj,cl:frm.cl,clt:frm.clt,date:frm.date,time:frm.time,status:null};
    if(frm.sum) it.sum=Number(frm.sum);
    if(frm.star){ it.star=true; it.status='done'; }
    if(frm.vague){ it.vague=true; it.obj=''; it.cl=''; }
    state.tasks.push(it);
  }
  save();
  if(again){ frm={id:0,type:'pokaz',obj:'',cl:frm.cl,clt:frm.clt,date:frm.date,time:'',sum:'',star:frm.star,vague:false}; drawAdd(); return; }
  closeSheet(); afterChange();
}
function delTask(){
  var n=[]; for(var i=0;i<state.tasks.length;i++) if(state.tasks[i].id!==frm.id) n.push(state.tasks[i]);
  state.tasks=n; save(); closeSheet(); afterChange();
}

/* ================= мастер сдачи ================= */
var step=0, wLeads='';
function openWiz(){ step=0; wLeads=(state.leadsY===null?'':String(state.leadsY)); drawWiz(); document.getElementById('wiz').classList.add('on'); }
function closeWiz(){ document.getElementById('wiz').classList.remove('on'); render(); }
function afterChange(){ if(document.getElementById('wiz').classList.contains('on')) drawWiz(); else render(); }
function drawWiz(){
  var h='<div class="steps">'+[0,1,2,3].map(function(i){ return '<div class="'+(i<=step?'on':'')+'"></div>'; }).join('')+'</div>', bar='', one=false;
  if(step===0){
    var y=byDate(state.dateY), left=yestLeft();
    h+='<div class="wtitle">Факт за вчера</div><div class="sh">'+rud(state.dateY)+'</div>'+
       '<button class="btn" style="margin-bottom:12px" onclick="openAdd(state.dateY,true)">+ Что было вне плана</button>';
    for(var i=0;i<y.length;i++) h+=itemHTML(y[i],'day');
    if(left) h+='<div class="hint" style="color:var(--red)">Не отмечено дел: '+left+'. Без этого сдать нельзя.</div>';
    bar='<button class="btn" onclick="closeWiz()">Закрыть</button><button class="btn pri" onclick="wizNext()">Дальше</button>';
  }
  if(step===1){
    h+='<div class="wtitle">Заявки за вчера</div><div class="sh">сколько новых пришло</div>'+
       '<div class="card"><div class="kv"><span>Норма недели</span><b>'+normW('leads')+'</b></div>'+
       '<div class="kv"><span>Уже за неделю</span><b>'+cntW('leads')+'</b></div></div>'+
       '<div class="lbl">Новых заявок</div><input type="number" inputmode="numeric" id="wLeads" value="'+wLeads+'" placeholder="0">'+
       '<div class="hint">Это входящий поток, а не ваша работа. Цифра нужна, чтобы считать, сколько заявок дошло до показа.</div>';
    bar='<button class="btn" onclick="wizBack()">Назад</button><button class="btn pri" onclick="wizNext()">Дальше</button>';
  }
  if(step===2){
    var t=byDate(state.date);
    h+='<div class="wtitle">План на сегодня</div><div class="sh">'+rud(state.date)+'</div>';
    for(var j=0;j<t.length;j++) h+=itemHTML(t[j],'fut');
    h+='<button class="btn" onclick="openAdd(state.date)">+ Добавить дело</button>'+
       '<button class="btn ghost" onclick="openVague()">Назначить новое · без адреса</button>';
    if(!t.length) h+='<div class="hint" style="color:var(--red)">План пустой. Добавьте хотя бы одно дело.</div>';
    bar='<button class="btn" onclick="wizBack()">Назад</button><button class="btn pri" onclick="wizNext()">Дальше</button>';
  }
  if(step===3){
    var s=fcStat('week'), sm=fcStat('month');
    h+='<div class="wtitle">Прогноз</div><div class="sh">задатки на неделю и месяц</div>'+
       '<div class="card"><div class="kv"><span>Неделя</span><b>'+money(s.s)+' · '+s.n+'</b></div>'+
       '<div class="kv"><span>Месяц</span><b>'+money(sm.s)+' · '+sm.n+'</b></div></div>';
    for(var w=0;w<s.items.length;w++){ var f=s.items[w];
      h+='<button class="item" onclick="openTask('+f.id+')"><div class="ic">'+ic('money')+'</div><div class="tx">'+
         '<div class="tp">'+ru(f.date)+'</div><div class="nm">'+esc(f.obj)+'</div><div class="sub">'+esc(f.cl)+'</div></div>'+
         '<span class="rt ok">'+money(f.sum)+'</span></button>';
    }
    if(!s.items.length) h+='<div class="hint">На этой неделе задатков не запланировано.</div>';
    h+='<button class="btn" onclick="openAdd(state.date,false,0,\'pd\')">+ Добавить задаток</button>'+
       '<div class="hint">Подтвердите прогноз или добавьте объекты. В понедельник прогноз обязателен.</div>';
    bar='<button class="btn" onclick="wizBack()">Назад</button><button class="btn pri" onclick="wizDone()">Сдать</button>';
  }
  document.getElementById('wizin').innerHTML=h;
  document.getElementById('wizbar').innerHTML=bar;
  document.getElementById('wizbar').className='in'+(one?' one':'');
}
function wizBack(){ if(step===1){ var e=document.getElementById('wLeads'); if(e) wLeads=e.value; } step--; drawWiz(); }
function wizNext(){
  if(step===0&&yestLeft()){ alert('Отметьте все вчерашние дела'); return; }
  if(step===1){ var e=document.getElementById('wLeads');
    if(!e||e.value===''){ alert('Укажите количество заявок'); return; } wLeads=e.value; }
  if(step===2&&!byDate(state.date).length){ alert('План на сегодня пустой'); return; }
  step++; drawWiz();
}
function wizDone(){
  state.leadsY=Number(wLeads||0);
  var d=new Date();
  state.today={sent:true,status:'sent',at:('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)};
  var y=byDate(state.dateY), f=0;
  for(var i=0;i<y.length;i++) if(y[i].status==='done') f++;
  state.reports.unshift({date:state.dateY,label:'Вчера · сдан только что',kind:'day',status:'sent',plan:y.length,fact:f,leads:state.leadsY});
  save(); closeWiz(); nav='today'; render();
}

/* ================= общее ================= */
function sheet(h){ document.getElementById('sheet').innerHTML=h; document.getElementById('ovl').classList.add('on'); }
function closeSheet(){ document.getElementById('ovl').classList.remove('on'); }
function resetAll(){
  sheet('<h3>Сбросить прототип?</h3><div class="sh">данные вернутся к исходным</div>'+
    '<div class="hint">Все отметки, добавленные дела и сданные отчёты будут стёрты.</div>'+
    '<div class="sbtn"><button class="btn" onclick="closeSheet()">Отмена</button>'+
    '<button class="btn pri" onclick="doReset()">Сбросить</button></div>');
}
function doReset(){ var u=state.user; state=seed(); state.user=u; save(); nav='today'; closeSheet(); render(); }
render();
