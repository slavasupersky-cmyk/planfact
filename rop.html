<title>ТОЧНО. — Кабинет РОПа</title>
<style>
:root{
  color-scheme:light;
  --ink:#101010; --ink-2:#5A5A5A; --mute:#757575;
  --line:#E6E6E6; --paper:#FFFFFF; --card:#FFFFFF;
  --surface:#FAFAFA; --surface-2:#F0F0F0;
  --lime:#AEEA00; --on-lime:#101010; --green:#0D7A46;
  --star:#8A6100; --red:#B3261E; --r:6px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.55}
button{font-family:inherit}
.app{max-width:560px;margin:0 auto;padding:14px 14px 150px}

.login{max-width:420px;margin:0 auto;padding:56px 18px}
.login .mark{font-size:26px;font-weight:600;letter-spacing:-.03em;margin-bottom:6px}
.login .mark i{font-style:normal;color:var(--lime)}
.login .sub{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:34px}
.login h2{font-size:21px;letter-spacing:-.03em;margin:0 0 16px}
.pick{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:7px;font-size:15px;color:var(--ink-2)}
.pick.on{border-color:var(--ink);border-width:2px;color:var(--ink);font-weight:600}
.note{font-size:13px;color:var(--mute);margin-top:12px;text-align:center}

.hdr{padding-bottom:12px;border-bottom:2px solid var(--ink);margin-bottom:14px}
.hdr .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mark{font-size:20px;font-weight:600;letter-spacing:-.03em;line-height:1}
.mark i{font-style:normal;color:var(--lime)}
.mark small{display:block;font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:400;margin-top:5px}
.who{text-align:right}
.who b{display:block;font-size:14px;font-weight:600}
.who span{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mute)}

.btn{width:100%;min-height:54px;border-radius:var(--r);padding:14px;font-size:15.5px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:9px}
.btn.pri{background:var(--lime);color:var(--on-lime);border-color:var(--lime)}
.btn.ghost{border-style:dashed;color:var(--mute);background:transparent}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn[disabled]{background:var(--surface-2);color:var(--mute);border-color:var(--surface-2)}
.btn+.btn{margin-top:8px}
.status{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
.dm{width:9px;height:9px;border-radius:50%;flex:none}
.dm.ok{background:var(--green)} .dm.wait{background:var(--star)} .dm.no{background:var(--red)} .dm.none{background:var(--line)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:12px}
.card .t{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.grid button,.grid div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-height:58px;padding:9px 4px;text-align:center;color:inherit;width:100%}
.grid b{display:block;font-size:16px;font-weight:600;letter-spacing:-.03em}
.grid b.good{color:var(--green)} .grid b.bad{color:var(--red)}
.grid span{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.bar{height:6px;background:var(--surface-2);border-radius:var(--r);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--lime)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;color:var(--ink-2);padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv b{color:var(--ink);text-align:right;white-space:nowrap;font-weight:600}
.kv b.g{color:var(--green)} .kv b.r{color:var(--red)} .kv b.s{color:var(--star)}

.sec{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:18px 2px 8px}
.sec.warn{color:var(--red)}
.item{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;margin-bottom:8px;display:flex;gap:12px;align-items:center;color:inherit}
.item.done{background:var(--surface)}
.item.alert{border-color:var(--red)}
.item .ic{width:44px;height:44px;flex:none;border-radius:var(--r);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--green);font-size:14px;font-weight:600}
.item .tx{flex:1;min-width:0}
.item .tp{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.item .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .rt{font-size:13px;font-weight:600;flex:none;text-align:right;max-width:42%}
.rt.ok{color:var(--green)} .rt.mv{color:var(--star)} .rt.no{color:var(--red)} .rt.wait{color:var(--mute);font-weight:400}
.hint{font-size:13.5px;color:var(--mute);margin:2px 4px 12px}
.back{background:none;border:0;color:var(--mute);font-size:14.5px;padding:4px 0 10px;font-weight:600}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);border-top:1px solid var(--line)}
.bottom .in{max-width:560px;margin:0 auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{background:none;border:0;color:var(--mute);font-size:11px;padding:6px 2px;width:100%}
.nav button b{display:flex;justify-content:center;margin-bottom:3px;font-weight:400}
.nav button.on{color:var(--ink);font-weight:600}
.nav button.on b{color:var(--green)}

.ovl{position:fixed;inset:0;background:rgba(16,16,16,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:flex-end;z-index:40}
.ovl.on{display:flex}
.sheet{background:var(--paper);width:calc(100% - 24px);max-width:536px;margin:0 auto 12px;border-radius:14px;padding:18px 16px 20px;max-height:88vh;min-height:52vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.18);display:flex;flex-direction:column}
.sheet h3{margin:0 0 3px;font-size:19px;letter-spacing:-.03em}
.sh{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:14px}
.lbl{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:14px 2px 6px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.chips.three{grid-template-columns:repeat(3,1fr)}
.chip{background:var(--card);border:1px solid var(--line);border-radius:var(--r);min-height:52px;padding:10px 8px;font-size:14.5px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;text-align:center;width:100%}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.chip.on.g{background:var(--lime);color:var(--on-lime);border-color:var(--lime)}
.chip.on.r{background:var(--red);color:#fff;border-color:var(--red)}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;font-size:16px;font-family:inherit;color:var(--ink)}
input[type=date]{padding:11px 12px;min-height:48px;-webkit-appearance:none;appearance:none}
textarea{min-height:70px;resize:vertical}
.sbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;padding-top:18px;align-items:stretch}
.sbtn .btn{min-height:54px;margin:0}
.big{font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.big small{display:block;font-size:13.5px;font-weight:400;color:var(--ink-2);letter-spacing:0;margin-top:6px}
.foot{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute);text-align:center}
.foot button{background:none;border:0;color:var(--mute);font-family:ui-monospace,Menlo,monospace;font-size:11px;text-decoration:underline;padding:6px}
</style>
</head>

function normM(k){ return state.norm[k]||0; }
function normW(k){ return Math.ceil(normM(k)/4.33); }
function agent(id){ for(var i=0;i<state.agents.length;i++) if(state.agents[i].id===id) return state.agents[i]; return null; }
function sumBy(f){ var n=0; for(var i=0;i<state.agents.length;i++) n+=f(state.agents[i]); return n; }
function teamWeek(k){ return sumBy(function(a){ return a.week[k]||0; }); }
function teamMonth(k){ return sumBy(function(a){ return a.month[k]||0; }); }
function teamNormW(k){ return normW(k)*state.agents.length; }
function teamNormM(k){ return normM(k)*state.agents.length; }
function sentCount(){ return sumBy(function(a){ return a.sent?1:0; }); }
function acceptedCount(){ return sumBy(function(a){ return a.status?1:0; }); }
function refusalsAll(){
  var o=[]; for(var i=0;i<state.agents.length;i++){ var a=state.agents[i];
    for(var j=0;j<a.refusals.length;j++) o.push({who:a.name,id:a.id,r:a.refusals[j]}); }
  return o;
}
function fcAll(mode){
  var o=[], we=weekEnd();
  for(var i=0;i<state.agents.length;i++){ var a=state.agents[i];
    for(var j=0;j<a.fc.length;j++){ var f=a.fc[j];
      if(mode==='week'? f.date<=we : (mode==='month'? f.date<=plus(30) : f.date>plus(30))) o.push({who:a.name,id:a.id,f:f}); } }
  o.sort(function(x,y){ return x.f.date<y.f.date?-1:1; }); return o;
}

/* ================= рендер ================= */
var nav='inbox', openA=null, pickName=null, fcMode='week', normMode='week';
function render(){
  try{ draw(); }catch(e){
    document.getElementById('root').innerHTML='<div class="app"><div class="card"><div class="t">Что-то пошло не так</div>'+
      '<p style="font-size:14px">Похоже, сохранились данные прошлой версии.</p>'+
      '<button class="btn" onclick="hardReset()">Очистить и открыть заново</button>'+
      '<div class="hint">'+esc(e.message)+'</div></div></div>';
  }
}
function hardReset(){ try{ localStorage.removeItem(KEY);}catch(e){} mem=null; state=seed(); save(); location.reload(); }
function draw(){
  var r=document.getElementById('root');
  if(!state.user){ r.innerHTML=loginHTML(); return; }
  var body = openA? agentHTML()
           : nav==='inbox'? inboxHTML()
           : nav==='team' ? teamHTML()
           : nav==='fc'   ? fcHTML()
           : nav==='svod' ? svodHTML()
           : normsHTML();
  r.innerHTML='<div class="app">'+hdrHTML()+body+
    '<div class="foot">ТОЧНО. · кабинет РОПа v2.1 · прототип<br>Данные выдуманные, хранятся только на этом устройстве.<br>'+
    '<button onclick="resetAll()">сбросить и начать заново</button></div></div>'+navHTML();
}
function navHTML(){
  return '<div class="bottom"><div class="in"><div class="nav">'+
    nb('inbox','inbox','Приёмка')+nb('team','users','Отдел')+nb('fc','target','Прогноз')+
    nb('svod','send','Свод')+nb('norms','tune','Нормы')+'</div></div></div>';
}
function nb(k,i,n){ return '<button class="'+(nav===k&&!openA?'on':'')+'" onclick="go(\''+k+'\')"><b>'+ic(i,24)+'</b>'+n+'</button>'; }
function go(k){ nav=k; openA=null; render(); }

function hdrHTML(){
  return '<div class="hdr"><div class="row">'+
    '<div class="mark">ТОЧНО<i>.</i><small>РОП · v2.1</small></div>'+
    '<div class="who"><b>'+esc(state.user)+'</b><span>Отдел №2 · '+rud(state.date)+'</span></div></div>'+
    (isMonday()?'<div class="status"><span class="dm wait"></span>Понедельник: агенты сдают факт за пятницу и выходные</div>':'')+
    '</div>';
}
function loginHTML(){
  var h='<div class="login"><div class="mark">ТОЧНО<i>.</i></div><div class="sub">кабинет РОПа · v2.1</div><h2>Вход в кабинет</h2>';
  for(var i=0;i<ROPS.length;i++)
    h+='<button class="pick'+(pickName===ROPS[i]?' on':'')+'" onclick="pickName=\''+ROPS[i]+'\';render()">'+ROPS[i]+'</button>';
  h+='<div class="lbl">Пароль</div><input type="password" id="pw" placeholder="••••••">'+
     '<div class="sbtn"><button class="btn" onclick="pickName=null;render()">Сброс</button>'+
     '<button class="btn pri" onclick="doLogin()">Войти</button></div>'+
     '<div class="note">Пароль в прототипе любой.</div></div>';

}
function doLogin(){
  var pw=document.getElementById('pw');
  if(!pickName){ alert('Выберите себя из списка'); return; }
  if(!pw.value){ alert('Введите пароль'); return; }
  state.user=pickName; save(); render();
}

/* ================= ПРИЁМКА ================= */
function inboxHTML(){
  var n=state.agents.length, s=sentCount(), a=acceptedCount();
  var h='<div class="card"><div class="t">Утро · срок сдачи 10:00</div><div class="grid">'+
    '<div><b class="'+(s===n?'good':'bad')+'">'+s+'/'+n+'</b><span>сдали</span></div>'+
    '<div><b class="'+(a===s?'good':'')+'">'+a+'/'+s+'</b><span>принято</span></div>'+
    '<div><b class="'+(refusalsAll().length?'bad':'')+'">'+refusalsAll().length+'</b><span>отказов</span></div>'+
    '</div></div>';

  var late=[],wait=[],done=[];
  for(var i=0;i<state.agents.length;i++){ var ag=state.agents[i];
    if(!ag.sent) late.push(ag); else if(!ag.status) wait.push(ag); else done.push(ag); }

  if(late.length){
    h+='<div class="sec warn">Не сдали · '+late.length+'</div>';
    for(var j=0;j<late.length;j++) h+=agentRow(late[j],'late');
    h+='<button class="btn warn" onclick="poke()">Написать всем, кто не сдал</button>';
  }
  if(wait.length){
    h+='<div class="sec">Ждут приёмки · '+wait.length+'</div>';
    for(var k=0;k<wait.length;k++) h+=agentRow(wait[k],'wait');
  }
  if(done.length){
    h+='<div class="sec">Принято</div>';
    for(var m=0;m<done.length;m++) h+=agentRow(done[m],'done');
  }
  h+='<div class="hint">Тап по агенту — весь его вчерашний день, план на сегодня, прогноз и кнопки приёмки.</div>';
  return h;
}
function agentRow(a,kind){
  var rt = kind==='late'? '<span class="rt no">не сдала</span>'
        : kind==='wait'? '<span class="rt mv">принять</span>'
        : '<span class="rt ok">'+({accepted:'принят',extra:'с задачами',rejected:'возвращён'}[a.status])+'</span>';
  var sub = a.sent? 'план '+a.plan+' · сделано '+a.done+(a.refused?' · отказов '+a.refused:'') : 'нет отчёта за вчера';
  return '<button class="item'+(kind==='late'?' alert':(kind==='done'?' done':''))+'" onclick="showAgent('+a.id+')">'+
    '<div class="ic">'+ini(a.name)+'</div><div class="tx"><div class="tp">заявок '+a.leads+' · задатки '+a.month.pd+'/'+normM('pd')+'</div>'+
    '<div class="nm">'+esc(a.name)+'</div><div class="sub">'+sub+'</div></div>'+rt+'</button>';
}
function poke(){ sheet('<h3>Напоминание</h3><div class="sh">тем, кто не сдал</div>'+
  '<div class="hint">В рабочей версии откроется Телеграм с готовым сообщением. В прототипе — просто показываем список.</div>'+
  '<div class="sbtn"><button class="btn" onclick="closeSheet()">Закрыть</button><button class="btn pri" onclick="closeSheet()">Понятно</button></div>'); }

/* ================= КАРТОЧКА АГЕНТА ================= */
function showAgent(id){ openA=agent(id); render(); }
function agentHTML(){
  var a=openA;
  var h='<button class="back" onclick="openA=null;render()">← К списку</button>'+
    '<div class="card"><div class="t">'+esc(a.name)+'</div><div class="grid">'+
    '<div><b>'+a.done+'/'+a.plan+'</b><span>вчера</span></div>'+
    '<div><b class="'+(a.refused?'bad':'')+'">'+a.refused+'</b><span>отказов</span></div>'+
    '<div><b>'+a.leads+'</b><span>заявок</span></div></div>'+
    '<div class="kv" style="margin-top:10px"><span>Статус отчёта</span><b class="'+(a.sent?(a.status?'g':'s'):'r')+'">'+
      (a.sent?(a.status?({accepted:'принят',extra:'принят с задачами',rejected:'возвращён'}[a.status]):'ждёт приёмки'):'не сдан')+'</b></div></div>';

  if(a.tasks.length){
    h+='<div class="sec">Факт за вчера · '+rud(state.dateY)+'</div>';
    for(var i=0;i<a.tasks.length;i++){ var t=a.tasks[i], c=C(t.cls);
      var rt = t.st==='done'? '<span class="rt ok">сделано</span>'
             : t.st==='refuse'? '<span class="rt no">отказ</span>'
             : '<span class="rt mv">перенос '+(t.to?ru(t.to):'')+'</span>';
      var sub=[]; if(t.cl) sub.push(t.cl); if(t.sum) sub.push(money(t.sum));
      if(t.reason) sub.push(t.reason); if(t.res) sub.push(t.res); if(t.why) sub.push('«'+t.why+'»');
      h+='<div class="item'+(t.st==='refuse'?' alert':'')+'"><div class="ic">'+ic(c.ic)+'</div><div class="tx">'+
         '<div class="tp">'+c.n+'</div><div class="nm">'+esc(t.obj)+'</div>'+
         '<div class="sub" style="white-space:normal">'+esc(sub.join(' · '))+'</div></div>'+rt+'</div>';
    }
  }
  h+='<div class="sec">Неделя · норма на агента</div><div class="card">';
  for(var j=0;j<NORMKEYS.length;j++){ var k=NORMKEYS[j].k, d=a.week[k]||0, n=normW(k);
    h+='<div class="kv"><span>'+NORMKEYS[j].l+'</span><b class="'+(d>=n?'g':'')+'">'+d+' / '+n+'</b></div>'; }
  h+='</div>';

  if(a.fc.length){
    h+='<div class="sec">Прогноз по задаткам</div>';
    for(var q=0;q<a.fc.length;q++){ var f=a.fc[q];
      h+='<div class="item"><div class="ic">'+ic('money')+'</div><div class="tx"><div class="tp">'+ru(f.date)+'</div>'+
         '<div class="nm">'+esc(f.obj)+'</div><div class="sub">'+esc(f.cl)+'</div></div>'+
         '<span class="rt '+(f.done?'ok':'wait')+'">'+money(f.sum)+'</span></div>'; }
  }
  if(a.rop.length){
    h+='<div class="sec">Мои задачи ей</div>';
    for(var w=0;w<a.rop.length;w++){ var rt2=a.rop[w];
      h+='<div class="item"><div class="ic">'+ic('pin')+'</div><div class="tx"><div class="nm" style="white-space:normal">'+esc(rt2.text)+'</div>'+
         '<div class="sub">'+(rt2.done===null?'ждёт ответа':(rt2.done?'сделано':'не сделано: '+esc(rt2.why)))+'</div></div></div>'; }
  }
  if(a.sent&&!a.status) h+='<button class="btn pri" onclick="openAccept()">Принять отчёт</button>';
  h+='<button class="btn" onclick="openTask()">+ Поставить задачу</button>'+
     '<button class="btn ghost" onclick="resetPw()">Сбросить пароль</button>';
  return h;
}
function openAccept(){
  sheet('<h3>Приёмка отчёта</h3><div class="sh">'+esc(openA.name)+' · '+rud(state.dateY)+'</div>'+
    '<div class="kv"><span>План / факт</span><b>'+openA.plan+' / '+openA.done+'</b></div>'+
    '<div class="kv"><span>Отказов</span><b class="'+(openA.refused?'r':'')+'">'+openA.refused+'</b></div>'+
    '<div class="lbl">Решение</div><div class="chips">'+
    '<button class="chip" onclick="accept(\'accepted\')">Принять</button>'+
    '<button class="chip" onclick="accept(\'extra\')">Принять с задачей</button>'+
    '<button class="chip" style="grid-column:1/-1" onclick="accept(\'rejected\')">Вернуть на доработку</button></div>'+
    '<div class="sbtn"><button class="btn" onclick="closeSheet()">Отмена</button>'+
    '<button class="btn ghost" onclick="closeSheet()">Позже</button></div>');
}
function accept(st){
  openA.status=st; save();
  if(st==='extra'){ closeSheet(); return openTask(); }
  closeSheet(); render();
}
function openTask(){
  sheet('<h3>Задача для '+esc(openA.name)+'</h3><div class="sh">появится сверху в её плане</div>'+
    '<div class="lbl">Что сделать</div><input id="tTx" placeholder="Разобрать портфель">'+
    '<div class="lbl">На какой день</div><input type="date" id="tDate" value="'+state.date+'" min="'+state.date+'">'+
    '<div class="hint">Агент отчитается «да» или «нет», и в случае «нет» напишет почему.</div>'+
    '<div class="sbtn"><button class="btn" onclick="closeSheet()">Отмена</button>'+
    '<button class="btn pri" onclick="saveTask()">Поставить</button></div>');
}
function saveTask(){
  var t=document.getElementById('tTx'), dd=document.getElementById('tDate');
  if(!t.value){ alert('Напишите задачу'); return; }
  openA.rop.push({id:++state.seq,text:t.value,date:dd.value,done:null,why:''});
  save(); closeSheet(); render();
}
function resetPw(){
  sheet('<h3>Сбросить пароль?</h3><div class="sh">'+esc(openA.name)+'</div>'+
    '<div class="hint">В рабочей версии агент получит новый пароль в Телеграме, а все его сессии закроются.</div>'+
    '<div class="sbtn"><button class="btn" onclick="closeSheet()">Отмена</button>'+
    '<button class="btn pri" onclick="closeSheet()">Сбросить</button></div>');
}

/* ================= ОТДЕЛ ================= */
function teamHTML(){
  var isW=normMode==='week';
  var h='<div class="card"><div class="t">Период</div><div class="chips">'+
    '<button class="chip'+(isW?' on':'')+'" onclick="normMode=\'week\';render()">Неделя</button>'+
    '<button class="chip'+(!isW?' on':'')+'" onclick="normMode=\'month\';render()">Месяц</button></div></div>';
  var sum=0,need=0;
  for(var i=0;i<NORMKEYS.length;i++){ var k=NORMKEYS[i].k;
    sum+=(isW?teamWeek(k):teamMonth(k)); need+=(isW?teamNormW(k):teamNormM(k)); }
  h+='<div class="card"><div class="t">Отдел · '+state.agents.length+' человек</div>'+
     '<div class="kv"><span>Исполнение</span><b class="'+(sum>=need?'g':'')+'">'+Math.round(sum/need*100)+'%</b></div>'+
     '<div class="bar"><i style="width:'+Math.min(Math.round(sum/need*100),100)+'%"></i></div>';
  for(var j=0;j<NORMKEYS.length;j++){ var kk=NORMKEYS[j].k, d=isW?teamWeek(kk):teamMonth(kk), n=isW?teamNormW(kk):teamNormM(kk);
    h+='<div class="kv"><span>'+NORMKEYS[j].l+'</span><b class="'+(d>=n?'g':'')+'">'+d+' / '+n+' · '+Math.round(d/n*100)+'%</b></div>'; }
  h+='</div>';
  h+='<div class="sec">Агенты · '+(isW?'неделя':'месяц')+'</div>';
  var list=state.agents.slice().sort(function(a,b){
    var pa=(isW?a.week.pd:a.month.pd), pb=(isW?b.week.pd:b.month.pd); return pb-pa; });
  for(var m=0;m<list.length;m++){ var a=list[m];
    var d=isW?a.week:a.month, n=isW?normW('pd'):normM('pd');
    var tot=0,nd=0;
    for(var q=0;q<NORMKEYS.length;q++){ var key=NORMKEYS[q].k; tot+=d[key]||0; nd+=(isW?normW(key):normM(key)); }
    var p=Math.round(tot/nd*100);
    h+='<button class="item" onclick="showAgent('+a.id+')"><div class="ic">'+ini(a.name)+'</div><div class="tx">'+
       '<div class="tp">задатки '+(d.pd||0)+'/'+n+' · отказов '+a.refused+'</div>'+
       '<div class="nm">'+esc(a.name)+'</div></div>'+
       '<span class="rt '+(p>=100?'ok':(p<60?'no':'mv'))+'">'+p+'%</span></button>';
  }
  var refs=refusalsAll();
  h+='<div class="sec warn">Отказы за период · '+refs.length+'</div>';
  if(!refs.length) h+='<div class="hint">Отказов нет.</div>';
  for(var r=0;r<refs.length;r++){ var x=refs[r];
    h+='<button class="item alert" onclick="showAgent('+x.id+')"><div class="ic">'+ic(C(x.r.cls).ic)+'</div><div class="tx">'+
       '<div class="tp">'+C(x.r.cls).n+' · '+esc(x.who)+'</div><div class="nm">'+esc(x.r.obj)+'</div>'+
       '<div class="sub" style="white-space:normal">'+esc(x.r.reason)+' · «'+esc(x.r.why)+'»</div></div></button>'; }
  h+='<div class="hint">Отказ в норму не идёт, но время агента потрачено — поэтому он виден отдельной строкой и поимённо.</div>';
  return h;
}

/* ================= ПРОГНОЗ ================= */
function fcHTML(){
  var it=fcAll(fcMode), ps=0, fs=0, fn=0;
  for(var i=0;i<it.length;i++){ ps+=Number(it[i].f.sum||0); if(it[i].f.done){ fn++; fs+=Number(it[i].f.sum||0); } }
  var h='<div class="card"><div class="t">Прогноз отдела по задаткам</div>'+
    '<div class="chips three" style="margin-bottom:12px">'+
    fcTab('week','Неделя')+fcTab('month','Месяц')+fcTab('future','Дальше')+'</div>'+
    '<div class="big">'+money(ps)+'<small>план · задатков: '+it.length+'</small></div>'+
    '<div class="bar"><i style="width:'+(ps?Math.min(Math.round(fs/ps*100),100):0)+'%"></i></div>'+
    '<div class="kv"><span>Факт</span><b class="g">'+money(fs)+' · '+fn+' из '+it.length+'</b></div>'+
    (fcMode!=='future'?'<div class="kv"><span>Норма отдела</span><b>'+
      (fcMode==='week'?teamNormW('pd')+' задатков в неделю':teamNormM('pd')+' в месяц')+'</b></div>':'')+
    '</div>';
  h+='<div class="sec">Объекты</div>';
  for(var j=0;j<it.length;j++){ var x=it[j];
    h+='<button class="item" onclick="showAgent('+x.id+')"><div class="ic">'+ic('money')+'</div><div class="tx">'+
       '<div class="tp">'+ru(x.f.date)+' · '+esc(x.who)+'</div><div class="nm">'+esc(x.f.obj)+'</div>'+
       '<div class="sub">'+esc(x.f.cl)+'</div></div>'+
       '<span class="rt '+(x.f.done?'ok':'wait')+'">'+money(x.f.sum)+'</span></button>'; }
  if(!it.length) h+='<div class="hint">В этом периоде задатков нет.</div>';
  h+='<div class="hint">Опоздавший задаток — промах недели, но попадание месяца. Поэтому недельный и месячный прогноз считаются раздельно.</div>';
  return h;
}
function fcTab(m,n){ return '<button class="chip'+(fcMode===m?' on':'')+'" onclick="fcMode=\''+m+'\';render()">'+n+'</button>'; }

/* ================= СВОД ================= */
function svodHTML(){
  var n=state.agents.length, s=sentCount(), refs=refusalsAll();
  if(state.sentUp){
    return '<div class="card" style="text-align:center"><div class="big">Свод отправлен</div>'+
      '<div class="hint" style="margin-top:12px">Владелец получил факт за вчера и план на сегодня. Обычно это занимало полтора часа.</div></div>'+
      '<button class="btn ghost" onclick="state.sentUp=false;save();render()">Показать свод снова</button>';
  }
  var plan=sumBy(function(a){return a.plan;}), done=sumBy(function(a){return a.done;});
  var h='<div class="card"><div class="t">Свод за '+rud(state.dateY)+' · собран сам</div>'+
    '<div class="kv"><span>План / факт по делам</span><b>'+plan+' / '+done+'</b></div>'+
    '<div class="kv"><span>Отказов</span><b class="'+(refs.length?'r':'')+'">'+refs.length+'</b></div>'+
    '<div class="kv"><span>Заявок</span><b>'+sumBy(function(a){return a.leads;})+'</b></div>'+
    '<div class="kv"><span>Сдали до 10:00</span><b class="'+(s===n?'g':'r')+'">'+s+' из '+n+'</b></div></div>';
  h+='<div class="card"><div class="t">По классам · неделя</div>';
  for(var i=0;i<NORMKEYS.length;i++){ var k=NORMKEYS[i].k, d=teamWeek(k), nn=teamNormW(k);
    h+='<div class="kv"><span>'+NORMKEYS[i].l+'</span><b class="'+(d>=nn?'g':'')+'">'+d+' / '+nn+'</b></div>'; }
  h+='</div>';
  h+='<div class="sec warn">Отказы поимённо</div>';
  if(!refs.length) h+='<div class="hint">Отказов нет.</div>';
  for(var j=0;j<refs.length;j++){ var x=refs[j];
    h+='<div class="item alert"><div class="ic">'+ic(C(x.r.cls).ic)+'</div><div class="tx">'+
       '<div class="tp">'+C(x.r.cls).n+' · '+esc(x.who)+'</div><div class="nm">'+esc(x.r.obj)+'</div>'+
       '<div class="sub" style="white-space:normal">'+esc(x.r.reason)+' · «'+esc(x.r.why)+'»</div></div></div>'; }
  h+='<div class="sec">Комментарий по отделу</div>'+
     '<div class="card" style="padding:11px"><textarea id="cm" placeholder="Объяснить то, что требует контекста" oninput="state.comment=this.value">'+esc(state.comment)+'</textarea></div>'+
     '<button class="btn pri" onclick="sendUp()">Отправить владельцу · до 11:00</button>'+
     '<div class="hint" style="margin-top:10px">Дописывать нужно только там, где цифра без объяснения читается неверно.</div>';
  return h;
}
function sendUp(){ state.sentUp=true; save(); render(); }

/* ================= НОРМЫ ================= */
function normsHTML(){
  var h='<div class="card"><div class="t">Нормы на агента · месяц</div>';
  for(var i=0;i<NORMKEYS.length;i++){ var k=NORMKEYS[i].k;
    h+='<div class="kv"><span>'+NORMKEYS[i].l+'</span><b>'+normM(k)+' в месяц · '+normW(k)+' в неделю</b></div>'; }
  h+='</div><button class="btn" onclick="openNorms()">Изменить нормы</button>'+
     '<div class="hint" style="margin-top:10px">Недельная норма считается автоматически: месячная ÷ 4,33 с округлением вверх. Задаётся только месячная.</div>';
  h+='<div class="card"><div class="t">Кабинет</div>'+
     '<div class="kv"><span>РОП</span><b>'+esc(state.user)+'</b></div>'+
     '<div class="kv"><span>Отдел</span><b>№2 · '+state.agents.length+' человек</b></div>'+
     '<div class="kv"><span>Чужие отделы</span><b>не видны</b></div></div>'+
     '<button class="btn ghost" onclick="logout()">Выйти из кабинета</button>';
  return h;
}
function openNorms(){
  var h='<h3>Нормы на агента</h3><div class="sh">месяц · неделя считается сама</div>';
  for(var i=0;i<NORMKEYS.length;i++){ var k=NORMKEYS[i].k;
    h+='<div class="lbl">'+NORMKEYS[i].l+'</div><input type="number" inputmode="numeric" id="n_'+k+'" value="'+normM(k)+'">'; }
  h+='<div class="sbtn"><button class="btn" onclick="closeSheet()">Отмена</button>'+
     '<button class="btn pri" onclick="saveNorms()">Сохранить</button></div>';
  sheet(h);
}
function saveNorms(){
  for(var i=0;i<NORMKEYS.length;i++){ var k=NORMKEYS[i].k, e=document.getElementById('n_'+k);
    if(e&&e.value!=='') state.norm[k]=Number(e.value); }
  save(); closeSheet(); render();
}
function logout(){ state.user=null; pickName=null; save(); render(); }

/* ================= общее ================= */
function sheet(h){ document.getElementById('sheet').innerHTML=h; document.getElementById('ovl').classList.add('on'); }
function closeSheet(){ document.getElementById('ovl').classList.remove('on'); }
function resetAll(){
  sheet('<h3>Сбросить прототип?</h3><div class="sh">данные вернутся к исходным</div>'+
    '<div class="hint">Приёмка, задачи и свод будут стёрты.</div>'+
    '<div class="sbtn"><button class="btn" onclick="closeSheet()">Отмена</button>'+
    '<button class="btn pri" onclick="doReset()">Сбросить</button></div>');
}
function doReset(){ var u=state.user; state=seed(); state.user=u; save(); nav='inbox'; openA=null; closeSheet(); render(); }
render();
</script>
